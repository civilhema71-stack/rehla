<!doctype html><html lang="ar" dir="rtl"><head><script>/* iphone-web: Safari speech fix (speak right after cancel) */(function(){try{var s=window.speechSynthesis;if(!s)return;var oc=s.cancel.bind(s),os=s.speak.bind(s),t=0;s.cancel=function(){t=Date.now();oc()};s.speak=function(u){var d=Date.now()-t;if(d<150)setTimeout(function(){os(u)},150-d);else os(u)}}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رحلة اللغة الإنجليزية</title>

<style>:root{--bg:#eef4fb;--card:#fff;--ink:#1c2733;--mut:#5f6f82;--acc:#2563eb;--acc2:#f59e0b;--ok:#16a34a;--bad:#dc2626;--line:#d6e0ee;--soft:#e6efff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1722;--card:#18222f;--ink:#eaf1fa;--mut:#9fb0c4;--acc:#6ea0ff;--acc2:#fbbf24;--ok:#4ade80;--bad:#f87171;--line:#2b3a4e;--soft:#1f2e45}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:1.45rem;font-weight:900;margin:0}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 14px;font:inherit;font-weight:700;color:var(--ink);white-space:nowrap}
button.pill{cursor:pointer}
.sub{color:var(--mut);margin:0 0 10px}
.lvbox{display:flex;justify-content:space-between;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;margin-bottom:10px;font-weight:700}
.btn{display:block;width:100%;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:13px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:8px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.gold{background:var(--acc2);color:#2a1d00}
.btn:focus-visible,.ch:focus-visible,.row:focus-visible,.card:focus-visible,.tok:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.grp{font-size:1.05rem;color:var(--acc);margin:18px 0 6px;font-weight:900}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.row[disabled]{opacity:.5;cursor:not-allowed}
.row b{display:block}.row small{color:var(--mut)}
.ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:1.4rem}
.stars{margin-inline-start:auto;color:#e8a317;letter-spacing:2px;white-space:nowrap}
.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{flex:1}
.tabs .on{background:var(--acc);color:#fff;border-color:var(--acc)}
.unit{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:12px}
.unit h3{margin:0;font-size:1.05rem;direction:ltr;text-align:left}.unit h3 small{display:block;direction:rtl;text-align:right;color:var(--mut);font-weight:400}
.unit .row{margin:8px 0 0;border-width:1px}
.tag{font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--mut);margin-inline-start:6px}
.tag.v{background:#dcfce7;color:#166534}
.q{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.en{direction:ltr;unicode-bidi:isolate;text-align:left}
.eq{font-size:1.35rem;font-weight:700;text-align:center}
.big{font-size:3.2rem;text-align:center;line-height:1.2}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 8px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
.ch.en{text-align:center}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{border-radius:16px;padding:12px 14px;margin:12px 0;border:2px solid var(--line);background:var(--card)}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}.fb h3{margin:0 0 4px;font-size:1.1rem}
.bar{display:block;height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.card .em{font-size:2.4rem;line-height:1.2}.card b{display:block;direction:ltr;font-size:1.15rem}.card span{color:var(--mut)}
.card:active{transform:scale(.97)}
.say{border:0;background:var(--soft);border-radius:50%;width:40px;height:40px;font-size:1.2rem;cursor:pointer;flex:none}
.ans{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr;margin:8px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:center;margin:8px 0}
.tok{background:var(--soft);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;min-width:38px}
.tok.gone{visibility:hidden}
.pass p{direction:ltr;text-align:left;margin:0 0 8px;font-size:1.05rem}
.pass p span{cursor:pointer;border-radius:6px}.pass p span:hover{background:var(--soft)}
.tr{color:var(--mut);direction:rtl;text-align:right;font-size:.95rem}
.gram{border:2px solid var(--acc);border-radius:16px;padding:12px 14px;background:var(--soft);margin:10px 0}.gram h3{margin:0 0 4px;font-size:1.05rem}.gram p{margin:4px 0}
.note{background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0;color:var(--mut);font-size:.95rem}
.end{text-align:center}.end .bigs{font-size:3rem;color:#e8a317;letter-spacing:6px}
.credit{text-align:center;color:var(--mut);margin:26px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.credit b{color:var(--ink)}.credit p{margin:8px 0 0;font-size:1.05rem}.credit .me{width:170px;height:182px;border-radius:20px;object-fit:cover;border:4px solid var(--acc);display:block;margin:0 auto;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50}
.conf{position:fixed;top:-10px;width:9px;height:14px;border-radius:2px;z-index:40;animation:cf 2.5s linear forwards;pointer-events:none}
@keyframes cf{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}}
[hidden]{display:none!important}
:root[data-theme="dark"]{--bg:#0f1722;--card:#18222f;--ink:#eaf1fa;--mut:#9fb0c4;--acc:#6ea0ff;--acc2:#fbbf24;--ok:#4ade80;--bad:#f87171;--line:#2b3a4e;--soft:#1f2e45}

const clap=()=>{[0,90,180,300].forEach(t=>setTimeout(()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const b=AC.createBuffer(1,2200,22050),d=b.getChannelData(0);for(let i=0;i<2200;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/2200,3);const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=.5;s.connect(g);g.connect(AC.destination);s.start()}catch(e){}},t))};

 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||.85;
 const v=speechSynthesis.getVoices().find(v=>/^en[-_]US/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}

function build(){
 GR.forEach(G=>[1,2].forEach(t=>{const us=UN.filter(u=>u.g==G[0]&&u.t==t).sort((a,b)=>a.n-b.n),list=[];
  us.forEach(u=>{[['v',u.v.length],["g",u.s.length||u.gr],['r',u.r]].forEach(([k,ok])=>{if(!ok)return;const L={id:`${G[0]}.${t}.${u.n}.${k}`,k,u,g:G[0],t};LS[L.id]=L;list.push(L)})});

function poolOf(g){return UN.filter(u=>u.g==g).flatMap(u=>u.v)}
function dist(w,pool,key,n){const seen=new Set([w[key]]);const out=[];shuf(pool.concat(Object.values(W))).forEach(x=>{if(out.length<n&&x[key]&&!seen.has(x[key])&&x.en.toLowerCase()!=w.en.toLowerCase()&&x.ar!=w.ar){seen.add(x[key]);out.push(x[key])}});return out}

 return vq(w,pool,3)}
function sq(s,all){const words=s.en.replace(/[.?!]/g,'').split(/\s+/);
 if(Math.random()<.5&&words.length>=2){const ex=s.en.split(/\s+/),o=[{t:'ord',p:`رتّب الكلمات لتكوّن الجملة:<br><b>${esc(s.ar)}</b>`,w:s.en.split(/\s+/),j:' ',sp:s.en,why:s.en+' = '+s.ar}];return o[0]}
 const ds=[...new Set(shuf(all.concat(Object.values(W))).map(x=>x.ar).filter(a=>a&&a!==s.ar))].slice(0,3);const op=shuf([s.ar,...ds]);
 return{t:'ch',p:`ما معنى الجملة؟<div class="eq en">${esc(s.en)}</div>`,o:op,a:op.indexOf(s.ar),sp:s.en,why:s.en+' = '+s.ar}}

 if(L.k=='g'){const all=UN.filter(x=>x.g==L.g).flatMap(x=>x.s);const ss=shuf(u.s).slice(0,6);ss.forEach(s=>q.push(sq(s,all.length>=4?all:all.concat(Object.values(W).slice(0,6)))));
  (u.gr&&u.gr[2]||[]).forEach(a=>{const o=shuf(a.slice(1,5));q.push({t:'ch',p:`<div class="eq en">${esc(a[0])}</div>`,o,a:o.indexOf(a[1]),en:true,why:a[5]||''})})}

function head(){return`<div class="top"><h1>🇬🇧 رحلة اللغة الإنجليزية</h1><span><button class="pill" onclick="S.theme=document.documentElement.dataset.theme=='dark'?'light':'dark';applyTheme();save()" aria-label="الوضع الليلي">🌓</button> <span class="pill">⭐ ${S.pts}</span> <span class="pill">🔥 ${S.streak}</span></span></div>`}
const credit=()=>`<div class="credit"><img class="me" alt="ابراهيم عماره" src="${FACE}"><p>إعداد: <b>ابراهيم عماره</b></p><p>مع أطيب التمنيات بالتفوق والنجاح 💙</p></div>`;
function total(g){let n=0,s=0;[1,2].forEach(t=>ORDER[g+'.'+t].forEach(L=>{n++;s+=stars(L.id)>0?1:0}));return[s,n]}
function home(){const hn=Object.keys(S.hard).length;let h=head()+`<div class="lvbox"><span>${LV[lvl()][1]}</span><span>${S.pts} نقطة</span></div>`;
 if(hn)h+=`<button class="btn gold" onclick="hardRun()">🔁 راجع كلماتك الصعبة (${hn})</button>`;
 h+=`<p class="sub">اختر صفّك الدراسي. كل صف له فهرس دروس مثل الكتاب، ${OPEN?'كل الدروس مفتوحة: تنقّل كما تشاء وراجع أي جزء.':'والدروس تُفتح بالترتيب.'}</p>`;let st='';
 GR.forEach(G=>{if(G[4]!=st){st=G[4];h+=`<div class="grp">${st}</div>`}const[s,n]=total(G[0]);h+=`<button class="row" onclick="go('grade',{g:'${G[0]}',t:${V.t||1}})"><span class="ic">${G[3]}</span><span><b>${G[2]}</b><small class="en" style="display:block">${G[1]} · ${s}/${n} lessons</small></span></button>`});
 return h+credit()}
function grade(){const G=GR.find(x=>x[0]==V.g),t=V.t;let h=head()+`<button class="pill" onclick="go('home')">← الرئيسية</button><div class="grp">${G[3]} ${G[2]}</div><div class="tabs"><button class="pill ${t==1?'on':''}" onclick="go('grade',{g:'${V.g}',t:1})">الفصل الدراسي الأول</button><button class="pill ${t==2?'on':''}" onclick="go('grade',{g:'${V.g}',t:2})">الفصل الدراسي الثاني</button></div><div class="note">📚 فهرس الدروس (Table of Contents). عناوين الوحدات هنا «تقريبية»: محتوى مناسب لمستوى الصف لكن ترتيبه قد يختلف عن كتاب الوزارة، وأي وحدة مطابقة تماماً للكتاب تحمل شارة ✔ من المنهج.</div>`;
 const us=UN.filter(u=>u.g==V.g&&u.t==t).sort((a,b)=>a.n-b.n);
 if(!us.length)h+='<p class="sub">لا توجد وحدات لهذا الفصل بعد.</p>';
 us.forEach(u=>{h+=`<div class="unit"><h3 class="en">Unit ${u.n}: ${esc(u.en)}<small>الوحدة ${u.n}: ${esc(u.ar)} <span class="tag ${u.src=='v'?'v':''}">${u.src=='v'?'✔ من المنهج':'تقريبي'}</span></small></h3>`;
  ORDER[V.g+'.'+t].filter(L=>L.u===u).forEach(L=>h+=lrow(L));h+='</div>'});
 const rv=ORDER[V.g+'.'+t].find(L=>L.k=='x');if(rv)h+=`<div class="unit"><h3 class="en">Term Review<small>مراجعة الفصل</small></h3>${lrow(rv)}</div>`;
 return h+credit()}
function lrow(L){const o=open_(L),s=stars(L.id);return`<button class="row" ${o?'':'disabled'} onclick="start('${L.id}')"><span class="ic">${o?KIND[L.k][1]:'🔒'}</span><span><b>${KIND[L.k][0]}</b></span><span class="stars">${'★'.repeat(s)}${'☆'.repeat(3-s)}</span></button>`}
function start(id){const L=LS[id];Q={L,i:0,ok:0,qs:null,done:false};go('learn')}
function learn(){const L=Q.L,u=L.u;let h=head()+`<button class="pill" onclick="go('grade',{g:'${L.g}',t:${L.t}})">← الفهرس</button><div class="grp en" style="direction:ltr;text-align:left">Unit ${u.n||''} ${esc(u.en)}</div><p class="sub">${KIND[L.k][0]}</p>`;
 if(L.k=='x')h+=`<div class="note">اختبار شامل على كلمات وجمل وقواعد الفصل.</div>`;
 if(L.k=='v'){if(u.ph)h+=`<div class="note">🎵 ${esc(u.ph)}</div>`;h+='<p class="sub">اضغط على أي بطاقة لتسمع النطق:</p><div class="cards">'+u.v.map(w=>`<button class="card" onclick="say('${w.en.replace(/'/g,"\\'")}')">${w.em?`<span class="em">${w.em}</span>`:''}<b>${esc(w.en)}</b><span>${esc(w.ar)} 🔊</span></button>`).join('')+'</div>'}
 if(L.k=='g'){if(u.gr)h+=`<div class="gram"><h3>💡 ${esc(u.gr[0])}</h3><p>${u.gr[1]}</p></div>`;h+=u.s.map(s=>`<div class="row" style="cursor:default"><button class="say" onclick="say('${s.en.replace(/'/g,"\\'")}')" aria-label="استماع">🔊</button><span><b class="en">${esc(s.en)}</b><small>${esc(s.ar)}</small></span></div>`).join('')}
 if(L.k=='r'){h+=`<div class="q pass"><h3 class="en" style="margin-top:0">${esc(u.r[0])}</h3>`+u.r[1].split('\n').map(p=>`<p>${p.split(/(?<=[.!?])\s+/).map(x=>`<span onclick="say(this.textContent)">${esc(x)}</span>`).join(' ')}</p>`).join('')+`<button class="btn alt" onclick="say(this.dataset.t)" data-t="${esc(u.r[1].replace(/\n/g,' '))}">🔊 استمع للنص كاملاً</button><button class="btn alt" onclick="$('#tr').hidden=!$('#tr').hidden">🌐 الترجمة</button><div id="tr" class="tr" hidden>${esc(u.r[2]).replace(/\n/g,'<br>')}</div><p class="sub">اضغط على أي جملة لتسمعها.</p></div>`}
 return h+`<button class="btn" onclick="Q.qs=mkQs(Q.L);go('quiz')">ابدأ التمرين ✏️</button>`}
function quiz(){const q=Q.qs[Q.i];let h=head()+`<span class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></span><div class="q">`;
 h+=`<div class="eq" style="font-size:1.1rem">${q.p}</div>`;if(q.sp)h+=`<div style="text-align:center"><button class="say" onclick="say(Q.qs[Q.i].sp)" aria-label="استماع">🔊</button></div>`;
 if(q.t=='ch')h+='<div class="chs" style="margin-top:12px">'+q.o.map((o,i)=>`<button class="ch ${q.en?'en':''}" onclick="pick(${i})">${esc(o)}</button>`).join('')+'</div>';
 else{Q.ans=[];h+=`<div class="ans" id="ans"></div><div class="bank" id="bank">`+shuf(q.w.map((x,i)=>[x,i])).map(([x,i])=>`<button class="tok" id="t${i}" onclick="tok(${i})">${esc(x)}</button>`).join('')+`</div><button class="btn" id="chk" onclick="chk()" disabled>تحقق</button>`}
 h+='</div><div id="fb"></div>';return h}
function pick(i){const q=Q.qs[Q.i];if(Q.locked)return;Q.locked=1;const bs=document.querySelectorAll('.ch');bs[q.a].classList.add('ok');if(i!=q.a)bs[i].classList.add('no');fin(i==q.a,q)}
function tok(i){const q=Q.qs[Q.i];if(Q.locked)return;const k=Q.ans.indexOf(i);if(k>=0)Q.ans.splice(k,1);else Q.ans.push(i);drawAns()}
function drawAns(){const q=Q.qs[Q.i];$('#ans').innerHTML=Q.ans.map(i=>`<button class="tok" onclick="tok(${i})">${esc(q.w[i])}</button>`).join('');q.w.forEach((_,i)=>$('#t'+i).classList.toggle('gone',Q.ans.includes(i)));$('#chk').disabled=Q.ans.length!=q.w.length}
function chk(){const q=Q.qs[Q.i];if(Q.locked)return;Q.locked=1;const ok=Q.ans.map(i=>q.w[i]).join(q.j)==q.w.join(q.j);$('#chk').hidden=true;fin(ok,q)}
function fin(ok,q){if(ok){Q.ok++;clap();bump(10);if(S.hard[q.k]){delete S.hard[q.k];save()}}else{buzz();if(q.k){S.hard[q.k]=1;save()}}
 if(q.sp&&ok)say(q.sp);
 const last=Q.i==Q.qs.length-1;$('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><h3>${ok?'أحسنت! 🎉':'حاول مرة أخرى 💪'}</h3>${q.why?`<div class="${/[A-Za-z]/.test(q.why)&&!/[؀-ۿ]/.test(q.why)?'en':''}">${esc(q.why)}</div>`:''}${!ok&&q.t=='ord'?`<div class="en"><b>${esc(q.w.join(q.j))}</b></div>`:''}</div><button class="btn" onclick="nxt()">${last?'النتيجة':'التالي'}</button>`;$('#fb').scrollIntoView({block:'nearest'})}
function nxt(){Q.locked=0;Q.i++;if(Q.i>=Q.qs.length)return go('end');render()}
function end(){const n=Q.qs.length,p=Q.ok/n,s=p>=1?3:p>=.8?2:p>=.6?1:0;const old=stars(Q.L.id);if(s>old){S.prog[Q.L.id]=s;save()}if(!Q.rec){Q.rec=1;daily();if(s>=2){fanfare();confetti()}bump(s*5)}
 const nx=ORDER[Q.L.g+'.'+Q.L.t],i=nx.indexOf(Q.L),N=nx[i+1];
 return head()+`<div class="q end"><div class="bigs">${'★'.repeat(s)}${'☆'.repeat(3-s)}</div><h2>${s?'نتيجة رائعة!':'لا بأس، جرّب مرة أخرى'}</h2><p>أجبت صح ${Q.ok} من ${n}</p>${s==0?'<p class="sub">تحتاج 60% على الأقل لفتح الدرس التالي.</p>':''}</div><button class="btn alt" onclick="start('${Q.L.id}')">🔁 إعادة الدرس</button>${N&&s>=1?`<button class="btn" onclick="start('${N.id}')">الدرس التالي ▶</button>`:''}<button class="btn alt" onclick="go('grade',{g:'${Q.L.g}',t:${Q.L.t}})">📚 الفهرس</button>`}
function hardRun(){const pool=Object.values(W);const ks=Object.keys(S.hard).filter(k=>W[k.toLowerCase()]);if(!ks.length){S.hard={};save();return render()}
 const L={id:'hard',k:'h',g:'k1',t:1,u:{en:'Hard words',ar:'',v:[],s:[]}};Q={L,i:0,ok:0,qs:shuf(ks).slice(0,10).map(k=>vq(W[k.toLowerCase()],pool,rnd([0,2,3]))),rec:1};ORDER['k1.1'].indexOf(L);V={v:'quiz'};render()}
const _end=end;
function render(){let h;try{h=({home,grade,learn,quiz,end:()=>Q.L.id=='hard'?hend():end()})[V.v]()}catch(e){h='<p>حدث خطأ: '+esc(e.message)+'</p>';console.error(e)}$('#app').innerHTML=h;if(V.v=='quiz'){const q=Q.qs[Q.i];if(q.auto)setTimeout(()=>say(q.sp),250)}}
function hend(){return head()+`<div class="q end"><div class="bigs">🌟</div><h2>أحسنت المراجعة!</h2><p>أجبت صح ${Q.ok} من ${Q.qs.length}</p></div><button class="btn" onclick="go('home')">الرئيسية</button>`}

U('p3',1,4,'Daily Routine','الروتين اليومي',{v:'wake up=يستيقظ=⏰|brush=ينظّف بالفرشاة=🪥|breakfast=إفطار=🥣|lunch=غداء=🍛|dinner=عشاء=🍽️|homework=واجب=📝|bedtime=وقت النوم=🛏️|o\'clock=الساعة=🕐',s:'I wake up at seven o\'clock.=أستيقظ الساعة السابعة|I brush my teeth.=أنظف أسناني|He has lunch at two.=هو يتناول الغداء في الثانية|We have dinner at eight.=نتناول العشاء في الثامنة',g:['He / She + s','مع <b>He / She / It</b> نضيف s للفعل: he plays, she reads.',[['She ___ breakfast at seven.','has','have','having','had','مع She نقول has.'],['He ___ to school.','goes','go','going','gone','مع He نقول goes.']]]});
U('p3',2,1,'Animals Around Us','الحيوانات حولنا',{v:'lion=أسد=🦁|elephant=فيل=🐘|monkey=قرد=🐒|giraffe=زرافة=🦒|snake=ثعبان=🐍|camel=جمل=🐪|wild=بري=🐯|pet=حيوان أليف=🐶',s:'The lion is strong.=الأسد قوي|The giraffe is tall.=الزرافة طويلة|Camels live in the desert.=الجمال تعيش في الصحراء|I have a pet.=عندي حيوان أليف',r:['The Zoo','We go to the zoo on Friday. I see a big elephant and a tall giraffe. The monkeys are funny.\nI like the zoo very much!','نذهب إلى حديقة الحيوان يوم الجمعة. أرى فيلاً كبيراً وزرافة طويلة. القرود مضحكة.\nأحب حديقة الحيوان جداً!',[['When do they go to the zoo?','On Friday','On Monday','On Sunday','At night','يذهبون يوم الجمعة.'],['Who is funny?','The monkeys','The lion','The snake','The giraffe','القرود مضحكة.']]]});

U('p3',2,3,'In the City','في المدينة',{v:'bank=بنك=🏦|post office=مكتب بريد=📮|bakery=مخبز=🥖|library=مكتبة=📚|hospital=مستشفى=🏥|police station=قسم الشرطة=🚓|bridge=كوبري=🌉|traffic light=إشارة مرور=🚦',s:'The bank is next to the shop.=البنك بجوار المتجر|Where is the library?=أين المكتبة؟|Stop at the red light.=قف عند الضوء الأحمر|Go straight.=امشِ للأمام',g:['Where is…?','للسؤال عن المكان: <b>Where is the bank?</b> وللإجابة: <b>It is next to…</b>',[['Where ___ the bank?','is','are','am','be','bank مفرد فنقول is.']]]});
U('p3',2,4,'Fun Time','وقت المرح',{v:'hobby=هواية=🎨|football=كرة القدم=⚽|swimming=سباحة=🏊|reading=قراءة=📖|drawing=رسم=🖍️|music=موسيقى=🎵|weekend=عطلة الأسبوع=📅|park=حديقة=🌳',s:'My hobby is reading.=هوايتي القراءة|I like playing football.=أحب لعب كرة القدم|She likes drawing.=هي تحب الرسم|We go to the park at the weekend.=نذهب إلى الحديقة في العطلة',r:['My Hobby','My name is Nada. My hobby is drawing. I draw flowers and animals.\nAt the weekend I go to the park with my sister. We play and draw together.','اسمي ندى. هوايتي الرسم. أرسم الزهور والحيوانات.\nفي عطلة الأسبوع أذهب إلى الحديقة مع أختي. نلعب ونرسم معاً.',[['What is Nada\'s hobby?','Drawing','Swimming','Football','Singing','هوايتها الرسم.'],['Who does Nada go with?','Her sister','Her brother','Her teacher','Her dad','تذهب مع أختها.']]]});

U('p4',1,1,'Welcome Back','أهلاً بعودتكم',{v:'summer holiday=إجازة الصيف=🏖️|travel=يسافر=✈️|visit=يزور=🏛️|grandparents=الجدان=👵|village=قرية=🏡|sea=بحر=🌊|swim=يسبح=🏊|memory=ذكرى=📸',s:'I visited my grandparents.=زرت جديّ|We went to the sea.=ذهبنا إلى البحر|She swam in the pool.=سبحت في حمام السباحة|Did you have fun?=هل استمتعت؟|Yes, I did.=نعم استمتعت',g:['Past simple (was/were, -ed)','للماضي نضيف <b>-ed</b> للفعل المنتظم: visit → visited. وللأفعال الشاذة: go → went.',[['Yesterday I ___ my friend.','visited','visit','visits','visiting','yesterday تدل على الماضي.'],['We ___ to the sea last summer.','went','go','goes','going','الماضي من go هو went.']]],r:['My Summer','Last summer I went to my grandparents\' village. We swam in the river and played in the fields.\nI visited my cousins too. It was a wonderful holiday.','في الصيف الماضي ذهبت إلى قرية جديّ. سبحنا في النهر ولعبنا في الحقول.\nزرت أبناء عمي أيضاً. كانت إجازة رائعة.',[['Where did he go?','To his grandparents\' village','To the zoo','To school','To the sea','ذهب إلى قرية جديه.'],['What was the holiday like?','Wonderful','Boring','Sad','Cold','كانت رائعة wonderful.']]]});
U('p4',1,2,'My Day','يومي',{v:'always=دائماً=✅|usually=عادةً=🔁|sometimes=أحياناً=🔂|never=أبداً=🚫|early=مبكراً=🌅|late=متأخراً=🌙|clock=ساعة حائط=🕰️|schedule=جدول=🗓️',s:'I always brush my teeth.=أنظف أسناني دائماً|He never comes late.=هو لا يتأخر أبداً|She sometimes plays tennis.=هي تلعب التنس أحياناً|What time is it?=كم الساعة؟',g:['Adverbs of frequency','تأتي <b>always, usually, sometimes, never</b> قبل الفعل: I always walk.',[['He ___ goes to school late.','never','go','to','is','never تأتي قبل الفعل.']]]});
U('p4',1,3,'Healthy Habits','عادات صحية',{v:'exercise=تمارين=🤸|sleep=نوم=😴|clean=نظيف=🧼|dentist=طبيب أسنان=🦷|vitamin=فيتامين=💊|junk food=وجبات سريعة=🍟|tired=متعب=🥱|strong=قوي=💪',s:'You should drink water.=يجب أن تشرب الماء|You should not eat junk food.=لا يجب أن تأكل وجبات سريعة|Brush your teeth twice a day.=نظّف أسنانك مرتين يومياً|Sleep early.=نم مبكراً',g:['should','<b>should</b> للنصيحة: You should sleep early. والنفي: should not.',[['You ___ wash your hands.','should','shoulds','are','does','بعد should فعل أصلي.']]]});
U('p4',1,4,'Around the World','حول العالم',{v:'country=دولة=🌍|Egypt=مصر=🇪🇬|capital=عاصمة=🏙️|flag=علم=🚩|language=لغة=🗣️|pyramid=هرم=🔺|river=نهر=🏞️|desert=صحراء=🏜️',s:'Egypt is in Africa.=مصر في أفريقيا|Cairo is the capital.=القاهرة هي العاصمة|We speak Arabic.=نتحدث العربية|The Nile is a long river.=النيل نهر طويل',r:['My Country','I live in Egypt. Egypt is in Africa. Cairo is the capital city.\nThe River Nile is very long. The pyramids are famous all over the world.','أعيش في مصر. مصر في أفريقيا. القاهرة هي العاصمة.\nنهر النيل طويل جداً. والأهرامات مشهورة في العالم كله.',[['What is the capital of Egypt?','Cairo','Giza','Luxor','Aswan','العاصمة القاهرة.'],['Which river is in Egypt?','The Nile','The Amazon','The Thames','The Rhine','النيل.']]]});

U('p4',2,4,'Festivals','الأعياد',{v:'Eid=عيد=🌙|gift=هدية=🎁|party=حفلة=🎉|sweets=حلويات=🍬|new clothes=ملابس جديدة=👕|celebrate=يحتفل=🥳|Ramadan=رمضان=🌙|lantern=فانوس=🏮',s:'We celebrate Eid.=نحتفل بالعيد|I get a gift.=أحصل على هدية|We eat sweets.=نأكل الحلويات|Happy Eid!=عيد سعيد',r:['Eid Day','Eid is a happy day. We wear new clothes and visit our family.\nChildren get gifts and sweets. We say, "Happy Eid!"','العيد يوم سعيد. نرتدي ملابس جديدة ونزور أسرتنا.\nيحصل الأطفال على هدايا وحلويات. نقول: عيد سعيد!',[['What do we wear on Eid?','New clothes','Pyjamas','Uniform','Coats','نرتدي ملابس جديدة.'],['What do children get?','Gifts and sweets','Homework','Books','Nothing','الأطفال يحصلون على هدايا وحلويات.']]]});

U('p5',1,2,'Jobs & Work','المهن والعمل',{v:'engineer=مهندس=👷|dentist=طبيب أسنان=🦷|lawyer=محامٍ=⚖️|scientist=عالم=🧪|journalist=صحفي=📰|builder=بنّاء=🧱|hospital=مستشفى=🏥|office=مكتب=🏢',s:'My uncle is an engineer.=عمي مهندس|She works in a hospital.=هي تعمل في مستشفى|What does he do?=ماذا يعمل؟|I want to be a scientist.=أريد أن أصبح عالماً',g:['a / an','نقول <b>an</b> قبل الحروف المتحركة: an engineer, an office. و<b>a</b> قبل غيرها: a doctor.',[['He is ___ engineer.','an','a','the','two','engineer تبدأ بصوت متحرك فنقول an.'],['She is ___ lawyer.','a','an','is','are','lawyer تبدأ بصوت ساكن.']]]});

U('p5',1,4,'Past Events','أحداث ماضية',{v:'yesterday=أمس=⏪|last week=الأسبوع الماضي=📆|ago=منذ=⌛|visited=زار=🏛️|played=لعب=⚽|watched=شاهد=📺|went=ذهب=🚶|ate=أكل=🍽️',s:'I watched TV yesterday.=شاهدت التلفاز أمس|We went to the museum.=ذهبنا إلى المتحف|She ate an apple.=أكلت تفاحة|Did you play football?=هل لعبت كرة القدم؟',g:['Past simple','للماضي: <b>visited, played</b> (منتظمة) و<b>went, ate</b> (شاذة). وفي السؤال نستخدم <b>did</b> + الفعل الأصلي.',[['___ you play yesterday?','Did','Do','Are','Does','للسؤال في الماضي نستخدم Did.'],['We ___ to the zoo last week.','went','go','goes','going','went ماضي go.']]]});
U('p5',2,1,'Nature','الطبيعة',{v:'forest=غابة=🌲|mountain=جبل=⛰️|river=نهر=🏞️|desert=صحراء=🏜️|island=جزيرة=🏝️|lake=بحيرة=🏞️|plant=نبات=🌱|environment=بيئة=🌍',s:'The Nile is the longest river.=النيل أطول نهر|Mountains are high.=الجبال عالية|We must protect the environment.=يجب أن نحمي البيئة|Plants need water.=النباتات تحتاج الماء',g:['Superlative','نضيف <b>the + -est</b> للأعلى: long → the longest. و big → the biggest.',[['Mount Everest is the ___ mountain.','highest','higher','high','most high','للتفضيل المطلق نستخدم the highest.']]]});
U('p5',2,2,'Travel','السفر',{v:'airport=مطار=🛫|ticket=تذكرة=🎫|passport=جواز سفر=🛂|suitcase=حقيبة سفر=🧳|hotel=فندق=🏨|tourist=سائح=📸|flight=رحلة جوية=✈️|journey=رحلة=🧭',s:'I need my passport.=أحتاج جواز سفري|We are going to travel.=سنسافر|The plane leaves at noon.=تغادر الطائرة ظهراً|They stay in a hotel.=يقيمون في فندق',g:['going to','نستخدم <b>am/is/are going to</b> للخطط المستقبلية: I am going to travel.',[['We ___ going to visit Aswan.','are','is','am','be','We تأخذ are.']]],r:['A Trip to Alexandria','Next week we are going to travel to Alexandria. We are going to stay in a hotel near the sea.\nI am going to swim and take photos. I cannot wait!','الأسبوع القادم سنسافر إلى الإسكندرية. سنقيم في فندق قرب البحر.\nسأسبح وألتقط صوراً. لا أطيق الانتظار!',[['Where are they going?','Alexandria','Cairo','Luxor','Aswan','إلى الإسكندرية.'],['Where are they going to stay?','In a hotel','At home','In a tent','At school','في فندق.']]]});
U('p5',2,3,'Technology','التكنولوجيا',{v:'computer=كمبيوتر=💻|phone=هاتف=📱|internet=إنترنت=🌐|video=فيديو=🎬|email=بريد إلكتروني=📧|robot=روبوت=🤖|camera=كاميرا=📷|screen=شاشة=🖥️',s:'I use a computer.=أستخدم الحاسوب|She sends an email.=هي ترسل بريداً إلكترونياً|Do not spend too much time on the screen.=لا تقضِ وقتاً طويلاً أمام الشاشة|Robots can help people.=الروبوتات تستطيع مساعدة الناس'});
U('p5',2,4,'Culture & Fun','ثقافة ومرح',{v:'museum=متحف=🏛️|ancient=قديم=🏺|pharaoh=فرعون=👑|story=قصة=📖|film=فيلم=🎞️|music=موسيقى=🎶|festival=مهرجان=🎪|history=تاريخ=📜',s:'We visit the museum.=نزور المتحف|Pharaohs lived in ancient Egypt.=عاش الفراعنة في مصر القديمة|I love stories.=أحب القصص|The film was great.=كان الفيلم رائعاً',r:['The Egyptian Museum','The Egyptian Museum is in Cairo. It has many ancient things. We can see the golden mask of Tutankhamun.\nMany tourists visit it every year. Egyptians are proud of their history.','المتحف المصري في القاهرة. فيه أشياء قديمة كثيرة. يمكننا رؤية القناع الذهبي لتوت عنخ آمون.\nيزوره سياح كثيرون كل عام. والمصريون فخورون بتاريخهم.',[['Where is the museum?','In Cairo','In Luxor','In Alexandria','In Aswan','في القاهرة.'],['Who visits it every year?','Many tourists','Only children','Nobody','Only teachers','يزوره سياح كثيرون.']]]});

U('p6',1,1,'Memories','ذكريات',{v:'childhood=طفولة=🧸|remember=يتذكر=💭|memory=ذكرى=📸|grew up=كبر=🌱|used to=اعتاد=🔙|once=ذات مرة=☝️|exciting=مثير=🤩|proud=فخور=🏅',s:'I used to play in the street.=كنت أعتاد اللعب في الشارع|We were very happy.=كنا سعداء جداً|I remember my first day at school.=أتذكر أول يوم لي في المدرسة|It was an exciting trip.=كانت رحلة مثيرة',g:['used to','نستخدم <b>used to + فعل</b> لعادة في الماضي: I used to play football.',[['I ___ play with my cousins every summer.','used to','use to','am used','using','للعادة الماضية نقول used to.']]],r:['My Childhood','When I was a child, I used to live in a small village. I used to play in the fields with my cousins.\nNow I live in the city, but I remember those happy days.','عندما كنت طفلاً كنت أعيش في قرية صغيرة. كنت أعتاد اللعب في الحقول مع أبناء عمي.\nالآن أعيش في المدينة لكني أتذكر تلك الأيام السعيدة.',[['Where did he use to live?','In a small village','In a big city','On an island','In a tent','كان يعيش في قرية صغيرة.'],['Where does he live now?','In the city','In the village','In a forest','In the desert','يعيش الآن في المدينة.']]]});
U('p6',1,2,'Inventions','اختراعات',{v:'invention=اختراع=💡|inventor=مخترع=🧑‍🔬|discover=يكتشف=🔭|electricity=كهرباء=⚡|telephone=تليفون=☎️|wheel=عجلة=🛞|machine=آلة=⚙️|useful=مفيد=👍',s:'The telephone was invented by Bell.=اخترع بيل التليفون|The wheel is a useful invention.=العجلة اختراع مفيد|Edison invented the light bulb.=اخترع إديسون المصباح|Many things were discovered by scientists.=اكتشف العلماء أشياء كثيرة',g:['Passive voice (basic)','المبني للمجهول: <b>was/were + past participle</b>: The bulb was invented by Edison.',[['The pyramids ___ built by the ancient Egyptians.','were','was','are being','is','pyramids جمع فنقول were built.']]]});
U('p6',1,3,'Safety First','السلامة أولاً',{v:'safe=آمن=🦺|danger=خطر=⚠️|careful=حذر=🧐|fire=حريق=🔥|accident=حادث=🚑|helmet=خوذة=⛑️|seat belt=حزام الأمان=🚗|rule=قاعدة=📏',s:'You must wear a helmet.=يجب أن ترتدي خوذة|You mustn\'t play with fire.=يجب ألا تلعب بالنار|Be careful when you cross the road.=كن حذراً عند عبور الطريق|Follow the rules.=اتبع القواعد',g:['must / mustn\'t','<b>must</b> للواجب و<b>mustn\'t</b> للمنع.',[['You ___ cross the road when the light is red.','mustn\'t','must','can','should be','عبور الطريق والإشارة حمراء ممنوع.']]]});
U('p6',1,4,'Our Environment','بيئتنا',{v:'pollution=تلوث=🏭|recycle=يعيد التدوير=♻️|rubbish=قمامة=🗑️|plant=يزرع=🌱|save=يوفّر=💧|energy=طاقة=🔋|clean=نظيف=✨|earth=الأرض=🌍',s:'We should recycle paper.=يجب أن نعيد تدوير الورق|Do not throw rubbish on the ground.=لا ترمِ القمامة على الأرض|Plant a tree.=ازرع شجرة|Save water.=وفّر الماء',r:['Save Our Earth','Our Earth is in danger. Factories make pollution and people throw rubbish in the streets.\nWe can help. We can plant trees, recycle paper and save water.','أرضنا في خطر. المصانع تسبب التلوث والناس يرمون القمامة في الشوارع.\nنستطيع أن نساعد. يمكننا زراعة الأشجار وإعادة تدوير الورق وتوفير الماء.',[['What can we plant?','Trees','Cars','Rubbish','Phones','يمكننا زراعة الأشجار.'],['What makes pollution?','Factories','Trees','Rain','Birds','المصانع.']]]});
U('p6',2,1,'Great People','عظماء',{v:'famous=مشهور=🌟|brave=شجاع=🦁|leader=قائد=🧭|writer=كاتب=✍️|football player=لاعب كرة=⚽|born=وُلد=👶|died=توفي=🕊️|hero=بطل=🦸',s:'He was born in 1950.=وُلد في عام ١٩٥٠|She was a famous writer.=كانت كاتبة مشهورة|He was brave.=كان شجاعاً|Many people loved him.=أحبه كثير من الناس',g:['was / were born','للميلاد: <b>was born</b>. مثال: She was born in Cairo.',[['Naguib Mahfouz ___ born in Cairo.','was','were','is','be','المفرد في الماضي was.']]]});
U('p6',2,2,'Hobbies & Sports','هوايات ورياضة',{v:'athlete=رياضي=🏃|champion=بطل=🏆|team=فريق=👥|match=مباراة=⚽|score=يسجل=🥅|win=يفوز=🥇|lose=يخسر=😞|training=تدريب=🏋️',s:'Our team won the match.=فاز فريقنا في المباراة|He scored two goals.=سجل هدفين|I train every day.=أتدرّب كل يوم|She is a champion.=هي بطلة',g:['Past simple questions','للسؤال عن الماضي: <b>Did + فاعل + فعل أصلي؟</b>',[['___ your team win the match?','Did','Does','Do','Was','Did للسؤال في الماضي.']]]});
U('p6',2,3,'The Future','المستقبل',{v:'future=مستقبل=🔮|will=سوف=➡️|tomorrow=غداً=📅|space=فضاء=🚀|rocket=صاروخ=🚀|planet=كوكب=🪐|astronaut=رائد فضاء=👨‍🚀|dream=حلم=💭',s:'I will be a doctor.=سأصبح طبيباً|People will travel to space.=سيسافر الناس إلى الفضاء|It will rain tomorrow.=ستمطر غداً|What will you do?=ماذا ستفعل؟',g:['will','نستخدم <b>will + فعل أصلي</b> للمستقبل: It will be sunny.',[['Tomorrow it ___ rain.','will','is','did','does','will للمستقبل.']]],r:['My Dream','I have a dream. I will be an astronaut. I will fly to space in a big rocket.\nI will see the planets and the stars. I will study hard to make my dream come true.','عندي حلم. سأصبح رائد فضاء. سأطير إلى الفضاء في صاروخ كبير.\nسأرى الكواكب والنجوم. سأذاكر بجد لأحقق حلمي.',[['What will he be?','An astronaut','A doctor','A driver','A cook','سيصبح رائد فضاء.'],['What will he do to make his dream come true?','Study hard','Sleep','Play','Travel','سيذاكر بجد.']]]});
U('p6',2,4,'Revision & Culture','مراجعة وثقافة',{v:'pyramid=هرم=🔺|Nile=النيل=🏞️|Egypt=مصر=🇪🇬|tourist=سائح=📸|traditional=تقليدي=🎎|culture=ثقافة=🎭|proud=فخور=🏅|heritage=تراث=🏺',s:'Egypt is a beautiful country.=مصر بلد جميل|Tourists visit the pyramids.=يزور السياح الأهرامات|I am proud of my country.=أنا فخور ببلدي|Our culture is rich.=ثقافتنا غنية'});

U('s1',1,1,'Personal Identity','الهوية الشخصية',{v:'identity=هوية|personality=شخصية|generous=كريم|ambitious=طموح|confident=واثق|reliable=يُعتمد عليه|curious=فضولي|appearance=مظهر',s:'She is a confident student.=هي طالبة واثقة|He is known for his generosity.=هو معروف بكرمه|I have been learning English for years.=أتعلم الإنجليزية منذ سنوات|My personality is quite calm.=شخصيتي هادئة إلى حد كبير',g:['Present tenses review','<b>Present simple</b> للعادات والحقائق، و<b>present continuous</b> لما يحدث الآن.',[['She ___ to school every day.','goes','is going','go','going','every day تدل على عادة.'],['Look! The children ___ in the garden.','are playing','play','plays','played','Look! حدث الآن.']]],r:['Who Am I?','Everyone has a unique identity. It is made of our name, family, culture and personality.\nSome people are shy, while others are confident. What matters is that we respect ourselves and others.','لكل شخص هوية فريدة. تتكون من اسمنا وأسرتنا وثقافتنا وشخصيتنا.\nبعض الناس خجولون وآخرون واثقون. المهم أن نحترم أنفسنا والآخرين.',[['What is identity made of?','Name, family, culture and personality','Only money','Only clothes','Only age','الهوية تتكون من الاسم والأسرة والثقافة والشخصية.'],['What matters most?','Respecting ourselves and others','Being tall','Being rich','Being shy','المهم احترام النفس والآخرين.']]]});
U('s1',1,2,'Technology & Society','التكنولوجيا والمجتمع',{v:'invention=اختراع|innovation=ابتكار|artificial intelligence=ذكاء اصطناعي|software=برمجيات|privacy=خصوصية|addicted=مدمن|benefit=فائدة|disadvantage=عيب',s:'Technology has changed our lives.=غيّرت التكنولوجيا حياتنا|Some people are addicted to their phones.=بعض الناس مدمنون على هواتفهم|Privacy is important online.=الخصوصية مهمة على الإنترنت|Artificial intelligence is developing fast.=يتطور الذكاء الاصطناعي بسرعة',g:['Present perfect vs past simple','<b>Present perfect</b> لحدث متصل بالحاضر، و<b>past simple</b> لوقت منتهٍ.',[['I ___ my homework yet.','haven\'t finished','didn\'t finish','don\'t finish','am not finishing','yet تدل على present perfect.'],['She ___ to Paris in 2019.','went','has gone','goes','is going','2019 وقت منتهٍ فنستخدم past simple.']]]});
U('s1',1,3,'Travel & Tourism','السفر والسياحة',{v:'destination=وجهة|itinerary=برنامج رحلة|accommodation=إقامة|sightseeing=مشاهدة المعالم|currency=عملة|customs=الجمارك|souvenir=تذكار|journey=رحلة',s:'We booked our accommodation online.=حجزنا إقامتنا عبر الإنترنت|Egypt attracts millions of tourists.=تجذب مصر ملايين السياح|We went sightseeing in Luxor.=ذهبنا لمشاهدة المعالم في الأقصر|Have you ever travelled abroad?=هل سافرت إلى الخارج من قبل؟',g:['Past tenses','<b>Past simple</b> و<b>past continuous</b>: While we were walking, it started to rain.',[['I ___ when the phone rang.','was sleeping','slept','sleep','am sleeping','حدث مستمر قطعه حدث آخر.']]]});
U('s1',2,1,'Environment','البيئة',{v:'climate change=تغير المناخ|pollution=تلوث|renewable=متجدد|endangered=مهدد بالانقراض|conservation=حماية الطبيعة|emissions=انبعاثات|waste=نفايات|sustainable=مستدام',s:'Climate change is a global problem.=تغير المناخ مشكلة عالمية|We should reduce waste.=يجب أن نقلل النفايات|Many species are endangered.=كثير من الأنواع مهددة بالانقراض|Solar power is a renewable source.=الطاقة الشمسية مصدر متجدد',g:['Conditionals','<b>If + present, will</b> (محتمل) · <b>If + past, would</b> (غير محتمل).',[['If we ___ trees, the air will be cleaner.','plant','planted','will plant','planting','الشرط الأول: present في جملة if.'],['If I ___ rich, I would travel the world.','were','am','will be','be','الشرط الثاني: were.']]],r:['Protecting the Planet','Climate change is one of the biggest problems of our time. Emissions from factories and cars are heating the Earth.\nGovernments and individuals must act now. Using renewable energy is a good start.','تغير المناخ من أكبر مشكلات عصرنا. انبعاثات المصانع والسيارات تسخّن الأرض.\nعلى الحكومات والأفراد أن يتحركوا الآن. استخدام الطاقة المتجددة بداية جيدة.',[['What is heating the Earth?','Emissions','Rain','Snow','Wind','الانبعاثات.'],['What is a good start?','Using renewable energy','Using more cars','Cutting trees','Doing nothing','استخدام الطاقة المتجددة.']]]});
U('s1',2,2,'Health & Lifestyle','الصحة وأسلوب الحياة',{v:'nutrition=تغذية|obesity=سمنة|exercise=تمرين|stress=ضغط نفسي|habit=عادة|recover=يتعافى|symptom=عرض مرضي|lifestyle=أسلوب حياة',s:'A balanced diet is essential.=الغذاء المتوازن ضروري|Stress affects our health.=الضغط النفسي يؤثر على صحتنا|He should do more exercise.=يجب أن يمارس مزيداً من التمارين|She has recovered completely.=تعافت تماماً',g:['Modals','<b>should / ought to / must</b> للنصح والواجب.',[['You ___ smoke; it is harmful.','mustn\'t','must','can','will','التدخين ضار فهو ممنوع.']]]});
U('s1',2,3,'Education & Careers','التعليم والمهن',{v:'career=مهنة|qualification=مؤهل|employer=صاحب عمل|graduate=خريج|apply=يتقدم|requirement=شرط|profession=مهنة|opportunity=فرصة',s:'She applied for a scholarship.=تقدمت لمنحة|Higher education offers more opportunities.=التعليم العالي يمنح فرصاً أكثر|He wants to build a successful career.=يريد بناء مسيرة مهنية ناجحة|You need good qualifications.=تحتاج إلى مؤهلات جيدة',g:['Passive voice','<b>be + past participle</b>: The report was written by the team.',[['The students ___ by the teacher every week.','are tested','test','is testing','tested','المبني للمجهول are tested.']]],r:['Choosing a Career','Choosing a career is an important decision. You should think about your skills, interests and the opportunities available.\nTalk to teachers and parents, and never stop learning new skills.','اختيار المهنة قرار مهم. يجب أن تفكر في مهاراتك واهتماماتك والفرص المتاحة.\nتحدث مع المعلمين وأولياء الأمور ولا تتوقف عن تعلم مهارات جديدة.',[['What should you think about?','Skills and interests','Only money','Only the weather','Nothing','المهارات والاهتمامات.'],['What should you never stop?','Learning','Sleeping','Eating','Walking','التعلم.']]]});
U('s2',1,1,'Challenges','تحديات',{v:'challenge=تحدٍّ|overcome=يتغلب على|determination=عزيمة|obstacle=عقبة|persevere=يثابر|failure=فشل|achievement=إنجاز|motivation=دافع',s:'He overcame many obstacles.=تغلب على عقبات كثيرة|Failure is part of success.=الفشل جزء من النجاح|She was determined to win.=كانت مصممة على الفوز|Motivation helps us persevere.=الدافع يساعدنا على المثابرة',g:['Past perfect','<b>had + past participle</b> لحدث وقع قبل حدث ماضٍ آخر.',[['When I arrived, the train ___ left.','had','has','have','was','الحدث الأسبق past perfect.']]],r:['Never Give Up','Thomas Edison failed many times before he invented the light bulb. When people asked him about it, he said he had not failed; he had found ways that did not work.\nThis shows that determination leads to success.','فشل توماس إديسون مرات عديدة قبل أن يخترع المصباح. وعندما سُئل عن ذلك قال إنه لم يفشل بل وجد طرقاً لا تنجح.\nهذا يبيّن أن العزيمة تقود إلى النجاح.',[['What did Edison invent?','The light bulb','The telephone','The car','The plane','اخترع المصباح.'],['What leads to success?','Determination','Luck only','Sleep','Money only','العزيمة.']]]});
U('s2',1,2,'Science & Discovery','العلوم والاكتشاف',{v:'discovery=اكتشاف|experiment=تجربة|theory=نظرية|evidence=دليل|research=بحث|researcher=باحث|laboratory=معمل|breakthrough=إنجاز كبير',s:'The scientist made a great discovery.=حقق العالم اكتشافاً عظيماً|Research takes a long time.=يستغرق البحث وقتاً طويلاً|The theory was proved by experiments.=أُثبتت النظرية بالتجارب|There is no evidence yet.=لا يوجد دليل حتى الآن',g:['Reported speech','نرجع الزمن خطوة: "I am busy" → He said he was busy.',[['She said, "I will help." → She said she ___ help.','would','will','can\'t','did','will تتحول إلى would.']]]});
U('s2',1,3,'Society & Volunteering','المجتمع والتطوع',{v:'volunteer=يتطوع|community=مجتمع|charity=جمعية خيرية|donate=يتبرع|cooperate=يتعاون|responsibility=مسؤولية|poverty=فقر|support=يدعم',s:'Volunteers help the community.=يساعد المتطوعون المجتمع|She donated money to charity.=تبرعت بالمال لجمعية خيرية|We must cooperate to solve problems.=يجب أن نتعاون لحل المشكلات|Poverty is a serious problem.=الفقر مشكلة خطيرة',g:['Relative clauses','<b>who, which, whose, where</b>: The man whose car was stolen called the police.',[['The girl ___ father is a doctor is my friend.','whose','who','which','where','whose للملكية.']]]});
U('s2',2,1,'Media','الإعلام',{v:'media=إعلام|broadcast=يبث|headline=عنوان|journalist=صحفي|audience=جمهور|influence=تأثير|reliable=موثوق|advertisement=إعلان',s:'The media influences public opinion.=يؤثر الإعلام في الرأي العام|The news was broadcast live.=بُثّت الأخبار مباشرة|We should check the source.=يجب أن نتحقق من المصدر|Advertisements try to persuade us.=تحاول الإعلانات إقناعنا',g:['Passive voice (all tenses)','<b>The news has been published.</b> · <b>It will be announced.</b>',[['The article ___ yesterday.','was published','published','is publishing','has publishing','yesterday تدل على الماضي المبني للمجهول.']]],r:['The Power of Media','Media plays an important role in our lives. It informs us about events and entertains us.\nHowever, not all news is true. We should always check sources before we believe or share information.','يلعب الإعلام دوراً مهماً في حياتنا. يخبرنا بالأحداث ويسلّينا.\nلكن ليست كل الأخبار صحيحة. يجب أن نتحقق دائماً من المصادر قبل أن نصدق المعلومات أو نشاركها.',[['What should we check?','Sources','Colours','Prices','Weather','المصادر.'],['Is all news true?','No, it is not','Yes, always','Only on TV','Only online','ليست كل الأخبار صحيحة.']]]});
U('s2',2,2,'Culture & Heritage','الثقافة والتراث',{v:'heritage=تراث|civilisation=حضارة|archaeology=علم الآثار|monument=أثر|tradition=تقليد|preserve=يحافظ|generation=جيل|identity=هوية',s:'Egypt has a rich heritage.=لمصر تراث غني|We should preserve our monuments.=يجب أن نحافظ على آثارنا|Traditions pass between generations.=تنتقل التقاليد بين الأجيال|Culture shapes our identity.=تشكل الثقافة هويتنا',g:['Conditionals','<b>If + past perfect, would have</b>: If I had studied, I would have passed.',[['If he ___ harder, he would have passed.','had studied','studied','studies','would study','الشرط الثالث past perfect.']]]});
U('s2',2,3,'Global Issues','قضايا عالمية',{v:'globalisation=عولمة|population=سكان|shortage=نقص|poverty=فقر|peace=سلام|refugee=لاجئ|resources=موارد|solution=حل',s:'Water shortage affects many countries.=يؤثر نقص المياه في كثير من الدول|Peace is essential for development.=السلام ضروري للتنمية|We need solutions to global problems.=نحتاج إلى حلول للمشكلات العالمية|Cooperation is the key.=التعاون هو المفتاح',g:['Wish & if only','<b>I wish + past</b> لتمني شيء غير حقيقي الآن: I wish I had more time.',[['I wish I ___ a car.','had','have','will have','am having','التمني في الحاضر يستخدم past.']]],r:['A Shared World','Our world faces global problems: poverty, water shortage and climate change. No country can solve them alone.\nThrough cooperation and education, we can build a peaceful and sustainable future.','يواجه عالمنا مشكلات عالمية: الفقر ونقص المياه وتغير المناخ. لا تستطيع دولة وحدها حلها.\nمن خلال التعاون والتعليم يمكننا بناء مستقبل مسالم ومستدام.',[['Can one country solve global problems alone?','No, it cannot','Yes, easily','Only rich ones','Only small ones','لا تستطيع دولة وحدها.'],['What can build a better future?','Cooperation and education','War','Pollution','Silence','التعاون والتعليم.']]]});
U('s3',1,1,'Communication & Society','التواصل والمجتمع',{v:'communication=تواصل|generation gap=فجوة الأجيال|attitude=موقف|opinion=رأي|argue=يجادل|negotiate=يتفاوض|tolerance=تسامح|misunderstanding=سوء فهم',s:'Good communication prevents misunderstandings.=التواصل الجيد يمنع سوء الفهم|In my opinion, tolerance is important.=في رأيي التسامح مهم|They argued about the plan.=تجادلوا حول الخطة|We should respect different attitudes.=يجب أن نحترم المواقف المختلفة',g:['Linking words','<b>however, although, therefore, moreover</b> لربط الأفكار.',[['He was tired; ___ , he finished his work.','however','because','so that','unless','however للتعبير عن التناقض.'],['___ it was raining, we went out.','Although','Because','So','Unless','Although تعني «رغم أن».']]],r:['Generation Gap','Sometimes parents and teenagers do not agree. They have different experiences and opinions.\nHowever, good communication and mutual respect can reduce this gap.','أحياناً لا يتفق الآباء والمراهقون. لكل منهم خبرات وآراء مختلفة.\nومع ذلك يمكن للتواصل الجيد والاحترام المتبادل أن يقلل هذه الفجوة.',[['Why do they disagree?','They have different experiences','They are rich','They are tall','They are far','لهم خبرات مختلفة.'],['What can reduce the gap?','Communication and respect','Silence','Arguments','Distance','التواصل والاحترام.']]]});
U('s3',1,2,'Science & Ethics','العلوم والأخلاقيات',{v:'ethical=أخلاقي|genetic=وراثي|cloning=استنساخ|breakthrough=اختراق علمي|benefit=فائدة|risk=خطر|regulate=ينظّم|advance=تقدم',s:'Science has made great advances.=حقق العلم تقدماً كبيراً|Cloning raises ethical questions.=يثير الاستنساخ أسئلة أخلاقية|Every invention has benefits and risks.=لكل اختراع فوائد ومخاطر|Governments should regulate new technologies.=يجب أن تنظم الحكومات التقنيات الجديدة',g:['Conditionals & wishes','<b>If + past perfect, would have + p.p.</b> للماضي غير المتحقق.',[['If scientists ___ the cure earlier, many lives would have been saved.','had found','found','find','have found','الشرط الثالث.']]]});
U('s3',1,3,'Work & Economy','العمل والاقتصاد',{v:'economy=اقتصاد|unemployment=بطالة|entrepreneur=رائد أعمال|investment=استثمار|income=دخل|profit=ربح|budget=ميزانية|inflation=تضخم',s:'Unemployment is a serious problem.=البطالة مشكلة خطيرة|He started his own business.=بدأ مشروعه الخاص|We should manage our budget carefully.=يجب أن ندير ميزانيتنا بحرص|Investment creates jobs.=الاستثمار يخلق فرص عمل',g:['Passive & causative','<b>have something done</b>: I had my car repaired.',[['She ___ her hair cut yesterday.','had','has','have','is having','الماضي had + مفعول + p.p.']]],r:['Small Businesses','Small businesses play a major role in the economy. They create jobs and help young entrepreneurs to succeed.\nThe government should support them with training and loans.','تلعب المشروعات الصغيرة دوراً كبيراً في الاقتصاد. فهي تخلق فرص عمل وتساعد رواد الأعمال الشباب على النجاح.\nعلى الحكومة أن تدعمها بالتدريب والقروض.',[['What do small businesses create?','Jobs','Pollution','Wars','Holidays','تخلق فرص عمل.'],['How should the government support them?','With training and loans','With nothing','With rules only','With taxes only','بالتدريب والقروض.']]]});
U('s3',2,1,'Revision: Grammar','مراجعة القواعد',{v:'consequently=وبالتالي|moreover=علاوة على ذلك|nevertheless=ومع ذلك|furthermore=فضلاً عن ذلك|whereas=بينما|despite=رغم|therefore=لذلك|unless=ما لم',s:'Despite the rain, we went out.=رغم المطر خرجنا|He works hard; therefore, he succeeds.=يعمل بجد؛ لذلك ينجح|Unless you study, you will fail.=ما لم تذاكر فسترسب|She is rich, whereas he is poor.=هي غنية بينما هو فقير',g:['Linking & conditionals','<b>unless = if not</b> · <b>despite + noun/ing</b> · <b>whereas</b> للمقابلة.',[['___ you hurry, you will miss the bus.','Unless','Despite','Whereas','Although','Unless تعني if not.'],['___ being tired, he finished his work.','Despite','Because','So','Unless','Despite + ing.']]]});
U('s3',2,2,'Revision: Reading & Vocabulary','مراجعة القراءة والمفردات',{v:'summary=ملخص|conclusion=خاتمة|argument=حجة|evidence=دليل|infer=يستنتج|purpose=هدف|tone=نبرة|context=سياق',s:'The writer\'s purpose is to inform.=هدف الكاتب هو الإعلام|Use the context to guess the meaning.=استخدم السياق لتخمين المعنى|Write a short summary.=اكتب ملخصاً قصيراً|Support your argument with evidence.=ادعم حجتك بدليل',r:['Reading Skills','To understand a text well, read the title first. Then read quickly to get the main idea, and read again to find details.\nUse the context to guess new words and underline key information.','لكي تفهم النص جيداً اقرأ العنوان أولاً. ثم اقرأ بسرعة لتعرف الفكرة الرئيسية، ثم اقرأ مرة أخرى لإيجاد التفاصيل.\nاستخدم السياق لتخمين الكلمات الجديدة وضع خطاً تحت المعلومات المهمة.',[['What should you read first?','The title','The last word','The page number','Nothing','اقرأ العنوان أولاً.'],['How can you guess new words?','Use the context','Ignore them','Ask nobody','Close the book','استخدم السياق.']]]});
U('s3',2,3,'Revision: Writing & Translation','مراجعة الكتابة والترجمة',{v:'paragraph=فقرة|topic sentence=جملة الموضوع|introduction=مقدمة|opinion=رأي|essay=مقال|translate=يترجم|accurate=دقيق|formal=رسمي',s:'Start with a topic sentence.=ابدأ بجملة الموضوع|Write a formal letter.=اكتب خطاباً رسمياً|Translate the sentence carefully.=ترجم الجملة بعناية|Give your opinion and reasons.=اذكر رأيك وأسبابك',g:['Essay structure','المقال: <b>مقدمة</b> ← <b>فقرات الموضوع</b> ← <b>خاتمة</b>. ونستخدم أدوات الربط مثل firstly, moreover, finally.',[['Which word is used to end an essay?','Finally','Firstly','Moreover','Although','Finally للخاتمة.']]]});
