<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الرياضيات – الثالث الإعدادي</title>
<meta name='theme-color' content='#0b7a75'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-title' content='رياضيات'>

<style>
:root{--bg:#eaf3f5;--card:#fff;--ink:#12313f;--mut:#5b7480;--acc:#0b7a75;--acc2:#e8a317;--ok:#1b8a4b;--bad:#c0392b;--line:#c9dde2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2128;--card:#17323c;--ink:#e8f3f5;--mut:#9bb6bf;--acc:#3cc7bd;--acc2:#f2b73a;--ok:#4cc68a;--bad:#ff7b6b;--line:#2a4854}}
:root[data-theme="dark"]{--bg:#0f2128;--card:#17323c;--ink:#e8f3f5;--mut:#9bb6bf;--acc:#3cc7bd;--acc2:#f2b73a;--ok:#4cc68a;--bad:#ff7b6b;--line:#2a4854}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:16px}
.top{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
h1{font-size:1.5rem;font-weight:900;margin:0}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 14px;font-weight:700;white-space:nowrap}
.sub{color:var(--mut);margin:0 0 16px}
.lv{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;font:inherit;cursor:pointer}
.lv[disabled]{opacity:.5;cursor:not-allowed}
.lv:focus-visible,.ch:focus-visible,.btn:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.lv b{display:block;font-size:1.1rem}.lv small{color:var(--mut)}
.badge{flex:none;width:46px;height:46px;border-radius:14px 14px 14px 4px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.3rem}
.stars{margin-inline-start:auto;color:var(--acc2);letter-spacing:2px;font-size:1.1rem;white-space:nowrap}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.q{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}
.q p{margin:0 0 8px;color:var(--mut)}
.eq{font-size:1.6rem;font-weight:700;text-align:center;line-height:1.9}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:14px 8px;font:inherit;font-size:1.2rem;font-weight:700;cursor:pointer}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{border-radius:16px;padding:14px;margin:12px 0;border:2px solid var(--line);background:var(--card)}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.fb h3{margin:0 0 6px;font-size:1.1rem}
.fb ol{margin:6px 0 0;padding-inline-start:22px}
.btn{display:block;width:100%;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:14px;font:inherit;font-size:1.1rem;font-weight:700;cursor:pointer;margin-top:8px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.end{text-align:center}.end .big{font-size:3rem;color:var(--acc2);letter-spacing:6px}
button.pill{font:inherit;color:var(--ink);cursor:pointer}
.gr{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:14px 8px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
.fig{margin-top:8px;text-align:center}.fig svg{display:block;margin:0 auto}
#lesson p{margin:8px 0;color:var(--mut)}#lesson p.cur{color:var(--ink);font-weight:700}#lesson .eq{font-size:1.4rem;margin-bottom:6px}
.credit{text-align:center;color:var(--mut);font-size:.95rem;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.credit b{color:var(--ink)}.credit p{margin:6px 0 0}.credit .me{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--acc);display:block;margin:0 auto}
[hidden]{display:none!important}
@keyframes cfx{to{transform:translateY(105vh) rotate(720deg)}}@media (prefers-reduced-motion:reduce){i[style*='cfx']{display:none}}</style>
</head>
<body>
<main>
  <div class="top"><h1>رحلة الرياضيات</h1><span class="pill">⭐ <span id="pts">0</span> نقطة</span><button class="pill" id="snd" aria-label="الصوت">🔊</button></div>
  <section id="home"></section>
  <section id="quiz" hidden>
    <div class="top"><span class="pill" id="lvname"></span><span class="pill" id="streak"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="q"><p id="ask"></p><div class="eq" id="eq"></div></div>
    <div class="chs" id="chs"></div>
    <div id="fb" hidden></div>
    <button class="btn" id="next" hidden></button>
    <button class="btn alt" id="back">رجوع للمستويات</button>
  </section>
  <section id="lesson" hidden></section>

<script>
const $=s=>document.querySelector(s);
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const sg=()=>r(0,1)?1:-1;
const N=n=>n<0?'−'+(-n):''+n;
const M=s=>'<span class="m">'+s+'</span>';
const O={'>':'&gt;','<':'&lt;'};
const shuf=a=>a.slice().sort(()=>Math.random()-.5);
const fs=n=>'(x '+(n>0?'+ '+n:'− '+(-n))+')';
let S={pts:0,stars:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('alg3')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('alg3',JSON.stringify(S))}catch(e){}};

function uniq(list,key,n){const seen=new Set(),out=[];for(const c of list){const k=key(c);if(!seen.has(k)){seen.add(k);out.push(c)}if(out.length===n)break}return out}

function g1(){
  const x=r(-9,9)||3,a=r(2,9)*sg(),b=r(1,12)*sg(),c=a*x+b;
  const lhs=(a<0?'−'+(-a):a)+'x '+(b>0?'+ '+b:'− '+(-b));
  const cand=uniq([x,-x,(c+b)/a,x+1,x-1,x+2].filter(Number.isInteger),v=>v,4);
  return{ask:'أوجد قيمة x:',q:M(lhs+' = '+N(c)),a:'x = '+N(x),ch:cand.map(v=>'x = '+N(v)),
    steps:[(b>0?'نطرح ':'نجمع ')+Math.abs(b)+(b>0?' من الطرفين':' للطرفين')+' ← '+M(N(a)+'x = '+N(c-b)),'نقسم الطرفين على '+N(a)+' ← '+M('x = '+N(x))]};
}
function g2(){
  const a=r(2,6)*sg(),b=r(1,10)*sg(),x0=r(-6,6),c=a*x0+b,op=r(0,1)?'>':'<';
  const fl=a<0,fo=fl?(op==='>'?'<':'>'):op,opp=fo==='>'?'<':'>';
  const lhs=(a<0?'−'+(-a):a)+'x '+(b>0?'+ '+b:'− '+(-b));
  const t=(o,v)=>'x '+O[o]+' '+N(v);
  return{ask:'حل المتباينة:',q:M(lhs+' '+O[op]+' '+N(c)),a:t(fo,x0),ch:[t(fo,x0),t(opp,x0),t(fo,x0+1),t(opp,x0-1)],
    steps:['ننقل الثابت للطرف التاني ← '+M((a<0?'−'+(-a):a)+'x '+O[op]+' '+N(c-b)),'نقسم على '+N(a)+(fl?' <b>(عدد سالب، فنعكس اتجاه المتباينة!)</b>':'')+' ← '+M(t(fo,x0))]};
}
function g3(){
  const x=r(1,9),y=r(1,9),s=x+y,d=x-y;
  const P=(u,v)=>'('+u+' , '+v+')';
  const cand=uniq([[x,y],[y,x],[x,y+1],[x+1,y],[x+1,y+1],[x-1,y]],p=>p.join(','),4);
  return{ask:'أوجد الحل (x , y):',q:M('x + y = '+s)+'<br>'+M('x − y = '+N(d)),a:P(x,y),ch:cand.map(p=>P(p[0],p[1])),
    steps:['نجمع المعادلتين فيتحذف y ← '+M('2x = '+(s+d)+' ، x = '+x),'نعوض في المعادلة الأولى ← '+M('y = '+s+' − '+x+' = '+y)]};
}
function g4(){

const AR_LO=139,AR_HI=190,AR_F={sin:'جا',cos:'جتا',tan:'ظا',cot:'ظتا',sec:'قا',csc:'قتا',ln:'لوهـ',log:'لو',lim:'نهـا',dx:'دس',dy:'دص',dz:'دع',dt:'دن',d:'د'};
const AR_V={x:'س',y:'ص',z:'ع',t:'ن'},AR_D='٠١٢٣٤٥٦٧٨٩';
function arT(t){
  t=t.replace(/(sin|cos|tan|cot|sec|csc)(?=[A-Z])/g,m=>AR_F[m]+' ');
  t=t.replace(/[A-Za-z]+/g,w=>{
    if(AR_F[w])return AR_F[w];
    if(w==='e')return 'هـ';if(w==='i')return 'ت';if(w==='f')return 'د';
    if(w.length<=3&&/^[a-z]/.test(w)&&w!=='e')return w.replace(/[xyzt]/g,c=>AR_V[c]);
    return w});
  t=t.replace(/π/g,'ط');
  t=t.replace(/(\d)\.(\d)/g,'$1٫$2');
  return t.replace(/\d/g,d=>AR_D[+d]);
}
function arH(h){return typeof h!=='string'?h:h.split(/(<[^>]*>|&#?\w+;)/).map((p,i)=>i%2?p:arT(p)).join('')}
function arQ(q){const o=Object.assign({},q);o.ask=arH(q.ask);o.q=arH(q.q);o.a=arH(q.a);o.ch=q.ch.map(arH);o.steps=q.steps.map(arH);if(q.fig)o.fig=arH(q.fig);return o}

149:['معادلة المستوى المار بالنقطة (x₀ , y₀ , z₀) ومتجه عمودي عليه (a , b , c): a x + b y + c z = d حيث d = a x₀ + b y₀ + c z₀.','n = (1 , 2 , 2) والنقطة (1 , 0 , 3)','d = 1 + 0 + 6 = 7','x + 2y + 2z = 7'],

154:['الاشتقاق الضمني: نشتق الطرفين بالنسبة لـ x ونعتبر y دالة في x فتظهر dy/dx.','x² + y² = 25','2x + 2y (dy/dx) = 0','dy/dx = −x/y'],

156:['المعدلات الزمنية المرتبطة: نكتب العلاقة بين الكميات ثم نشتق بالنسبة للزمن t.','A = πr²','dA/dt = 2πr × dr/dt','لو r = 5 و dr/dt = 2 ← dA/dt = 20π'],
158:['لو f′(x) > 0 فالدالة متزايدة، ولو f′(x) < 0 فهي متناقصة.','f(x) = x³ − 3x','f′(x) = 3x² − 3 = 3(x − 1)(x + 1)','متزايدة في (−∞ , −1) ∪ (1 , ∞)'],
159:['النقط الحرجة حيث f′(x) = 0، ونحدد العظمى والصغرى من تغير إشارة f′ (أو من f″).','f(x) = x³ − 3x','f′(x) = 0 عند x = ±1','f(−1) = 2 قيمة عظمى محلية'],
160:['نقطة الانقلاب هي التي تتغير عندها إشارة f″(x) (تغير التقعر).','f(x) = x³ − 3x²','f″(x) = 6x − 6 = 0','x = 1'],
161:['في مسائل القيم القصوى نكتب الكمية المطلوبة بدلالة متغير واحد ثم نضع المشتقة = 0.','عددان مجموعهما 10','P = x(10 − x) ← P′ = 10 − 2x = 0 ← x = 5','أكبر حاصل ضرب = 25'],
163:['∫ e^(ax) dx = e^(ax)/a + C، و ∫ (1/x) dx = ln|x| + C.','∫ 6e^(2x) dx','= 6 × e^(2x)/2 + C','= 3e^(2x) + C'],
164:['التكامل بالتعويض: نفرض u = دالة مناسبة فيصبح التكامل بسيطًا.','∫ 2x (x² + 1)³ dx ← u = x² + 1 , du = 2x dx','∫ u³ du = u⁴/4 + C','= (x² + 1)⁴/4 + C'],
165:['التكامل المحدد من p إلى q للدالة f = F(q) − F(p) حيث F دالة أصلية.','∫ من 1 إلى 2 للدالة 3x² dx = [x³]','2³ − 1³ = 8 − 1','= 7'],
166:['المساحة تحت المنحنى y = f(x) من a إلى b تساوي التكامل المحدد لـ f (لو f ≥ 0).','y = 2x من 0 إلى 4','∫ من 0 إلى 4 للدالة 2x dx = [x²]','= 16 وحدة مربعة'],
169:['عزم القوة حول نقطة = القوة × البعد العمودي من النقطة إلى خط عمل القوة. وفي المستوى: M = x·Fy − y·Fx (عكس عقارب الساعة موجب).','F = 5 نيوتن , d = 3 م','M = F × d = 5 × 3','= 15 نيوتن.م'],
170:['محصلة قوتين متوازيتين في نفس الاتجاه R = F₁ + F₂، وفي اتجاهين متضادين R = الفرق بينهما.','F₁ = 3 , F₂ = 5 في نفس الاتجاه ← R = 8','لو AB = 16 م نأخذ العزوم حول A:','8 × x = 5 × 16 ← x = 10'],
171:['اتزان قضيب أفقي مسنود عند A و B: مجموع القوى الرأسية = 0، ومجموع العزوم حول أي نقطة = 0.','القضيب طوله 4 م، ووزن 12 نيوتن يؤثر على بعد 1 م من A','العزوم حول A: R_B × 4 = 12 × 1','R_B = 3 و R_A = 12 − 3 = 9'],
172:['لاتزان جسيم تحت عدة قوى مستوية: المحصلة = 0، أي مجموع المركبات الأفقية = 0 ومجموع المركبات الرأسية = 0.','قوتان متعامدتان 3 و 4 نيوتن','القوة الثالثة تساوي المحصلة وتعاكسها:','√(9 + 16) = 5 نيوتن'],
174:['الازدواج قوتان متساويتان في المقدار ومتضادتان في الاتجاه ومتوازيتان، وعزمه = F × d حيث d البعد بين خطي العمل.','F = 6 نيوتن , d = 4 م','M = F × d = 6 × 4','= 24 نيوتن.م'],
175:['الازدواج المحصل لعدة ازدواجات في مستوى واحد = المجموع الجبري لعزومها. ويتزن ازدواجان لو عزماهما متساويان في المقدار ومتضادان في الإشارة.','عزما ازدواجين: 12 و −5','المحصل = 12 + (−5)','= 7 نيوتن.م'],
178:['السرعة v = ds/dt والعجلة a = dv/dt.','s = t³ + 2t²','v = 3t² + 4t ثم a = 6t + 4','عند t = 2: v = 20 و a = 16'],
179:['للحركة بعجلة ثابتة: v = u + a t و s = u t + ½ a t².','u = 2 , a = 4 , t = 3','v = 2 + 4 × 3 = 14','s = 2 × 3 + ½ × 4 × 9 = 24'],
180:['لو r(t) = (x(t) , y(t)) فالسرعة المتجهة v = dr/dt والعجلة a = dv/dt (نشتق كل مركبة).','r(t) = (t² , t³)','v = (2t , 3t²)','عند t = 2: v = (4 , 12)'],
182:['قانون نيوتن الثاني: القوة المحصلة = الكتلة × العجلة. ومع وجود مقاومة: F − R = m a.','m = 2 كجم , a = 3 م/ث² , R = 4 نيوتن','F = m a + R = 6 + 4','F = 10 نيوتن'],
183:['جسم m₁ على سطح أفقي أملس متصل بخيط بجسم معلق m₂: العجلة a = m₂ g ÷ (m₁ + m₂) والشد T = m₁ a (g = 10).','m₁ = 6 , m₂ = 4','a = 4 × 10 ÷ 10 = 4','T = 6 × 4 = 24 نيوتن'],
184:['الدفع = القوة × الزمن = التغير في كمية الحركة: F t = m (v − u).','m = 2 , F = 6 , t = 3','F t = 18 = 2 (v − u)','v − u = 9'],
186:['الشغل = القوة × الإزاحة × جتا الزاوية بينهما: W = F d cos θ (بالجول).','F = 10 , d = 4 , θ = 60°','W = 10 × 4 × 1/2','= 20 جول'],
187:['طاقة الحركة = ½ m v²، وطاقة الوضع = m g h. والشغل المبذول = التغير في طاقة الحركة.','m = 4 , v = 5','½ × 4 × 25','= 50 جول'],
188:['القدرة = الشغل ÷ الزمن = القوة × السرعة (P = F v) بالوات.','F = 20 , v = 5','P = F v = 20 × 5','= 100 وات'],
191:['العدد المركب a + bi حيث i² = −1. نجمع الأجزاء الحقيقية معًا والتخيلية معًا، ونضرب بالتوزيع ثم نعوّض i² = −1.','(2 + 3i) + (1 − i) = 3 + 2i','(1 + 2i)(3 + i) = 3 + i + 6i + 2i²','= 3 + 7i − 2 = 1 + 7i'],
192:['نوع جذري a x² + b x + c = 0 يتحدد بالمميز Δ = b² − 4ac: لو Δ موجب فجذران حقيقيان مختلفان، لو Δ = 0 فجذران حقيقيان متساويان، لو Δ سالب فجذران مركبان غير حقيقيين.','x² − 4x + 5 = 0','Δ = 16 − 20 = −4','Δ سالب ← جذران مركبان'],
193:['لو α و β جذرا a x² + b x + c = 0 فإن α + β = −b/a و α β = c/a، والمعادلة هي x² − (α + β)x + αβ = 0.','x² − 5x + 6 = 0','المجموع 5 والحاصل 6','الجذران 2 و 3'],
194:['إشارة الدالة التربيعية f(x) = (x − p)(x − q) حيث p < q: سالبة بين الجذرين وموجبة خارجهما.','f(x) = (x − 1)(x − 4)','سالبة في الفترة (1 , 4)','وموجبة في (−∞ , 1) ∪ (4 , ∞)'],
195:['لحل متباينة الدرجة الثانية نوجد جذور المعادلة المرتبطة ثم نحدد الفترات من إشارة الدالة.','x² − 5x + 6 ≤ 0','(x − 2)(x − 3) ≤ 0','الحل: [2 , 3]'],
197:['نسبة مساحتي مضلعين متشابهين = مربع نسبة التشابه.','نسبة التشابه 2 : 3','نسبة المساحتين = 2² : 3²','= 4 : 9'],
198:['تقاطع وترين في دائرة: حاصل ضرب قطعتي أحدهما = حاصل ضرب قطعتي الآخر. وللمماس: (طول المماس)² = القطعة الخارجية × القاطع كله.','AE = 4 , EB = 6 , CE = 3','4 × 6 = 3 × ED','ED = 8'],
200:['لو DE ∥ BC في المثلث ABC فإن AD/DB = AE/EC.','AD = 2 , DB = 3 , AE = 4','2/3 = 4/EC','EC = 6'],
201:['منصف الزاوية A في المثلث ABC يقسم BC بنسبة الضلعين: BD/DC = AB/AC.','AB = 3 , AC = 5 , BC = 16','BD = 16 × 3/(3 + 5)','BD = 6'],
203:['π راديان = 180°. للتحويل من درجات إلى راديان نضرب في π/180. وطول القوس s = θ r (θ بالراديان).','60° = 60 × π/180','= π/3','s = θ r = (π/3) × 6 = 2π'],
204:['نحدد ربع الزاوية لمعرفة الإشارة ثم نستخدم زاوية الإسناد (الزاوية الحادة المناظرة).','sin 150° ← ربع ثان (الجيب موجب) وزاوية الإسناد 30°','sin 150° = sin 30°','= 1/2'],
205:['الزوايا المنتسبة: sin(180° − x) = sin x و cos(180° − x) = −cos x و sin(90° − x) = cos x و sin(−x) = −sin x و cos(−x) = cos x.','cos(180° − 30°) = −cos 30°','= −√3/2','tan(180° + x) = tan x'],
206:['لإيجاد θ من نسبتها نوجد زاوية الإسناد من الجدول ثم نحدد الربع من إشارة النسبة والفترة المعطاة.','sin θ = 1/2 , 90° < θ < 180°','زاوية الإسناد 30° والربع الثاني:','θ = 180° − 30° = 150°'],
209:['المصفوفة جدول مرتب من الأعداد. نجمع (أو نطرح) مصفوفتين من نفس الرتبة بجمع العناصر المتناظرة، ونضرب مصفوفة في عدد بضرب كل عنصر.','[1 , 2 | 3 , 4] + [0 , 1 | 2 , 1]','= [1 , 3 | 5 , 5]','2 × [1 , 2 | 3 , 4] = [2 , 4 | 6 , 8]'],
210:['ضرب مصفوفتين: عنصر الصف i والعمود j = مجموع حاصل ضرب عناصر الصف i من الأولى في عناصر العمود j من الثانية.','[1 , 2 | 3 , 4] × [0 , 1 | 1 , 0]','الصف الأول: (1×0 + 2×1 , 1×1 + 2×0)','= [2 , 1 | 4 , 3]'],
211:['محدد المصفوفة [a , b | c , d] هو a d − b c. ولو المحدد ≠ 0 يكون للمصفوفة معكوس.','[3 , 1 | 2 , 4]','det = 3 × 4 − 1 × 2','= 10'],
213:['في البرمجة الخطية نعوّض رؤوس منطقة الحل في دالة الهدف، وأكبر (أو أصغر) قيمة تكون عند أحد الرؤوس.','P = 2x + 3y والرؤوس (0 , 0) , (4 , 0) , (2 , 3) , (0 , 2)','القيم: 0 , 8 , 13 , 6','أكبر قيمة = 13'],
214:['المتجه في المستوى v = (a , b) ومعياره |v| = √(a² + b²)، والضرب القياسي u · v = a₁a₂ + b₁b₂.','v = (3 , 4)','|v| = √(9 + 16)','|v| = 5'],

217:['معادلة المستقيم المار بالنقطة (x₁ , y₁) وميله m: y − y₁ = m (x − x₁). والميل = (y₂ − y₁) ÷ (x₂ − x₁).','النقطتان (1 , 2) و (3 , 8) ← m = 3','y − 2 = 3(x − 1)','y = 3x − 1'],

223:['الفترة [a , b] هي الأعداد بين a و b شاملة الطرفين. التقاطع هو الجزء المشترك، والاتحاد يضم الفترتين معًا.','X = [1 , 5] , Y = [3 , 8]','X ∩ Y = [3 , 5]','X ∪ Y = [1 , 8]'],

226:['(aᵐ)ⁿ = aᵐⁿ، و aᵐ ÷ aⁿ = aᵐ⁻ⁿ، و a⁰ = 1، و a⁻ⁿ = 1/aⁿ.','(2²)³ = 2⁶','= 64','2⁻³ = 1/8'],
228:['التحليل بإخراج العامل المشترك الأكبر: نوجد أكبر عامل (عدد ومتغير) مشترك بين الحدود ونخرجه.','6x² + 9x','العامل المشترك 3x','= 3x(2x + 3)'],

231:['التحليل بالتقسيم: نقسم الحدود لمجموعات لها عامل مشترك ثم نخرج عاملًا مشتركًا جديدًا.','ax + ay + bx + by','= a(x + y) + b(x + y)','= (a + b)(x + y)'],
233:['حالات تطابق المثلثين: ثلاثة أضلاع، أو ضلعان وزاوية محصورة، أو زاويتان وضلع. ولا تكفي ثلاث زوايا للتطابق.','ضلعان وزاوية محصورة بينهما متساويان','المثلثان متطابقان بحالة:','ضلعين وزاوية محصورة'],
234:['عكس فيثاغورس: لو مربع أكبر ضلع = مجموع مربعي الضلعين الآخرين فالمثلث قائم الزاوية.','3 , 4 , 5','9 + 16 = 25 = 5²','المثلث قائم الزاوية'],

237:['مجموع الزوايا الداخلية لمضلع عدد أضلاعه n هو (n − 2) × 180°، والزاوية الخارجة للمنتظم 360° ÷ n.','سداسي منتظم n = 6','مجموع الزوايا = 4 × 180 = 720° ← كل زاوية 120°','الخارجة = 360 ÷ 6 = 60°'],
239:['التكرار المتجمع الصاعد عند حد فئة = مجموع تكرارات الفئات حتى هذه الفئة.','التكرارات 3 , 5 , 4 , 2','نجمع تراكميًا:','3 , 8 , 12 , 14'],
240:['الوسط الحسابي للجدول ذي المجموعات = مجموع (التكرار × مركز الفئة) ÷ مجموع التكرارات، ومركز الفئة = متوسط حديها.','فئات 0–10 , 10–20 , 20–30 وتكراراتها 2 , 4 , 2','(2×5 + 4×15 + 2×25) ÷ 8 = 120 ÷ 8','= 15'],

function startRev(pool,title){
  cur={i:-1,k:0,score:0,streak:0,qs:Array.from({length:10},()=>{const i=pool[r(0,pool.length-1)];return AQ(Object.assign({lv:i},LV[i].g()))}),rv:()=>startRev(pool,title)};
  $('#home').hidden=true;$('#lesson').hidden=true;$('#quiz').hidden=false;$('#lvname').textContent=title;show();window.scrollTo(0,0);
}
function report(){
  const g=GR[S.g],ss=S.st||{};
  const rows=g.l.map(i=>{const e=ss[i]||{r:0,w:0},n=e.r+e.w;return{i,n,p:n?Math.round(e.r/n*100):null}});
  const weak=rows.filter(x=>x.n>=3&&x.p<70).map(x=>x.i);
  let h=`<div class='q'><p>تقرير نقاط القوة والضعف – ${g.n}</p>`;
  rows.forEach(x=>{h+=`<div style='margin:12px 0'><b>${LV[x.i].n}</b><div class='bar'><i style='width:${x.p||0}%;background:${x.p==null?'var(--line)':x.p>=70?'var(--ok)':'var(--bad)'}'></i></div><small>${x.p==null?'لسه ما اتحلش':x.p+'% صح ('+x.n+' سؤال)'}</small></div>`});
  h+=`</div>`;
  h+=weak.length?`<button class='btn' id='rw'>🎯 راجع نقاط ضعفي (${weak.length})</button>`:`<p class='sub'>مفيش نقاط ضعف واضحة لحد دلوقتي. كمّل حل أسئلة عشان التقرير يبقى أدق.</p>`;
  h+=`<button class='btn alt' id='rb'>رجوع</button>`;
  $('#home').hidden=true;$('#quiz').hidden=true;$('#lesson').hidden=false;$('#lesson').innerHTML=h;
  const w=$('#rw');if(w)w.onclick=()=>startRev(weak,'مراجعة نقاط الضعف');
  $('#rb').onclick=home;
}

function d1(){if(r(0,1)){const m=r(2,5),n=r(2,5);return Q('n(A) = '+m+' و n(B) = '+n+'. عدد عناصر A × B = ؟',M('n(A × B)'),m*n,[m+n,m*n+m,m*m],['n(A × B) = n(A) × n(B)',M(m+' × '+n+' = '+m*n)])}
const a=r(1,3),b=a+r(1,3),c=r(7,8),d=c+1,P=(x,y)=>'('+x+' , '+y+')';
