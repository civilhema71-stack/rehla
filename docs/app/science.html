<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة العلوم</title>
<meta name='theme-color' content='#1f7a8c'>

<style>:root{--bg:#eef6f8;--card:#fff;--ink:#17323c;--mut:#5b727c;--acc:#1f7a8c;--acc2:#ff7a45;--ok:#1b8a4b;--bad:#d64545;--line:#cfe0e6;--hero1:#1f7a8c;--hero2:#6c5ce7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c22;--card:#17262e;--ink:#eaf4f7;--mut:#9ab4be;--acc:#4cc3d9;--acc2:#ff9a6b;--ok:#4cc68a;--bad:#ff7b7b;--line:#2b4450}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;line-height:1.8}
main{max-width:640px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
h1{font-size:1.5rem;font-weight:900;margin:0}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 14px;font:inherit;font-weight:700;color:var(--ink);white-space:nowrap}
button.pill{cursor:pointer}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:22px;padding:18px;margin-bottom:12px}.hero h2{margin:0 0 6px}.hero p{margin:0}
h2.tm{font-size:1.2rem;margin:24px 0 6px;padding:6px 14px;border-radius:14px;background:var(--acc);color:#fff}
h2.un{font-size:1.05rem;margin:18px 0 8px;color:var(--acc2)}h2.lt{margin:0 0 8px;font-size:1.3rem}
.sub{color:var(--mut);margin:0 0 10px}
.lv{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;font:inherit;cursor:pointer;transition:transform .1s}
.lv:hover:not([disabled]){transform:translateY(-2px);border-color:var(--acc)}.lv[disabled]{opacity:.5;cursor:not-allowed}
.lv b{display:block;font-size:1.05rem}.lv small{color:var(--mut)}
.badge{flex:none;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--hero2));color:#fff;display:grid;place-items:center;font-size:1.4rem}
.stars{margin-inline-start:auto;color:#f0a500;letter-spacing:2px;white-space:nowrap}
.bar{display:block;height:9px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.q{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.q p{margin:0 0 8px}.hd{text-align:center}.bigic{font-size:3rem;line-height:1}
.eq{font-size:1.3rem;font-weight:700;text-align:center;line-height:1.8}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 8px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{border-radius:16px;padding:12px 14px;margin:12px 0;border:2px solid var(--line);background:var(--card)}.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}.fb h3,.info h3{margin:0 0 6px;font-size:1.1rem}.fb p,.info p{margin:4px 0}
.info{background:var(--bg);border:2px solid var(--acc);border-radius:16px;padding:10px 14px;margin:10px 0 4px;min-height:56px}
.btn{display:block;width:100%;background:var(--acc2);color:#fff;border:0;border-radius:14px;padding:12px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:8px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:focus-visible,.ch:focus-visible,.lv:focus-visible,.tile:focus-visible,.chip:focus-visible,.cat:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row2{display:flex;gap:10px;align-items:center;margin:8px 0}.row2>*{flex:1}
.end{text-align:center}.end .big{font-size:3rem;color:#f0a500;letter-spacing:6px}
details{border-top:1px solid var(--line);padding:6px 0}summary{cursor:pointer;font-weight:700;padding:4px 0;color:var(--acc)}details p{margin:4px 0 8px;line-height:1.95}
.ex h3,.wd h3{margin:10px 0 6px;font-size:1.1rem}.kt{margin:0;padding-inline-start:20px}.kt li{margin:4px 0}
.wd{border-color:var(--acc)}.wbox label{display:block;margin:10px 0 2px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--acc2);height:34px}
select{font:inherit;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.tile{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 4px;font:inherit;color:var(--ink);cursor:pointer;text-align:center}
.tile .ti{display:block;font-size:1.8rem}.tile b{font-size:.9rem}.tile.on{border-color:var(--acc2);background:var(--card)}
.flow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:12px 0;font-weight:700}
.fb1{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:6px 10px;text-align:center}.fb1.a{border-color:#f0a500}.fb1.c{border-color:var(--ok)}.fb1.d{border-color:var(--acc)}.ar{font-size:1.4rem;color:var(--acc2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.chip{background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;color:var(--ink);cursor:pointer}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.cat{background:var(--bg);border:2px dashed var(--acc);border-radius:14px;padding:8px;font:inherit;color:var(--ink);cursor:pointer;min-height:90px}.got{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.gi{background:var(--ok);color:#fff;border-radius:999px;padding:0 8px;font-size:.85rem}
.res{min-height:1.6em;font-weight:700}.res.ok{color:var(--ok)}.res.no{color:var(--bad)}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.scene{font-size:3.4rem;text-align:center;background:var(--bg);border-radius:16px;padding:18px;min-height:120px;line-height:1.3}.pop{animation:pop .5s}@keyframes pop{0%{transform:scale(.7);opacity:.3}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.obs{margin:10px 0;padding:10px 14px;border-radius:14px;border:2px dashed var(--acc2)}
.beq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;direction:ltr;margin-bottom:10px}
.sp{text-align:center}.st{display:flex;align-items:center;justify-content:center;gap:4px;direction:ltr}.st button{width:30px;height:30px;border-radius:50%;border:2px solid var(--acc);background:var(--card);color:var(--acc);font-size:1.1rem;font-weight:900;cursor:pointer}.cf{font-size:1.5rem;min-width:24px;color:var(--acc2)}.fo{font-size:1.3rem;font-weight:900;direction:ltr}.pl,.ar2{font-size:1.4rem;padding:0 4px}
.atb{display:grid;gap:6px}.ar3{direction:ltr;display:grid;grid-template-columns:90px 1fr 24px 1fr;gap:6px;align-items:center;background:var(--bg);border-radius:12px;padding:4px 8px;border:2px solid var(--line)}.ar3.g{border-color:var(--ok)}.ar3.x{border-color:var(--bad)}.dd{display:flex;flex-wrap:wrap;gap:2px;align-items:center;direction:ltr}.dd i{width:10px;height:10px;border-radius:50%;display:inline-block}.dd small{margin-inline-start:4px;font-weight:700}.eqs{text-align:center;font-weight:900}
.legend{direction:ltr;display:grid;grid-template-columns:90px 1fr 24px 1fr;color:var(--mut);font-size:.85rem;margin-top:4px}
canvas{width:100%;max-width:340px;display:block;margin:6px auto;background:var(--bg);border-radius:14px;border:2px solid var(--line)}
svg.sol,svg.msv,svg.fsv,svg.osv,svg.csv,svg.csv2,svg.bsv,svg.atsvg,svg.thsvg{display:block;width:100%;max-height:420px;margin:0 auto;border-radius:14px}
svg.bsv{max-width:220px}svg.thsvg{max-width:120px}svg.atsvg{max-width:340px}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.tiles3 .info{padding:6px;font-size:.9rem}
.phbar{height:26px;border-radius:13px;margin:6px 0}.phv{display:flex;gap:10px;align-items:center}
.atoms{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:6px 0}.atoms i{aspect-ratio:1;border-radius:50%}.atoms .on{background:#f0a500;box-shadow:0 0 6px #f0a500}.atoms .off{background:var(--line)}
table.pn{margin:8px auto;border-collapse:collapse;direction:ltr}table.pn th,table.pn td{border:2px solid var(--line);width:70px;height:48px;text-align:center;font-weight:900;font-size:1.2rem}table.pn td{background:var(--bg)}
.credit{text-align:center;color:var(--mut);font-size:.95rem;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line)}.credit b{color:var(--ink)}.credit .me{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--acc);display:block;margin:0 auto}
[hidden]{display:none!important}
text{font-family:Cairo,Tahoma,sans-serif}
.pt{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;direction:ltr}.pe{aspect-ratio:1;border:0;border-radius:4px;font-size:.62rem;font-weight:900;color:#fff;cursor:pointer;padding:0;line-height:1;position:relative;font-family:inherit}.pe small{display:block;font-size:.4rem;opacity:.85}.pe.empty{background:transparent}.pleg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:.8rem}.pleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px}

.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;transition:transform .35s;max-width:92vw;text-align:center}.toast.on{transform:translate(-50%,0)}
.conf{position:fixed;inset:0;pointer-events:none;z-index:50}
.lvbox{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;margin:8px 0}.lvbox b{font-size:1.1rem}.lvbox small{display:block;color:var(--mut)}.lvbox .dy{color:var(--acc2);font-weight:700}
.bds{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}.bdg{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 2px;text-align:center;opacity:.55}.bdg.on{opacity:1;border-color:#f0a500}.bdg span{display:block;font-size:1.8rem}.bdg small{font-size:.75rem;line-height:1.2;display:block}
.fun{border-color:#f0a500;background:linear-gradient(135deg,var(--card),rgba(240,165,0,.08))}.act{border-color:var(--ok)}.fun h3,.act h3{margin:0 0 6px}
.lh{background:var(--bg);border-radius:12px;padding:8px 10px;font-size:.95rem;color:var(--mut)}
.card{display:block;width:100%;min-height:190px;background:linear-gradient(135deg,var(--acc),var(--hero2));color:#fff;border:0;border-radius:22px;padding:20px;font:inherit;cursor:pointer;margin:10px 0;text-align:center}.card.back{background:linear-gradient(135deg,var(--acc2),#f0a500)}.card b{display:block;font-size:1.5rem;margin-top:10px;line-height:1.6}.card small{opacity:.85}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt>div{display:grid;gap:8px;align-content:start}.ch.sm{font-size:.9rem;padding:10px 6px}.ch.sel{border-color:var(--acc2);box-shadow:0 0 0 3px var(--acc2) inset}.ch.gone{opacity:.25}
.tb{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:8px}.tb i{display:block;height:100%;background:var(--bad);width:100%;transition:width .1s linear}
</style>
</head>
<body>
<main>
  <div class="top"><h1>🔬 رحلة العلوم</h1><span class="pill">⭐ <span id="pts">0</span></span><button class="pill" id="snd" aria-label="الصوت">🔊</button></div>
  <section id="home"></section>
  <section id="quiz" hidden>
    <div class="top"><span class="pill" id="lvname"></span><span class="pill" id="streak"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="tb" id="tbar" hidden><i></i></div>
    <div class="q"><p id="ask" class="sub"></p><div class="eq" id="eq"></div></div>
    <div class="chs" id="chs"></div>
    <button class="btn alt" id="hint">💡 تلميح (−3 نقاط)</button>
    <div id="fb" hidden></div>
    <button class="btn" id="next" hidden></button>
    <button class="btn alt" id="back">رجوع للدرس</button>
  </section>
  <section id="lesson" hidden></section>

<script>
/* ===== مكتبة المحاكيات التفاعلية ===== */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuf=a=>a.slice().sort(()=>Math.random()-.5);
let S={pts:0,d:{},w:{},st:{}};
try{const x=JSON.parse(localStorage.getItem('sci1'));if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem('sci1',JSON.stringify(S))}catch(e){}};
function award(key,n){S.w=S.w||{};if(S.w[key])return false;S.w[key]=1;S.pts+=n;save();const p=$('#pts');if(p)p.textContent=S.pts;return true}
const fm=f=>f.replace(/(\d+)/g,'<sub>$1</sub>');
function parse(f){const st=[{}];let i=0;while(i<f.length){const c=f[i];if(c==='('){st.push({});i++}else if(c===')'){i++;let n='';while(/\d/.test(f[i]||''))n+=f[i++];n=n?+n:1;const t=st.pop(),p=st[st.length-1];for(const k in t)p[k]=(p[k]||0)+t[k]*n}else if(/[A-Z]/.test(c)){let e=c;i++;while(/[a-z]/.test(f[i]||''))e+=f[i++];let n='';while(/\d/.test(f[i]||''))n+=f[i++];const o=st[st.length-1];o[e]=(o[e]||0)+(n?+n:1)}else i++}return st[0]}
const gcd=(a,b)=>b?gcd(b,a%b):a;
const alive=el=>el.isConnected;
const W={};
const sl=(id,min,max,val,step)=>`<input type="range" id="${id}" min="${min}" max="${max}" value="${val}" step="${step||1}">`;
/* ---- بطاقات قابلة للنقر ---- */
W.tiles=(el,o)=>{
  el.innerHTML=`<div class="tiles">${o.items.map((t,i)=>`<button class="tile" data-i="${i}"><span class="ti">${t[0]}</span><b>${t[1]}</b></button>`).join('')}</div><div class="info" id="ti">${o.hint||'اضغط على أي بطاقة لتعرف المزيد'}</div>`;
  el.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{el.querySelectorAll('.tile').forEach(x=>x.classList.remove('on'));b.classList.add('on');const t=o.items[+b.dataset.i];el.querySelector('#ti').innerHTML=`<h3>${t[0]} ${t[1]}</h3><p>${t[2]}</p>`;tick(el,b.dataset.i,o.items.length)});
};
function tick(el,i,n){el._s=el._s||new Set();el._s.add(i);if(el._s.size>=n&&el.dataset.k)award(el.dataset.k,3)}
/* ---- مسار تحول (مصدر → جهاز → ناتج) ---- */
W.flow=(el,o)=>{
  el.innerHTML=`<div class="tiles">${o.items.map((t,i)=>`<button class="tile" data-i="${i}"><span class="ti">${t[0]}</span><b>${t[1]}</b></button>`).join('')}</div><div class="flow" id="fl"><span class="fb1">اختر جهازًا</span></div>`;
  el.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{el.querySelectorAll('.tile').forEach(x=>x.classList.remove('on'));b.classList.add('on');const t=o.items[+b.dataset.i];
    el.querySelector('#fl').innerHTML=`<span class="fb1 a">${t[2]}</span><span class="ar">⮕</span><span class="fb1 d">${t[0]}<br><small>${t[1]}</small></span><span class="ar">⮕</span><span class="fb1 c">${t[3]}</span>`;tick(el,b.dataset.i,o.items.length)});
};
/* ---- تصنيف: اختر العنصر ثم اضغط الفئة ---- */
W.sort=(el,o)=>{
  let sel=null,done=0,items=shuf(o.items.map((x,i)=>[x[0],x[1],i]));
  el.innerHTML=`<p class="sub">اضغط على عنصر ثم اضغط الفئة الصحيحة له.</p><div class="chips" id="ch">${items.map(x=>`<button class="chip" data-i="${x[2]}">${x[0]}</button>`).join('')}</div><div class="cats">${o.cats.map((c,i)=>`<button class="cat" data-c="${i}"><b>${c}</b><div class="got" id="g${i}"></div></button>`).join('')}</div><p class="res" id="rs"></p>`;
  const rs=el.querySelector('#rs');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{el.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');sel=b});
  el.querySelectorAll('.cat').forEach(c=>c.onclick=()=>{
    if(!sel){rs.textContent='اختر عنصرًا أولًا 👆';return}
    const i=+sel.dataset.i,ok=o.items[i][1]===+c.dataset.c;
    if(ok){c.querySelector('.got').insertAdjacentHTML('beforeend',`<span class="gi">${sel.textContent}</span>`);sel.remove();sel=null;done++;rs.textContent='✔ صح!';rs.className='res ok';
      if(done===o.items.length){rs.textContent='🎉 أحسنت! صنّفت الكل بشكل صحيح';if(el.dataset.k&&award(el.dataset.k,5))fanfare()}}
    else{rs.textContent='✘ جرّب فئة أخرى';rs.className='res no';sel.classList.add('shake');setTimeout(()=>sel&&sel.classList.remove('shake'),400);buzz()}
  });
};
/* ---- مختبر: خطوات تجربة ---- */
W.lab=(el,o)=>{
  let n=0;
  el.innerHTML=`<div class="scene" id="sc">${o.start}</div><div class="obs" id="ob">${o.hint||'ابدأ التجربة بالضغط على الزر'}</div><button class="btn" id="go">${o.steps[0][0]}</button><button class="btn alt" id="rs0" hidden>أعد التجربة</button>`;
  const sc=el.querySelector('#sc'),ob=el.querySelector('#ob'),go=el.querySelector('#go'),rs=el.querySelector('#rs0');
  go.onclick=()=>{const s=o.steps[n];sc.innerHTML=s[1];sc.classList.remove('pop');void sc.offsetWidth;sc.classList.add('pop');ob.innerHTML=`<b>🔍 الملاحظة:</b> ${s[2]}`;n++;
    if(n<o.steps.length)go.textContent=o.steps[n][0];else{go.hidden=true;rs.hidden=false;if(el.dataset.k&&award(el.dataset.k,4))fanfare()}};
  rs.onclick=()=>{n=0;sc.innerHTML=o.start;ob.textContent=o.hint||'ابدأ التجربة بالضغط على الزر';go.hidden=false;rs.hidden=true;go.textContent=o.steps[0][0]};
};
/* ---- موازنة المعادلات ---- */
const COL={H:'#3b82f6',O:'#ef4444',C:'#475569',N:'#8b5cf6',Na:'#f59e0b',Cl:'#10b981',Mg:'#14b8a6',Fe:'#a16207',Al:'#64748b',K:'#ec4899',Ca:'#d97706',Zn:'#0ea5e9',S:'#eab308',Cu:'#b45309',Br:'#9a3412',Ag:'#94a3b8',P:'#f97316'};
const EN={H:'هيدروجين',O:'أكسجين',C:'كربون',N:'نيتروجين',Na:'صوديوم',Cl:'كلور',Mg:'ماغنسيوم',Fe:'حديد',Al:'ألومنيوم',K:'بوتاسيوم',Ca:'كالسيوم',Zn:'خارصين',S:'كبريت',Cu:'نحاس',Br:'بروم',Ag:'فضة',P:'فوسفور'};
W.balance=(el,o)=>{
  let k=0,co=[],ok=false;
  const start=()=>{co=o.eqs[k].r.concat(o.eqs[k].p).map(()=>1);ok=false;draw()};
  function counts(sp,c){const t={};sp.forEach((f,i)=>{const p=parse(f);for(const e in p)t[e]=(t[e]||0)+p[e]*c[i]});return t}
  function draw(){
    const q=o.eqs[k],nr=q.r.length,all=q.r.concat(q.p);
    const L=counts(q.r,co.slice(0,nr)),R=counts(q.p,co.slice(nr)),els=[...new Set([...Object.keys(L),...Object.keys(R)])];
    const bal=els.every(e=>(L[e]||0)===(R[e]||0));
    const sp=(f,i)=>`<div class="sp"><div class="st"><button data-i="${i}" data-d="1" aria-label="زيادة">+</button><b class="cf">${co[i]}</b><button data-i="${i}" data-d="-1" aria-label="نقصان">−</button></div><div class="fo">${fm(f)}</div></div>`;
    const row=a=>a.map(x=>sp(all[x],x)).join('<span class="pl">+</span>');
    const rI=[...Array(nr).keys()],pI=[...Array(all.length-nr).keys()].map(i=>i+nr);
    const dots=(n,e)=>{let s='';for(let i=0;i<Math.min(n,24);i++)s+=`<i style="background:${COL[e]||'#888'}"></i>`;return s};
    el.innerHTML=`<div class="beq">${row(rI)}<span class="ar2">⟶</span>${row(pI)}</div>
    <div class="atb">${els.map(e=>{const a=L[e]||0,b=R[e]||0,g=a===b;return `<div class="ar3 ${g?'g':'x'}"><div class="nm"><b style="color:${COL[e]||'#666'}">${e}</b> ${EN[e]||''}</div><div class="dd">${dots(a,e)}<small>${a}</small></div><div class="eqs">${g?'=':'≠'}</div><div class="dd">${dots(b,e)}<small>${b}</small></div></div>`}).join('')}</div>

[['الأحماض','طعمها حامض، تحمّر عباد الشمس الزرقاء، pH أقل من 7. أمثلة: HCl (حمض الهيدروكلوريك)، H₂SO₄، حمض الخليك في الخل، وحمض الستريك في الليمون.'],['القواعد','طعمها مر وملمسها صابوني، تزرّق عباد الشمس الحمراء، pH أكبر من 7. أمثلة: NaOH (الصودا الكاوية)، KOH، النشادر.'],['التعادل','حمض + قاعدة → ملح + ماء. مثال: HCl + NaOH → NaCl + H₂O. وهو أساس علاج حموضة المعدة بمضادات الحموضة.'],['الكواشف','عباد الشمس وأزرق بروموثيمول وكاشف الرقم الهيدروجيني العام. ملاحظة: لا تتذوق الأحماض والقواعد الكيميائية أبدًا.']],

[['المفاهيم','شدة التيار (I) بالأمبير تقاس بالأميتر على التوالي. فرق الجهد (V) بالفولت يقاس بالفولتميتر على التوازي. المقاومة (R) بالأوم تعوق مرور التيار.'],['قانون أوم','V = I × R. عند ثبوت درجة الحرارة يتناسب التيار طرديًا مع فرق الجهد. إذن I = V ÷ R.'],['التوصيل على التوالي','التيار واحد، والمقاومة الكلية = مجموع المقاومات، وإذا انقطع أحد الأجزاء توقفت الدائرة.'],['التوصيل على التوازي','فرق الجهد واحد، وتنقسم التيارات، والمقاومة الكلية أقل من أصغر مقاومة، والمصابيح تعمل بشكل مستقل (توصيل المنازل).']],

[['مولد الضد والجسم المضاد','مولد الضد جزيء غريب يحرض استجابة (بروتين على سطح الميكروب). والجسم المضاد بروتين على شكل Y تفرزه الخلايا البلازمية المشتقة من الخلايا البائية، ويرتبط بمولد الضد المحدد فقط ويبطله أو يعلّمه للبلعمة.'],['الخلايا اللمفاوية','الخلايا B تنتج الأجسام المضادة (مناعة خلطية). الخلايا T: المساعدة (CD4) تنسق الاستجابة وتنشط B وT، والقاتلة (CD8) تقتل الخلايا المصابة بالفيروسات والخلايا السرطانية (مناعة خلوية). وتتكون خلايا ذاكرة.'],['الاستجابة الأولية والثانوية','الأولى بطيئة وضعيفة في أول تعرض، والثانية أسرع وأقوى بفضل خلايا الذاكرة.'],['التطعيم والأمراض','اللقاح (ميكروب ضعيف أو ميت أو جزء منه) مناعة نشطة صناعية. الأمصال أجسام جاهزة مناعة سلبية سريعة قصيرة المدى. نقص المناعة كالإيدز (HIV) يهاجم T المساعدة. الحساسية استجابة مفرطة لمادة غير ضارة. والأمراض الذاتية يهاجم الجسم فيها خلاياه (السكري من النوع 1).']],

E('a1_3',{fun:'لو كبرنا ذرة الهيدروجين إلى حجم ملعب كرة قدم لكانت النواة في حجم حبة صغيرة في المنتصف، ومعظم الذرة فراغ!',

 more:[['الفرق بين الحرارة ودرجة الحرارة','درجة الحرارة تقيس مدى سخونة الجسم بالترمومتر. أما الحرارة فهي الطاقة المنتقلة بين جسمين مختلفين في درجة الحرارة.'],['طرق الانتقال','التوصيل في الجوامد، والحمل في السوائل والغازات بصعود الساخن وهبوط البارد، والإشعاع كحرارة الشمس التي لا تحتاج وسطًا.']],
 act:'ضع ملعقة معدنية وأخرى خشبية في كوب ماء ساخن، والمس الطرفين بعد دقائق، وفسّر الفرق.',
 qx:[['لماذا تصنع مقابض الأواني من البلاستيك أو الخشب؟','لأنها عازلة للحرارة','لأنها موصلة','لأنها ثقيلة','لأنها لامعة','تمنع وصول الحرارة لليد.'],['انتقال حرارة الشمس إلينا يتم بـ:','الإشعاع','التوصيل','الحمل','الاحتكاك','الإشعاع ينتقل في الفراغ دون وسط مادي، وهو الطريقة الوحيدة التي تصلنا بها حرارة الشمس.'],['لماذا يرتفع الهواء الساخن؟','لأن كثافته أقل','لأنه أثقل','بسبب الجاذبية','لأنه بارد','الهواء الساخن يتمدد وتقل كثافته فيرتفع، ويحل محله هواء بارد، وهذا هو الحمل.']]});
E('a1_7',{fun:'عدد أنواع الحشرات المعروفة أكبر من عدد أنواع أي مجموعة أخرى من الحيوانات، وهي تمثل غالبية الأنواع الحيوانية المعروفة.',
 more:[['كيف نصنف؟','نبدأ من المملكة ثم الشعبة ثم الطائفة فالرتبة فالفصيلة فالجنس فالنوع. والنوع هو مجموعة كائنات تتزاوج فتنتج أفرادًا خصبة.'],['الفقاريات','خمس طوائف: الأسماك والبرمائيات والزواحف والطيور والثدييات، وتختلف في الغطاء الجسمي والتنفس والتكاثر.']],
 act:'اجمع صور 10 كائنات وصنفها: فقاري أم لافقاري، ثم رتّب الفقاريات في خمس طوائف.',
 qx:[['الخفاش يصنف من الثدييات لأنه:','يلد ويرضع صغاره','يطير','يعيش ليلًا','له أجنحة','الخفاش يلد صغارًا ويرضعها وجسمه مغطى بالشعر، وهذه صفات الثدييات رغم أنه يطير.'],['أي مما يلي لافقاري؟','الأخطبوط','السلحفاة','الضفدع','الحصان','الأخطبوط جسمه لين بلا عمود فقري، أما السلحفاة والضفدع والحصان ففقاريات.'],['الضفدع من:','البرمائيات','الزواحف','الأسماك','الطيور','الضفدع يعيش في الماء في طور صغره وفي البر وهو بالغ، وهذه صفة البرمائيات.']]});
E('a1_8',{fun:'السمكة المحيطية العميقة تضيء جسمها بنفسها لتجذب الفرائس في الظلام الدامس، وهذا تكيف مدهش.',
 more:[['تكيف الصحراء','الجمل يخزن الدهون في السنام وكُلاه تحفظ الماء، والفأر الصحراوي يعيش في الجحور نهارًا، والنباتات الصحراوية لها جذور طويلة وأوراق صغيرة أو أشواك.'],['تكيف المائيات','للسمك خياشيم تأخذ الأكسجين الذائب وزعانف للسباحة وجسم انسيابي يقلل مقاومة الماء.']],
 act:'قارن بين كائنين (واحد من الصحراء وآخر من الماء) في جدول: الصفة ← فائدتها.',
 qx:[['لماذا للنباتات الصحراوية أوراق صغيرة؟','لتقليل فقد الماء','لتزيد الظل','لتصنع غذاء أكثر','للزينة','الأوراق الصغيرة أو الأشواك تقلل سطح التبخر فيقل فقد الماء الثمين.'],['الشكل الانسيابي للسمك يفيد في:','تقليل مقاومة الماء','التنفس','الاختباء','الغذاء','الشكل الانسيابي يقلل مقاومة الماء فيسبح السمك بسرعة وبطاقة أقل.'],['أي صفة تكيف سلوكي؟','سبات الدب شتاءً','سنام الجمل','أجنحة الطائر','خياشيم السمك','سبات الدب شتاءً تصرف يقوم به الحيوان، أما السنام والأجنحة والخياشيم فتراكيب في الجسم.']]});
E('a1_9',{fun:'عند إشعال عود ثقاب يحدث تغيير كيميائي، لكن إذا كسرت العود فالتغير فيزيائي فقط.',
 more:[['كيف نميز؟','في التغير الفيزيائي لا تتكون مادة جديدة. وفي الكيميائي تتكون مادة جديدة بخواص مختلفة ويصاحبه غالبًا تغير لون أو غاز أو راسب أو حرارة.'],['قانون بقاء الكتلة','كتلة المواد المتفاعلة تساوي كتلة المواد الناتجة، لأن الذرات لا تفنى ولا تستحدث وإنما يعاد ترتيبها.']],
 act:'اخلط الخل مع بيكربونات الصوديوم داخل بالون على فوهة زجاجة وسجل ما يحدث، وفسّره كتغير كيميائي.',
 qx:[['أي مما يلي تغير كيميائي؟','صدأ الحديد','تجمد الماء','ذوبان السكر','تقطيع الخبز','صدأ الحديد يكوّن مادة جديدة (أكسيد الحديد) بخواص مختلفة، فهو تغير كيميائي.'],['إذا تفاعل 10 جم من مادة مع 5 جم، فكتلة الناتج:','15 جم','5 جم','10 جم','50 جم','وفق قانون بقاء الكتلة: كتلة النواتج = كتلة المتفاعلات = 10 + 5 = 15 جم.'],['من علامات التفاعل الكيميائي:','تصاعد غاز','تغير الشكل فقط','تغير الحجم','الانصهار','تصاعد الغاز دليل على تكوّن مادة جديدة، أما تغير الشكل أو الحجم فقد يكون فيزيائيًا.']]});
E('a1_10',{fun:'الرموز الكيميائية اختصارات عالمية: Na للصوديوم من اللاتينية Natrium، وFe للحديد من Ferrum.',
 more:[['كيف نوازن؟','نحصي ذرات كل عنصر في الطرفين، ثم نضع معاملات أمام الصيغ فقط دون تغيير الأرقام السفلية حتى يتساوى عدد الذرات.'],['مثال','2H₂ + O₂ → 2H₂O: على كل جانب 4 ذرات هيدروجين وذرتا أكسجين.']],
 act:'اكتب 3 معادلات بسيطة من الكتاب ووازنها بنفسك، ثم تحقق بعدّ الذرات.',
 qx:[['المعادلة الموزونة: H₂ + O₂ → H₂O تصبح:','2H₂ + O₂ → 2H₂O','H₂ + O₂ → 2H₂O','2H₂ + 2O₂ → 2H₂O','H₂ + 2O₂ → H₂O','4 ذرات هيدروجين وذرتان أكسجين على الجانبين.'],['الرقم أمام الصيغة يسمى:','معاملًا','رقمًا سفليًا','رمزًا','عددًا كتليًا','المعامل رقم يوضع أمام الصيغة ويضرب في جميع ذراتها لموازنة المعادلة.'],['لماذا نوازن المعادلة؟','لأن الذرات لا تفنى','للتجميل','لتقليل المواد','لتغيير المواد','الذرات لا تفنى ولا تستحدث، فيجب أن يتساوى عدد ذرات كل عنصر في الطرفين.']]});
E('a1_11',{fun:'سرعة الصوت في الهواء نحو 340 م/ث، أي أنك تسمع الرعد بعد رؤية البرق بثانية لكل 340 مترًا تقريبًا من المسافة.',
 more:[['الحساب','السرعة = المسافة ÷ الزمن. فإذا قطعت سيارة 120 كم في ساعتين فسرعتها 60 كم/س.'],['المسافة والإزاحة','المسافة طول المسار الفعلي، والإزاحة أقصر خط مستقيم بين البداية والنهاية مع الاتجاه. إذا عدت إلى نقطة البداية فإزاحتك صفر.']],
 act:'قس بخطواتك مسافة 20 مترًا في الفناء، وسجل زمن مشيك بالساعة وأحسب سرعتك.',
 qx:[['سيارة قطعت 150 كم في 3 ساعات. سرعتها:','50 كم/س','450','5','30','السرعة = المسافة ÷ الزمن = 150 ÷ 3 = 50 كم/س.'],['من خرج من منزله ودار حول الحي وعاد، إزاحته:','صفر','أكبر ما يمكن','مساوية للمسافة','سالبة دائمًا','الإزاحة تقاس من نقطة البداية إلى النهاية، وهما واحدة هنا فتكون الإزاحة صفرًا.'],['وحدة السرعة في النظام الدولي:','متر/ثانية','كيلوجرام','جول','نيوتن','السرعة = المسافة ÷ الزمن، والمسافة بالمتر والزمن بالثانية فوحدتها م/ث.']]});
E('a1_12',{fun:'عند الوقوف على أرض زلقة يقل الاحتكاك فتنزلق بسهولة، وهذا سبب وضع النقوش على نعال الأحذية.',
 more:[['قانون نيوتن الثاني','القوة = الكتلة × العجلة. إذا زادت القوة زادت العجلة، وإذا زادت الكتلة قلت العجلة بنفس القوة.'],['أنواع الاحتكاك','احتكاك سكوني قبل أن يتحرك الجسم، وحركي أثناء الحركة، وانزلاقي ودحرجي، والدحرجي أقل عادة من الانزلاقي.']],
 act:'اسحب كتابًا على الطاولة ثم ضع تحته أقلامًا مستديرة وقارن الجهد المبذول، واستنتج الفرق بين احتكاك الانزلاق والدحرجة.',
 qx:[['قوة 20 نيوتن أثرت على جسم كتلته 5 كجم. عجلته:','4 م/ث²','100','25','15','العجلة = القوة ÷ الكتلة = 20 ÷ 5 = 4 م/ث².'],['أي سطح له أقل احتكاك؟','الجليد','السجاد','الرمل','الخشب الخشن','السطح الأملس كالجليد يقل فيه الاحتكاك، بينما السطوح الخشنة يكثر فيها.'],['القوة تقاس بوحدة:','نيوتن','جول','وات','متر','وحدة القوة النيوتن نسبة إلى العالم إسحاق نيوتن، أما الجول فللطاقة والوات للقدرة.']]});
E('a1_13',{fun:'الزهرة أسخن كواكب المجموعة الشمسية رغم أن عطارد أقرب للشمس، بسبب غلافها الكثيف من ثاني أكسيد الكربون الذي يحبس الحرارة.',
 more:[['الكواكب الأرضية والعملاقة','الأرضية (عطارد، الزهرة، الأرض، المريخ) صخرية صغيرة. والعملاقة (المشتري، زحل، أورانوس، نبتون) غازية كبيرة وبعضها له حلقات.'],['كيف تتحرك الكواكب؟','تدور حول الشمس في مدارات بيضاوية تقريبًا بفعل جاذبيتها، وكلما بعد الكوكب عن الشمس طالت مدة دورته.']],
 act:'صمم مجسمًا بسيطًا للمجموعة الشمسية من كرات مختلفة الأحجام مرتبة حسب البعد عن الشمس.',
 qx:[['أكبر كواكب المجموعة الشمسية:','المشتري','الأرض','زحل','المريخ','المشتري أضخم الكواكب، ويتسع لأكثر من ألف كوكب بحجم الأرض.'],['أقرب كوكب للشمس:','عطارد','الزهرة','الأرض','المريخ','عطارد أول الكواكب بعدًا عن الشمس، يليه الزهرة ثم الأرض.'],['الكوكب الأحمر هو:','المريخ','الزهرة','زحل','عطارد','لون تربته بسبب أكسيد الحديد.']]});
E('a1_14',{fun:'القمر يبتعد عن الأرض نحو 3.8 سم كل سنة، وفي الماضي البعيد كان أقرب إلينا بكثير.',
 more:[['الخسوف والكسوف','الخسوف القمري يحدث عندما تقع الأرض بين الشمس والقمر. والكسوف الشمسي عندما يقع القمر بين الشمس والأرض.'],['لماذا نرى وجهًا واحدًا للقمر؟','لأن زمن دورانه حول نفسه يساوي زمن دورانه حول الأرض تقريبًا.']],
 act:'قلّد الكسوف: ضع كرة صغيرة بين مصباح وكرة أكبر في غرفة مظلمة وراقب الظل.',
 qx:[['يحدث الخسوف القمري عندما:','تقع الأرض بين الشمس والقمر','يقع القمر بين الأرض والشمس','تختفي الشمس','يقترب القمر','عندما تقع الأرض بين الشمس والقمر يسقط ظلها على القمر فيظلم.'],['تعاقب الليل والنهار سببه:','دوران الأرض حول محورها','دوران القمر','حركة الشمس','الرياح','دوران الأرض حول محورها دورة كل 24 ساعة يجعل كل منطقة تواجه الشمس ثم تبتعد.'],['الفصول تنتج عن:','ميل محور الأرض مع دورانها حول الشمس','بعد الأرض عن الشمس فقط','القمر','الغيوم','ميل محور الأرض مع دورانها حول الشمس يغير كمية الضوء والحرارة على كل نصف كرة.']]});
E('a2_1',{fun:'الذهب والفضة والنحاس معادن عُرفت منذ آلاف السنين، لأنها تُوجد في الطبيعة حرة أو سهلة الاستخلاص.',
 more:[['ترتيب الجدول','تُرتّب العناصر تصاعديًا بحسب العدد الذري. الأعمدة (المجموعات) تتشابه في الخواص، والصفوف (الدورات) تمثل المستويات.'],['الفلزات واللافلزات','الفلزات موصلة للحرارة والكهرباء ولامعة وقابلة للطرق. واللافلزات غالبًا رديئة التوصيل وهشة في الحالة الصلبة.']],
 act:'اجمع أدوات من بيتك (ملعقة، سلك نحاس، قلم رصاص، قطعة فحم) وصنفها: فلز أم لافلز ولماذا.',
 qx:[['لماذا يستخدم النحاس في الأسلاك؟','موصل جيد للكهرباء','عازل','خفيف','أصفر','النحاس موصل جيد للكهرباء وسهل السحب إلى أسلاك، لذلك يُستخدم في التوصيلات.'],['الغازات النبيلة تتميز بأنها:','خاملة','نشطة جدًا','سائلة','فلزات','مستواها الأخير مكتمل بالإلكترونات فلا تميل للتفاعل، فهي خاملة.'],['الهيليوم من:','الغازات النبيلة','الفلزات','الهالوجينات','القلويات','الهيليوم غاز نبيل يقع في المجموعة 18 ومستواه الأخير مكتمل بإلكترونين.']]});
E('a2_2',{fun:'طبقة الأوزون في الستراتوسفير تعمل كواقي شمسي طبيعي يمتص معظم الأشعة فوق البنفسجية الضارة.',
 more:[['تركيب الهواء','نحو 78% نيتروجين، 21% أكسجين، ونسب صغيرة جدًا من الأرجون وثاني أكسيد الكربون وبخار الماء.'],['طبقات الجو','التروبوسفير حيث نعيش والطقس، ثم الستراتوسفير حيث الأوزون، ثم الميزوسفير، ثم الثرموسفير، ثم الإكسوسفير.']],
 act:'اجمع خبرًا عن تلوث الهواء في مدينتك واكتب ثلاث طرق نقلله بها.',
 qx:[['أي غاز أكثر في الهواء؟','النيتروجين','الأكسجين','ثاني أكسيد الكربون','الهيدروجين','يشكل النيتروجين نحو 78% من الهواء، والأكسجين نحو 21%.'],['فائدة طبقة الأوزون:','تحجب الأشعة الضارة','تعطي الأكسجين','تنتج المطر','تحمل الطائرات','تمتص طبقة الأوزون معظم الأشعة فوق البنفسجية الضارة القادمة من الشمس فتحمي الكائنات.'],['الطقس يحدث في:','التروبوسفير','الستراتوسفير','الثرموسفير','الإكسوسفير','التروبوسفير أقرب طبقات الجو للأرض وفيها السحب والمطر والرياح.']]});
E('a2_3',{fun:'في وادي الحيتان بالفيوم هياكل حيتان عمرها نحو 40 مليون سنة، وهي موقع تراث عالمي لليونسكو.',
 more:[['كيف تتكون الأحفورة؟','يُدفن الكائن بسرعة في رواسب، وتتحول أجزاؤه الصلبة تدريجيًا بمعادن تترسب مكان الأنسجة، فتتحجر وتحتفظ بشكل الكائن.'],['فائدة الأحافير','تكشف عن الكائنات القديمة، وتساعد على تقدير أعمار الصخور، وتدلنا على البيئات القديمة وتغير المناخ.']],
 act:'اصنع أحفورة بالجبس: اضغط صدفة في طين، أزلها، واملأ القالب بجبس، وبعد جفافه سمّ ما حصلت عليه.',
 qx:[['لماذا لا تتحجر كل الكائنات؟','لأن التحجر يحتاج دفنًا سريعًا وظروفًا مناسبة','لأنها صغيرة','لأنها لا تموت','لأن الماء يمنع','التحجر يحتاج دفنًا سريعًا في رواسب وظروفًا خاصة، وأغلب الكائنات تتحلل بعد موتها.'],['أي جزء يتحجر غالبًا؟','العظام والأصداف','اللحم','الجلد','الدم','العظام والأصداف صلبة فتتحجر بسهولة، أما الأجزاء اللينة فتتحلل سريعًا.'],['وادي الحيتان يقع في:','الفيوم','أسوان','سيناء','الأقصر','وادي الحيتان في محافظة الفيوم بمصر ويضم هياكل حيتان قديمة.']]});
E('a2_4',{fun:'ساعات البندول القديمة كانت تعتمد على أن زمن تأرجح البندول ثابت تقريبًا لا يتغير بكتلة الثقل.',
 more:[['الزمن الدوري والتردد','التردد = عدد الدورات في الثانية ووحدته هرتز. والزمن الدوري = 1 ÷ التردد.'],['البندول','زمنه الدوري يزداد بزيادة طول الخيط ولا يعتمد على كتلة الثقل.']],
 act:'اصنع بندولًا من خيط وصامولة، عُدّ 10 تأرجحات بساعة التوقيت لخيطين طولهما مختلفان، واستنتج العلاقة.',
 qx:[['تردد جسم 5 هرتز. زمنه الدوري:','0.2 ثانية','5','10','0.5','الزمن الدوري = 1 ÷ التردد = 1 ÷ 5 = 0.2 ثانية.'],['يزداد زمن البندول الدوري عند:','زيادة طول الخيط','زيادة الكتلة','تقليل الطول','تغيير اللون','الزمن الدوري للبندول يزداد بزيادة طول الخيط ولا يتأثر بكتلة الثقل.'],['وحدة التردد:','هرتز','نيوتن','متر','جول','التردد عدد الدورات في الثانية الواحدة، ووحدته الهرتز.']]});
E('a2_5',{fun:'الضوء أسرع شيء معروف، ويقطع نحو 300 ألف كيلومتر في الثانية، أي يدور حول الأرض حوالي 7 مرات في ثانية واحدة.',

E('a2_6',{fun:'النحل يقوم بتلقيح نحو ثلث الغذاء الذي نأكله، لذلك حمايته مهمة لأمننا الغذائي.',

E('a3_1',{fun:'سرعة الصاروخ عند الإطلاق قد تتزايد بمعدل مئات الأمتار في الثانية كل ثانية، وهذا هو التسارع.',

E('a3_2',{fun:'عند الفرملة المفاجئة يندفع جسمك للأمام لأن جسمك يقاوم تغير حالته الحركية، وهذا هو القصور الذاتي.',

E('a3_3',{fun:'القدرة هي سرعة بذل الشغل؛ لذلك يستطيع رياضيان رفع نفس الثقل بنفس الشغل لكن بقدرة مختلفة إن اختلف الزمن.',

 qx:[['قوة 50 ن حركت جسمًا 4 م في اتجاهها. الشغل:','200 جول','54','12.5','46','الشغل = القوة × الإزاحة = 50 × 4 = 200 جول.'],['شغل 600 جول في 30 ثانية. القدرة:','20 وات','18000','630','570','القدرة = الشغل ÷ الزمن = 600 ÷ 30 = 20 وات.'],['شخص يدفع حائطًا ولا يتحرك، شغله:','صفر','كبير','سالب','لا يمكن','الشغل يحتاج إزاحة في اتجاه القوة، والحائط لم يتحرك فالشغل صفر مهما كان الجهد.']]});

E('a3_5',{fun:'السراب في الصحراء ينتج عن انكسار الضوء في طبقات هواء مختلفة الحرارة، فتبدو الأرض كأنها فوقها ماء.',

E('a3_6',{fun:'مرايا السيارات الجانبية محدبة لأنها تعطي مجال رؤية أوسع، ولذلك مكتوب عليها: الأجسام في المرآة أقرب مما تبدو.',

E('a3_7',{fun:'عين الإنسان تعمل كالكاميرا، فيها عدسة محدبة تكوّن صورة مقلوبة على الشبكية والمخ يعدلها لتراها معتدلة.',

E('a3_8',{fun:'عندما ننظر إلى نجم بعيد فإننا نراه كما كان قبل آلاف السنين، لأن ضوءه استغرق وقتًا طويلًا ليصل إلينا.',

E('a3_9',{fun:'جسمك يصنع ملايين الخلايا الجديدة كل ثانية بالانقسام لتعويض التالف ولنمو الجسم.',

E('a3_10',{fun:'تتكون البويضة في الأنثى والحيوان المنوي في الذكر، ويحمل كل منهما نصف المادة الوراثية للطفل.',

 qx:[['يحدد جنس الجنين:','الحيوان المنوي','البويضة','الرحم','المشيمة','البويضة تحمل X دائمًا، والحيوان المنوي يحمل X أو Y فهو الذي يحدد الجنس.'],['مكان الإخصاب غالبًا:','قناة فالوب','الرحم','المهبل','المبيض','يلتقي الحيوان المنوي بالبويضة غالبًا في قناة فالوب ثم تنتقل اللاقحة إلى الرحم.'],['وظيفة المشيمة:','تغذية الجنين','إنتاج البويضة','الهضم','التنفس','تنقل الغذاء والأكسجين.']]});
E('a3_11',{fun:'صدأ الحديد تفاعل بطيء بين الحديد والأكسجين والماء، وهو من أمثلة تفاعل الاتحاد، ويكلف العالم مليارات سنويًا.',
 more:[['أنواع التفاعل','اتحاد: A + B → AB. تفكك: AB → A + B. إحلال بسيط: A + BC → AC + B. إحلال مزدوج: AB + CD → AD + CB.'],['مثال إحلال','الزنك مع حمض الهيدروكلوريك: Zn + 2HCl → ZnCl₂ + H₂ (يتصاعد هيدروجين).']],

 qx:[['2H₂ + O₂ → 2H₂O تفاعل:','اتحاد','تفكك','إحلال','إحلال مزدوج','تفاعل اتحاد لأن مادتين (الهيدروجين والأكسجين) اتحدتا لتكوين مادة واحدة.'],['CaCO₃ → CaO + CO₂ تفاعل:','تفكك','اتحاد','إحلال بسيط','إحلال مزدوج','التفكك: مادة واحدة تتحلل إلى مادتين أو أكثر.'],['Fe + CuSO₄ → FeSO₄ + Cu تفاعل:','إحلال بسيط','اتحاد','تفكك','تعادل','الحديد الأنشط حل محل النحاس في مركبه، فهو إحلال بسيط.']]});
E('a3_12',{fun:'عصير الليمون حمضي وبيكربونات الصوديوم قاعدية؛ ولذلك عند خلطهما تتصاعد فقاعات ثاني أكسيد الكربون.',
 more:[['التعادل','حمض + قاعدة → ملح + ماء. مثل: HCl + NaOH → NaCl + H₂O.'],['الكواشف','عباد الشمس يحمر في الحمض ويزرق في القاعدة. وكاشف الكرنب الأحمر يتلون بألوان مختلفة بحسب الـ pH.']],
 act:'اصنع كاشفًا من الكرنب الأحمر، وجرب به خلًا وصابونًا وماءً وليمونًا، وسجل الألوان.',
 qx:[['محلول يحمر ورقة عباد الشمس الزرقاء:','حمضي','قاعدي','متعادل','ملحي','الأحماض تحول لون عباد الشمس الأزرق إلى الأحمر.'],['ناتج تفاعل التعادل:','ملح وماء','غاز','حمض','قاعدة','يتفاعل الحمض مع القاعدة في التعادل فينتج ملح وماء.'],['pH = 3 يدل على محلول:','حمضي','قاعدي','متعادل','ملحي','القيم الأقل من 7 تدل على حمض، و7 على متعادل، وأعلى من 7 على قاعدة.']]});
E('a3_13',{fun:'تسحق الأقراص الفوارة إلى مسحوق فتذوب أسرع لأن مساحة السطح تزيد فتزداد سرعة التفاعل.',
 more:[['العوامل المؤثرة','التركيز، ودرجة الحرارة، ومساحة السطح (حالة تجزئة المادة)، والعامل الحفّاز.'],['الحفّاز','مادة تزيد سرعة التفاعل دون أن تُستهلك، مثل ثاني أكسيد المنجنيز في تحلل الماء الأكسجيني.']],
 act:'اسقط قرصين فوارين في ماءين: أحدهما ساخن والآخر بارد، وقس زمن الذوبان.',
 qx:[['رفع الحرارة يجعل التفاعل:','أسرع','أبطأ','ثابتًا','يتوقف','ترتفع الحرارة فتتحرك الجسيمات أسرع وتتصادم أكثر فتزداد سرعة التفاعل.'],['الحفّاز:','يزيد السرعة ولا يستهلك','يستهلك','يبطئ','يغير الناتج','الحفاز يزيد سرعة التفاعل ويبقى كما هو بعد انتهائه دون أن يُستهلك.'],['لماذا نقطع اللحم قطعًا صغيرة لنطهوه أسرع؟','زيادة مساحة السطح','قلة الماء','زيادة الكتلة','البرودة','التقطيع يزيد مساحة السطح المعرضة للحرارة فيتم التفاعل أسرع.']]});
E('a3_14',{fun:'جسم الإنسان يوصل الكهرباء، ولذلك لا نلمس أسلاكًا مكشوفة ولا نستعمل الأجهزة بأيدٍ مبللة.',
 more:[['قانون أوم','التيار = الجهد ÷ المقاومة (I = V ÷ R). إذا زاد الجهد زاد التيار، وإذا زادت المقاومة قل التيار.'],['التوالي والتوازي','في التوالي المقاومة الكلية = مجموع المقاومات والتيار واحد. في التوازي الجهد واحد والمقاومة الكلية أقل من أصغر مقاومة.']],
 act:'ركّب مصباحين بالتوالي ثم بالتوازي وراقب سطوعهما، وفسر الفرق.',
 qx:[['جهد 12 فولت ومقاومة 4 أوم. التيار:','3 أمبير','48','8','16','التيار = الجهد ÷ المقاومة = 12 ÷ 4 = 3 أمبير.'],['مقاومتان 3 و5 أوم بالتوالي. الكلية:','8 أوم','15','2','1.9','في التوالي تجمع المقاومات: 3 + 5 = 8 أوم.'],['في التوازي إذا احترق مصباح:','يعمل الباقي','ينطفئ الكل','يحترق الكل','يزيد السطوع','لكل فرع في التوازي مسار مستقل للتيار، فيبقى الباقي مضاءً.']]});
E('a3_15',{fun:'فاتورة الكهرباء تحسب بالكيلوواط ساعة؛ فمكيف قدرته 1.5 كيلوواط يعمل 4 ساعات يستهلك 6 كيلوواط ساعة.',
 more:[['القدرة والطاقة','القدرة = الجهد × التيار (P = V × I). الطاقة = القدرة × الزمن.'],['ترشيد الاستهلاك','نستخدم أجهزة عالية الكفاءة، وننظف المكيفات، ونطفئ الأضواء، ونستعمل ضوء النهار.']],
 act:'احسب استهلاك أجهزة غرفتك في يوم باستخدام ملصق القدرة على كل جهاز، ثم احسب التكلفة التقريبية.',
 qx:[['جهاز قدرته 2 كيلوواط يعمل 3 ساعات. استهلاكه:','6 كيلوواط ساعة','5','1.5','0.67','الطاقة = القدرة × الزمن = 2 × 3 = 6 كيلوواط ساعة.'],['قدرة مصباح يمر به تيار 0.5 أمبير عند 220 فولت:','110 وات','440','220','0.5','القدرة = الجهد × التيار = 220 × 0.5 = 110 وات.'],['وحدة قياس الطاقة في الفواتير:','كيلوواط ساعة','أمبير','فولت','أوم','الشركات تحاسب على الطاقة المستهلكة بوحدة الكيلوواط ساعة.']]});
E('a3_16',{fun:'الموز يحتوي على كمية صغيرة جدًا من البوتاسيوم المشع الطبيعي، وهو غير ضار بالكميات المعتادة.',
 more:[['أنواع الإشعاعات','ألفا (أثقل وأقل نفاذًا)، بيتا (جسيمات إلكترونية)، جاما (موجات كهرومغناطيسية عالية النفاذية).'],['عمر النصف','هو الزمن اللازم لتحلل نصف كمية المادة المشعة. إذا كان 5 سنوات فبعد 10 سنوات يبقى ربع الكمية.']],
 act:'العب بنرد أو عملات: ابدأ بـ 64 قطعة، وفي كل جولة أزل نصفها، وانظر كم جولة تحتاج للوصول لقطعة واحدة (فكرة عمر النصف).',
 qx:[['كمية 80 جم عمر نصفها 3 أيام. بعد 6 أيام:','20 جم','40','10','60','6 أيام = عمرا نصف، فتنقص الكمية للنصف مرتين: 80 ← 40 ← 20 جم.'],['أكثر الإشعاعات نفاذية:','جاما','ألفا','بيتا','كلها','أشعة جاما موجات عالية الطاقة تخترق مواد سميكة، بينما يوقف ألفا ورقة.'],['من استخدامات النشاط الإشعاعي:','العلاج الإشعاعي للسرطان','طهي الطعام','الإضاءة','التنظيف','تستخدم الإشعاعات في علاج بعض أنواع السرطان وتشخيص الأمراض بحذر ومراقبة.']]});
E('a3_17',{fun:'اكتشف جريجور مندل القوانين الأساسية للوراثة من تجارب على نبات البازلاء في حديقة دير قبل نحو 160 سنة.',
 more:[['الصفات السائدة والمتنحية','الصفة السائدة تظهر في الهجين، والمتنحية تختفي ولا تظهر إلا إذا وُجد أليلاها متنحيين.'],['مربع بانيت','لتحديد نسب الأبناء: تزاوج Tt × Tt يعطي TT : Tt : tt بنسبة 1 : 2 : 1، ومظهريًا 3 سائد : 1 متنحٍ.']],
 act:'استعمل عملتين لتمثل أليلات كل أب (وجه = T، ظهر = t)، ارمهما 40 مرة وسجل النسب.',
 qx:[['ناتج Tt × Tt المظهري:','3 سائد : 1 متنحٍ','1 : 1','كلهم سائد','كلهم متنحٍ','نسبة الأفراد: TT : Tt : tt = 1 : 2 : 1، أي 3 يحملون الصفة السائدة و1 المتنحية.'],['الفرد tt مظهره:','متنحٍ','سائد','هجين','لا يعيش','الصفة المتنحية لا تظهر إلا عند وجود أليلين متنحيين معًا (tt).'],['TT × tt جميعهم:','Tt','TT','tt','نصف نصف','كل فرد يأخذ T من أحد الأبوين وt من الآخر فيصبح Tt، وتظهر الصفة السائدة.']]});
E('a3_18',{fun:'لو فرد DNA خلية واحدة لبلغ طوله نحو مترين، ويحتوي على التعليمات اللازمة لبناء الجسم كله.',
 more:[['ترتيب الوراثة','DNA ينظم في جينات، والجينات على كروموسومات داخل النواة.'],['الطفرات','تغير في المادة الوراثية قد يكون ضارًا أو محايدًا أو مفيدًا. والهندسة الوراثية تنقل جينات لإنتاج الإنسولين وغيره.']],
 act:'استخلص DNA من الفراولة بمنزلك (ملح، صابون، كحول بارد) إذا سمح المعلم وراقب الخيوط البيضاء.',
 qx:[['الجين:','جزء من DNA يحمل صفة','كروموسوم','خلية','نسيج','الجين قطعة محددة من DNA تحمل تعليمات صفة وراثية.'],['كروموسومات خلية جسمية بشرية:','46','23','44','48','الخلية الجسمية بها 23 زوجًا من الكروموسومات أي 46 كروموسومًا.'],['الإنسولين ينتج بالهندسة الوراثية من:','بكتيريا','حديد','نبات فقط','ماء','نقل جين الإنسولين البشري إلى بكتيريا يجعلها تنتجه بكميات كبيرة.']]});
E('a3_19',{fun:'هرمون الأدرينالين يجعل قلبك يخفق أسرع عند الخوف ليجهزك للهرب أو المواجهة.',
 more:[['الغدد الصماء','لا تملك قنوات وتفرز في الدم مباشرة: النخامية (الرئيسية)، الدرقية، الغدة جار الدرقية، الكظرية، البنكرياس، الغدد التناسلية.'],['التغذية الراجعة','ارتفاع السكر يحفز إفراز الإنسولين فيقل، وانخفاضه يحفز الجلوكاجون فيرتفع، فيبقى مستواه متوازنًا.']],
 act:'ارسم مخططًا لتنظيم سكر الدم بالسهمين المتعاكسين: الإنسولين والجلوكاجون.',
 qx:[['نقص الإنسولين يسبب:','السكري','تضخم الغدة','قزمية','نشاطًا زائدًا','لا يدخل السكر الخلايا.'],['الغدة الرئيسية:','النخامية','الدرقية','الكظرية','البنكرياس','الغدة النخامية تسمى الغدة الرئيسية لأنها تتحكم في إفراز معظم الغدد الأخرى.'],['الهرمونات تنتقل عبر:','الدم','قنوات','الأعصاب','الهواء','الغدد الصماء بلا قنوات، وتفرز هرموناتها مباشرة في الدم الذي ينقلها للأعضاء المستهدفة.']]});

E('b1_1',{fun:'جسم الإنسان يتكون من نحو 30 تريليون خلية تقريبًا، ولكل نوع منها شكل يناسب وظيفته.',
 more:[['الخلية النباتية والحيوانية','الخلية النباتية لها جدار خلوي وبلاستيدات خضراء وفجوة عصارية كبيرة، أما الحيوانية فليس لها جدار ولا بلاستيدات وفجواتها صغيرة. كلتاهما لهما نواة وميتوكوندريا وغشاء بلازمي.'],['العضيات ووظائفها','الميتوكوندريا تنتج الطاقة، والرايبوسومات تصنع البروتين، والشبكة الإندوبلازمية تنقل المواد، وجهاز جولجي يعبئ ويفرز، والليسوسومات تهضم.']],
 act:'ارسم خلية نباتية وخلية حيوانية جنبًا إلى جنب، وظلل العضيات المشتركة بلون والمميزة لكل منهما بلون مختلف.',
 qx:[['خلية عضلية تحتاج طاقة كبيرة. أي عضية تكون أكثر عددًا فيها؟','الميتوكوندريا','الليسوسومات','البلاستيدات الخضراء','الجدار الخلوي','الميتوكوندريا تنتج الطاقة (ATP)، والخلية العضلية تحتاج طاقة كثيرة فتحتوي أعدادًا كبيرة منها.'],['أي عضية توجد في الخلية النباتية فقط؟','البلاستيدات الخضراء','النواة','الرايبوسومات','الميتوكوندريا','البلاستيدات الخضراء تقوم بالبناء الضوئي وهي من مميزات الخلايا النباتية.'],['أين يتم تصنيع البروتين في الخلية؟','الرايبوسومات','الليسوسومات','جهاز جولجي','الفجوة','الرايبوسومات هي مصانع البروتين تترجم الشفرة الوراثية إلى سلسلة بروتينية.']]});
E('b1_2',{fun:'الإنزيمات تسرع التفاعلات داخل جسمك ملايين المرات؛ فبدونها قد يستغرق هضم وجبة واحدة سنوات!',
 more:[['خصوصية الإنزيم','لكل إنزيم موقع نشط يلائم مادة تفاعل واحدة محددة كما يلائم المفتاح قفله. لذلك يهضم الأميليز النشا فقط ولا يهضم البروتين.'],['عوامل تؤثر على النشاط','لكل إنزيم درجة حرارة ودرجة pH مثلى. ارتفاع الحرارة الشديد يغير شكل الإنزيم (تمسخ) فيفقد نشاطه، وهذا سبب خطورة الحمى الشديدة.']],
 act:'امضغ قطعة خبز دقيقة ولاحظ طعمًا حلوًا يظهر تدريجيًا بسبب إنزيم الأميليز في اللعاب.',
 qx:[['لماذا يفقد الإنزيم نشاطه عند 80°م؟','يتغير شكله (تمسخ)','يتبخر','يتحول لدهون','تزيد المادة','الحرارة العالية تكسر الروابط التي تثبت شكل الإنزيم فيفقد موقعه النشط.'],['الإنزيم الذي يهضم النشا:','الأميليز','البيبسين','الليبيز','التربسين','الأميليز يحلل النشا إلى سكريات بسيطة، والببسين والتربسين يعملان على البروتين.'],['الإنزيم بعد التفاعل:','يبقى دون تغيير','يستهلك','يتحول لمنتج','يتبخر','الإنزيمات حفازات حيوية لا تُستهلك فتعمل مرات عديدة.']]});
E('b1_3',{fun:'عندما تضع شريحة بطاطس في ماء مالح تنكمش، وفي ماء عذب تنتفخ، بسبب حركة الماء بالخاصية الأسموزية.',
 more:[['الانتشار والأسموزية والنقل النشط','الانتشار حركة المواد من التركيز الأعلى للأقل دون طاقة. الأسموزية انتشار الماء عبر غشاء شبه منفذ. والنقل النشط حركة عكس التدرج ويحتاج طاقة ATP.'],['محاليل مختلفة','في المحلول المتساوي التوتر لا تتغير الخلية، وفي المخفف (هيبوتوني) تنتفخ، وفي المركز (هيبرتوني) تنكمش.']],
 act:'ضع شرائح بطاطس في ثلاثة أكواب: ماء عذب، ماء مالح، وماء بملح قليل، واتركها نصف ساعة وقارن القوام.',
 qx:[['خلية دم حمراء في ماء مقطر ستنفجر لأن:','الماء يدخلها بالأسموزية','الماء يخرج','الملح يدخل','تنكمش','المحيط أقل تركيزًا فيتجه الماء إلى الداخل فتنتفخ حتى تنفجر.'],['أي عملية تحتاج طاقة؟','النقل النشط','الانتشار','الأسموزية','الانتشار المسهل','النقل النشط يتم عكس تدرج التركيز بمساعدة ATP.'],['ينتقل الأكسجين من الحويصلات الهوائية إلى الدم بـ:','الانتشار','النقل النشط','الإخراج','البلعمة','تركيز الأكسجين في الحويصلات أعلى منه في الدم، فينتقل بالانتشار دون طاقة.']]});
E('b1_4',{fun:'خلايا الجلد تنقسم باستمرار، لذلك يلتئم الجرح خلال أيام، بينما خلايا عصبية كثيرة لا تنقسم عند البالغين.',
 more:[['مراحل الانقسام الميتوزي','تمهيدية (ظهور الكروموسومات)، استوائية (اصطفافها)، انفصالية (انفصال الكروماتيدات)، نهائية (تكون نواتين). ثم يتم انقسام السيتوبلازم.'],['سرطان','حين يفقد الانقسام ضبطه تنقسم الخلايا بلا توقف فتتكون الأورام. لذلك يبحث العلم عن طرق لضبط الدورة الخلوية.']],
 act:'اصنع بطاقات لمراحل الانقسام ورتبها، ثم اشرح لزميل ماذا يحدث للكروموسومات في كل مرحلة.',
 qx:[['في أي مرحلة تصطف الكروموسومات في وسط الخلية؟','الاستوائية','التمهيدية','الانفصالية','النهائية','في الطور الاستوائي تصطف الكروموسومات على خط الاستواء تمهيدًا لانفصال الكروماتيدات.'],['الخلية الأم 2ن=46 تنتج بالميتوزي خلايا:','46 كروموسومًا','23','92','12','الميتوزي يعطي خليتين لكل منهما 46 كروموسومًا، أي نفس عدد الخلية الأم.'],['الانقسام الميوزي مهم لأنه:','يختزل العدد للنصف ويزيد التنوع الوراثي','ينتج خليتين متماثلتين','يصلح الجروح','يهضم','الميوزي ينتج أمشاجًا بنصف العدد من الكروموسومات، فيعود العدد كاملًا عند الإخصاب ويزداد التنوع بالعبور.']]});
E('b1_5',{fun:'العلماء وصفوا نحو مليوني نوع حي، ويقدر أن هناك ملايين أخرى لم تُكتشف بعد.',
 more:[['التسمية الثنائية','أطلقها لينيوس: الاسم العلمي من كلمتين (الجنس ثم النوع) مثل Homo sapiens، ويكتب بحروف مائلة.'],['الممالك','البدائيات (البكتيريا)، الطلائعيات، الفطريات، النباتات، الحيوانات، وتصنف أيضًا في ثلاثة نطاقات: البكتيريا والعتائق وحقيقيات النواة.']],
 act:'اختر 5 كائنات من حولك وحدد لكل منها المملكة وسبب التصنيف.',
 qx:[['الفطريات تختلف عن النباتات في أنها:','لا تصنع غذاءها بالبناء الضوئي','لها جدر','لها جذور','خضراء','الفطريات لا تحتوي كلوروفيل، فتمتص الغذاء الجاهز من مواد ميتة أو من كائنات حية.'],['النوع هو مجموعة أفراد:','تتزاوج وتنتج نسلًا خصبًا','تعيش معًا','متشابهة الشكل فقط','في مكان واحد','النوع البيولوجي أفراد يتزاوجون فيما بينهم وينتجون نسلًا قادرًا على التكاثر.'],['الاسم Homo sapiens يتكون من:','الجنس ثم النوع','العائلة ثم الرتبة','المملكة','الشعبة','في التسمية الثنائية تكون الكلمة الأولى الجنس (Homo) والثانية النوع (sapiens).']]});
E('b1_6',{fun:'جلد الإنسان أكبر عضو في الجسم، ويتكون من أنسجة طلائية وضامة وعصبية وعضلية معًا.',

E('b2_2',{fun:'تتنفس خلاياك طوال الوقت حتى وأنت نائم، وتنتج كل ميتوكوندريا جزيئات ATP بمعدل هائل.',

 qx:[['إذا ضوعفت المسافة بين شحنتين فإن القوة:','تصبح ربعها','تصبح نصفها','تتضاعف','لا تتغير','القوة تتناسب عكسيًا مع مربع المسافة، فإذا ضوعفت المسافة صارت القوة 1/4.'],['شحنة اختبار موجبة في مجال شحنة موجبة:','تتنافر','تتجاذب','لا تتأثر','تدور','الشحنتان المتشابهتان تتنافران، فتتحرك شحنة الاختبار بعيدًا عن الشحنة المصدر.'],['وحدة الشحنة:','كولوم','فولت','أمبير','أوم','الكولوم هو وحدة الشحنة الكهربية، أما الفولت للجهد والأمبير للتيار والأوم للمقاومة.']]});
E('f2_2',{fun:'أسلاك النحاس في بيتك سميكة لأن السلك الأسمك له مقاومة أقل فلا يسخن، وهذا يقلل خطر الحريق.',

E('f2_3',{fun:'بعض الطيور والسلاحف تستخدم المجال المغناطيسي للأرض كبوصلة لتجد طريقها في هجراتها الطويلة.',

 qx:[['سلك طوله 0.5 م يحمل 4 أ في مجال 0.2 تسلا عموديًا. القوة:','0.4 نيوتن','0.4 تسلا','4','0.04','F = BIL = 0.2×4×0.5.'],['قطبان متشابهان لمغناطيسين:','يتنافران','يتجاذبان','لا يتأثران','يلتصقان','القطبان المتشابهان (شمال-شمال أو جنوب-جنوب) يتنافران، والمختلفان يتجاذبان.'],['اتجاه المجال حول سلك يحمل تيارًا:','دوائر حول السلك','خط مستقيم','عشوائي','لا مجال','يتولد حول السلك المستقيم مجال على شكل دوائر، واتجاهه بقاعدة اليد اليمنى: الإبهام للتيار والأصابع للمجال.']]});
E('f2_4',{fun:'المرايا المقعرة العملاقة تركز ضوء الشمس في نقطة واحدة فتصل الحرارة لآلاف الدرجات في أفران شمسية.',

 qx:[['جسم على بعد 30 سم أمام مرآة مقعرة بعدها البؤري 10 سم. بعد الصورة:','15 سم','30','10','20','1/v = 1/10 − 1/30 = 2/30 ← v = 15.'],['صورة المرآة المحدبة دائمًا:','خيالية مصغرة معتدلة','حقيقية مقلوبة','حقيقية مكبرة','لا صورة','المرآة المحدبة تفرق الأشعة، فتكون الصورة دائمًا خيالية معتدلة ومصغرة مهما كان موضع الجسم.'],['البعد البؤري لمرآة نصف قطر تكورها 40 سم:','20 سم','80','40','10','f = r/2.']]});
E('f2_5',{fun:'الألماس يتلألأ لأن معامل انكساره عالٍ (2.4) فتنعكس الأشعة داخله انعكاسًا كليًا عدة مرات قبل أن تخرج.',

E('f2_6',{fun:'حين تنفخ إطار دراجة تزداد حرارة المضخة لأن ضغط الغاز بسرعة يرفع درجة حرارته.',

E('f3_1',{fun:'تمر محطة نقل الكهرباء بجهد عالٍ جدًا (مئات الآلاف من الفولتات) لتقليل التيار وبالتالي الفقد بالحرارة في الأسلاك.',

 qx:[['بطارية ε=12 فولت ومقاومتها الداخلية 1 أوم توصل بمقاومة 5 أوم. التيار:','2 أمبير','12','2.4','6','I = ε/(R+r) = 12/6.'],['عند نقطة تفرع يدخل 5 أ ويخرج فرع 2 أ. الفرع الآخر:','3 أمبير','7','2.5','10','حفظ الشحنة: التيار الداخل = مجموع التيارات الخارجة، 5 = 2 + x فيكون x = 3 أمبير.'],['لماذا ينقل الجهد العالي في الأسلاك الطويلة؟','لتقليل الفقد P=I²R','لزيادة التيار','للأمان','للون','رفع الجهد يقلل التيار لنفس القدرة (P = VI)، فيقل الفقد بالحرارة I²R في الأسلاك.']]});
E('f3_2',{fun:'مولدات محطات الكهرباء (السد العالي مثلًا) تعتمد على الحث: تدور ملفات داخل مجال مغناطيسي فتتولد القوة الدافعة.',

 act:'حرك مغناطيسًا داخل ملف موصول بجلفانومتر أو مصباح LED وراقب التيار، ثم غيّر السرعة.',
 qx:[['محول فيه ملف ابتدائي 100 لفة وثانوي 500 لفة والجهد الابتدائي 20 ف. الثانوي:','100 فولت','4','20','2000','Vs = Vp × Ns/Np.'],['لماذا لا يعمل المحول بتيار مستمر؟','لأن التدفق لا يتغير','لأنه يحترق','لأنه لا مقاومة','لأن الجهد صغير','التيار المستمر يولد مجالًا ثابتًا فلا يتغير التدفق في الملف الثانوي، ولا يتولد فيه جهد مستحث.'],['قانون لنز يفسر:','اتجاه التيار المستحث يعاكس سببه','قيمة المقاومة','القدرة','الجاذبية','يكون اتجاه التيار المستحث بحيث يعاكس التغير المسبب له، وهذا تطبيق لقانون حفظ الطاقة.']]});
E('f3_3',{fun:'فرن الميكروويف يعمل بموجات كهرومغناطيسية تهز جزيئات الماء في الطعام فتسخن، ولذلك لا يسخن الكوب الجاف الفارغ كثيرًا.',

 qx:[['موجة ضوئية ترددها 5×10¹⁴ هرتز. طولها (c=3×10⁸):','6×10⁻⁷ م','1.5×10²³','6×10⁷','1.6×10⁻⁶','λ = c/f = 3×10⁸/5×10¹⁴.'],['أعلى الأشعة طاقة:','جاما','الراديو','المرئي','الميكروويف','طاقة الفوتون E = hf، وأشعة جاما أعلى تردد وأقصر طول موجي، فهي الأعلى طاقة.'],['جميع الأمواج الكهرومغناطيسية في الفراغ:','لها نفس السرعة','سرعاتها مختلفة','لا تنتقل','تحتاج وسطًا','كل الأمواج الكهرومغناطيسية تنتقل في الفراغ بنفس السرعة c = 3×10⁸ م/ث وتختلف في التردد.']]});
E('f3_4',{fun:'لهذه الظاهرة نال أينشتاين جائزة نوبل، وليس عن النسبية؛ فقد فسر أن الضوء يتكون من حزم طاقة (فوتونات).',

 qx:[['زيادة شدة ضوء أقل من تردد العتبة:','لا تحرر إلكترونات','تحرر أكثر','تزيد الطاقة','تقلل','كل فوتون يمتلك طاقة أقل من اللازم لتحرير إلكترون، فزيادة عدد الفوتونات (الشدة) لا تفيد.'],['زيادة شدة الضوء فوق العتبة تزيد:','عدد الإلكترونات المتحررة','طاقة كل إلكترون','تردد العتبة','دالة الشغل','زيادة الشدة تعني فوتونات أكثر فتتحرر إلكترونات أكثر، أما طاقة كل إلكترون فتعتمد على التردد.'],['طاقة فوتون ترددها 10¹⁵ هرتز (h=6.6×10⁻³⁴):','6.6×10⁻¹⁹ جول','6.6×10⁻⁴⁹','10¹⁵','6.6','E = hf.']]});
E('f3_5',{fun:'نواة الذرة صغيرة جدًا؛ فلو كانت الذرة بحجم ملعب كبير لكانت النواة بحجم حبة صغيرة، لكنها تحمل معظم كتلة الذرة.',

E('f3_6',{fun:'يستخدم علماء الآثار الكربون-14 لتقدير عمر المومياوات والأخشاب القديمة حتى نحو 50 ألف سنة.',

E('k1_2',{fun:'اكتشف مندليف نظامه قبل معرفة بعض العناصر، فترك فراغات وتنبأ بخواص الجرمانيوم قبل اكتشافه، وتطابقت تنبؤاته مع الواقع.',

E('k1_3',{fun:'الماس والجرافيت كلاهما كربون صرف، لكن اختلاف ترتيب الذرات (الروابط) يجعل أحدهما أصلب مادة طبيعية والآخر طريًا كقلم الرصاص.',

 qx:[['نوع الرابطة في NaCl:','أيونية','تساهمية','فلزية','هيدروجينية','ينتقل إلكترون من الصوديوم (فلز) إلى الكلور (لافلز) فتتكون أيونات تتجاذب برابطة أيونية.'],['مادة صلبة لا توصل الكهرباء لكنها توصلها منصهرة، هي غالبًا:','أيونية','فلزية','تساهمية غير قطبية','غاز','المركبات الأيونية صلبة لا تتحرك أيوناتها، وعند الانصهار تتحرك الأيونات فتوصل الكهرباء.'],['عدد الروابط التساهمية في جزيء N₂:','ثلاثية','أحادية','ثنائية','لا يوجد','كل ذرة نيتروجين تحتاج ثلاثة إلكترونات لتكمل ثمانية، فتتشاركان ثلاثة أزواج (رابطة ثلاثية).']]});
E('k1_4',{fun:'المول من أي مادة يحتوي 6.02×10²³ جسيمًا، فـ 18 جم من الماء (أكثر قليلًا من ملعقة كبيرة) تساوي مولًا واحدًا، أي عدد هائل من الجزيئات.',

E('k2_3',{fun:'في صناعة الأمونيا (هابر) يُضبط الضغط والحرارة بدقة لتحريك الاتزان نحو النواتج، وبهذه الطريقة يُنتج غذاء ملايين البشر عبر الأسمدة.',

E('k2_4',{fun:'كمادة الإسعاف الفورية الباردة تعمل بتفاعل ماص للحرارة يبرد الكيس بمجرد كسر الغشاء الداخلي.',

E('k2_6',{fun:'رفع حرارة التفاعل 10°م يضاعف سرعته غالبًا مرتين إلى ثلاث، ولذلك نحفظ الطعام في الثلاجة لإبطاء تفاعلات التلف.',

E('k3_1',{fun:'البترول خليط هيدروكربونات يفصل في أبراج التقطير إلى غاز وبنزين وكيروسين وسولار ومازوت، كل منها حسب درجة غليانه.',

 more:[['المجموعات','الكحولات (OH–)، الأحماض الكربوكسيلية (COOH–)، الألدهيدات والكيتونات (C=O)، الاسترات (COO–)، الأمينات (NH₂–).'],['تفاعل الأسترة','حمض كربوكسيلي + كحول ⇌ استر + ماء، بوجود حمض كبريتيك مركز كحفاز.']],
 act:'قارن رائحة الخل والكحول الطبي (بحذر) وربط كل منهما بمجموعته الوظيفية.',
 qx:[['المجموعة الوظيفية في الكحولات:','–OH','–COOH','–CHO','–NH₂','الكحولات تحتوي مجموعة هيدروكسيل –OH مرتبطة بذرة كربون مشبعة.'],['ناتج تفاعل الإيثانول مع حمض الخليك:','أسيتات الإيثيل + ماء','إيثان','CO₂ فقط','ملح','تفاعل الأسترة ينتج استرًا (أسيتات الإيثيل) وماءً بوجود حمض كبريتيك مركز.'],['الحمض العضوي مميز بالمجموعة:','–COOH','–OH','–NH₂','C=C','الأحماض العضوية تحتوي مجموعة كربوكسيل –COOH.']]});
E('k3_3',{fun:'البلاستيك والنايلون والحرير الصناعي كلها بوليمرات، وبعضها يستغرق مئات السنين ليتحلل، فإعادة التدوير مهمة.',
 more:[['البلمرة','بلمرة الإضافة: جزيئات غير مشبعة تتحد معًا مثل الإيثين → بولي إيثيلين. بلمرة التكاثف: ترتبط الوحدات مع فقد جزيء صغير كالماء مثل النايلون.'],['أثر البلاستيك','يلوث البحار ويضر الكائنات، لذلك نقلل استخدامه ونفرزه ونعيد تدويره.']],
 act:'صنف 10 منتجات بلاستيكية في بيتك بحسب رمز التدوير المطبوع عليها، وابحث عن إمكانية إعادة تدويرها.',
 qx:[['بلمرة الإيثين تنتج:','بولي إيثيلين','بولي فينيل كلوريد','نايلون','سليلوز','ترتبط آلاف جزيئات الإيثين معًا فتتكون سلسلة بولي إيثيلين.'],['بلمرة التكاثف تتميز بأنها:','يفقد فيها جزيء صغير','لا تنتج ماء','تحتاج رابطة ثنائية','تتم دون وحدات','في بلمرة التكاثف ترتبط الوحدات مع فقد جزيء صغير كالماء، كما في تكوين النايلون.'],['لماذا يضر البلاستيك البيئة؟','لا يتحلل بسهولة','يتحلل بسرعة','يغذي النباتات','يبرد الجو','البلاستيك يقاوم التحلل مئات السنين فيتراكم ويضر الكائنات البحرية والتربة.']]});
E('k3_4',{fun:'شرطة الأدلة الجنائية تعرف المواد المجهولة بالتحليل الكروماتوجرافي أو الطيفي، ومن بقعة صغيرة جدًا.',
 more:[['التحليل الكيفي والكمي','الكيفي يحدد ماذا توجد من مواد (كشوف الأيونات)، والكمي يحدد كمية كل مادة (المعايرة).'],['المعايرة','نضيف محلولًا معلوم التركيز من السحاحة إلى محلول مجهول حتى نقطة التعادل ونحسب M₁V₁ = M₂V₂ مع مراعاة النسب.']],
 act:'اجرِ تجربة كروماتوجرافيا الورق: ضع نقطة حبر على ورق ترشيح في ماء وراقب انفصال الألوان.',
 qx:[['25 مل HCl عيّرت بـ 20 مل NaOH 0.1 مولار (1:1). تركيز HCl:','0.08 مولار','0.125','0.1','2','عند التكافؤ: M × 25 = 0.1 × 20، فيكون M = 2 ÷ 25 = 0.08 مولار.'],['نقطة التكافؤ في المعايرة هي:','تساوي مولات الحمض والقاعدة المتفاعلة','تغير pH فقط','نهاية الدلاء','لا شيء','عندها تكون مولات الحمض مساوية تمامًا لمولات القاعدة وفق نسبة المعادلة.'],['كروماتوجرافيا الورق تفصل المواد حسب:','سرعة صعودها مع المذيب','لونها','كتلتها فقط','حجمها فقط','تتحرك كل مادة مع المذيب بسرعة مختلفة بحسب ذوبانها وانجذابها للورق فتنفصل.']]});
E('k3_5',{fun:'الطاقة النووية تنتج الكهرباء في محطات مثل الضبعة في مصر التي تُنفذ بالتعاون مع شريك دولي.',
 more:[['الانشطار والاندماج','الانشطار: تفتت نواة ثقيلة (اليورانيوم) لنواتين وطاقة. الاندماج: اتحاد نواتين خفيفتين (هيدروجين) ويطلق طاقة أكبر لكل كتلة، وهو ما يحدث في الشمس.'],['الأمان','تتحكم القضبان والمهدئ في سرعة التفاعل، ويحتاج التخلص من النفايات إلى تخزين طويل آمن.']],
 act:'اجمع معلومات عن مشروع الضبعة (الموقع، الغرض، سنة الاستكمال) من مصدر موثوق واكتب فقرة عن فوائده وتحدياته.',
 qx:[['اندماج نواتي هيدروجين ينتج:','هيليوم وطاقة','يورانيوم','أكسجين','فحم','اندماج نوى الهيدروجين ينتج هيليوم ويحرر طاقة كبيرة، وهو ما يحدث في الشمس.'],['فائدة قضبان التحكم في المفاعل:','امتصاص نيوترونات لتنظيم التفاعل','تسخين الماء','تبريد','التوليد','تمتص قضبان التحكم النيوترونات الزائدة فتمنع تفاعلًا متسلسلًا خارج السيطرة.'],['الفرق بين الانشطار والاندماج:','الأول تفتت والثاني اتحاد','العكس','لا فرق','كلاهما اتحاد','الانشطار تفتت نواة ثقيلة إلى أصغر منها، والاندماج اتحاد نواتين خفيفتين لتكوين نواة أثقل.']]});
E('k3_6',{fun:'مصر تنتج الحديد والألومنيوم والأسمنت، والألومنيوم يُستخلص بالتحليل الكهربي لأكسيده المصهور لأنه فلز نشط.',
 more:[['طرق الاستخلاص','الفلزات الأقل نشاطًا (الذهب) توجد حرة، والمتوسطة (الحديد) تُختزل بالكربون، والنشطة (الألومنيوم) بالتحليل الكهربي.'],['الأفران العالية','في فرن الحديد يختزل أول أكسيد الكربون خام الحديد: Fe₂O₃ + 3CO → 2Fe + 3CO₂.']],
 act:'ابحث عن ثلاثة صناعات مصرية قائمة على الفلزات وحدد مصدر الخام لكل منها.',
 qx:[['يستخلص الألومنيوم بـ:','التحليل الكهربي','الاختزال بالكربون','التسخين فقط','الإحلال','الألومنيوم فلز نشط جدًا لا يمكن اختزاله بالكربون، فيستخلص بالتحليل الكهربي لأكسيده المصهور.'],['وظيفة الكربون في فرن الحديد:','الاختزال','التأكسد','التبريد','التلوين','الكربون يتحول إلى أول أكسيد الكربون الذي يختزل أكسيد الحديد إلى حديد.'],['الذهب يوجد في الطبيعة:','حرًا','أكسيد','كبريتيد','كلوريد','الذهب قليل النشاط الكيميائي فيوجد حرًا في الطبيعة.']]});

E('p4_1',{fun:'الجمل يستطيع أن يشرب أكثر من 100 لتر من الماء في دقائق قليلة، ورموشه الطويلة تحمي عينيه من الرمال.',
 more:[['أنواع التكيف','التكيف الشكلي مثل لون الحرباء ومنقار الطائر، والتكيف الوظيفي مثل قدرة الجمل على تحمل العطش، والتكيف السلوكي مثل هجرة الطيور واختباء الحيوانات في النهار الحار.'],['لماذا التكيف مهم؟','البيئة تتغير بين حارة وباردة وجافة ورطبة. والكائن الذي يملك صفات مناسبة لبيئته يجد غذاءه ويهرب من أعدائه فيعيش ويتكاثر، أما الكائن غير المتكيف فقد يموت أو ينتقل.']],
 act:'اختر حيوانًا تحبه وارسمه، ثم اكتب تحته ثلاث صفات في جسمه تساعده على العيش في بيئته.',
 qx:[['ثعلب الصحراء له أذنان كبيرتان. ما فائدتهما؟','يطلق الحرارة ويسمع جيدًا','يطير بهما','يحفر بهما','يخزن بهما الماء','الأذنان الكبيرتان تساعدان الثعلب على التخلص من حرارة جسمه وسماع فريسته.'],['طائر السنونو يترك مصر في الشتاء ويعود في الربيع. هذا نوع من:','الهجرة','التمويه','السبات','الافتراس','انتقال الطائر إلى مكان أدفأ وأوفر غذاءً سلوك تكيفي.'],['أي مثال على التكيف السلوكي؟','اختباء السحلية تحت الصخور وقت الظهيرة','ريش البطريق','زعانف السمك','سنام الجمل','الاختباء تصرف يقوم به الحيوان، أما الباقي فصفات في الجسم.']]});
E('p4_2',{fun:'في لسانك حوالي 10 آلاف حاسة تذوق صغيرة تسمى براعم التذوق، وتتجدد كل أسبوعين تقريبًا.',
 more:[['أعضاء الحواس وما تستقبله','العين تستقبل الضوء، والأذن تستقبل الاهتزازات الصوتية، والأنف يستقبل جزيئات الروائح في الهواء، واللسان يستقبل المواد الذائبة في اللعاب، والجلد يستقبل اللمس والحرارة والألم.'],['حين تتعاون الحواس','عندما تأكل تفاحة تستخدم البصر لترى لونها، والشم لتشم رائحتها، واللمس لتحس بقوامها، والتذوق لتعرف حلاوتها. وعند انسداد الأنف بالزكام يضعف إحساسك بالطعم.']],
 act:'اغمض عينيك واطلب من أحد أفراد أسرتك أن يعطيك قطعتين من الطعام لتعرفهما بالشم واللمس فقط، ثم جرّب مع إغلاق الأنف وراقب الفرق.',
 qx:[['لماذا لا نشعر بطعم الطعام جيدًا عند الزكام؟','لأن حاسة الشم تضعف','لأن اللسان يختفي','لأن الأذن تنسد','لأن العين تتعب','الطعم يعتمد على التذوق والشم معًا.'],['أي حاسة نستخدمها لنعرف أن الكوب ساخن؟','اللمس','السمع','الشم','التذوق','الجلد فيه مستقبلات للحرارة.'],['الرسالة من العين إلى المخ تنتقل عبر؟','العصب البصري','العظام','الدم فقط','العضلات','الأعصاب تنقل الإشارات إلى المخ.']]});
E('p4_3',{fun:'يصل ضوء الشمس إلى الأرض في حوالي 8 دقائق و20 ثانية تقريبًا، أي أننا نرى الشمس كما كانت قبل ذلك الوقت.',
 more:[['الأجسام الشفافة والمعتمة','الجسم الشفاف (الزجاج) يسمح بمرور الضوء فنرى ما خلفه بوضوح. الجسم نصف الشفاف (الورق الزيتي) يسمح بمرور جزء من الضوء. والجسم المعتم (الخشب) لا يسمح بمروره فيتكون ظل.'],['حجم الظل','كلما اقترب الجسم من مصدر الضوء كبر ظله، وكلما ابتعد صغر. وفي الصباح الباكر والعصر يطول ظلك، وعند الظهيرة يقصر.']],
 act:'في غرفة مظلمة سلّط كشاف على يدك أمام الحائط، وحرّك يدك قريبًا وبعيدًا وراقب تغيّر حجم الظل.',
 qx:[['أي جسم يكوّن ظلًا واضحًا؟','لوح من الخشب','لوح من الزجاج الشفاف','الهواء','الماء الصافي','الجسم المعتم يمنع مرور الضوء.'],['عند الظهيرة يكون ظلك:','أقصر ما يمكن','أطول ما يمكن','معدومًا دائمًا','بلا شكل','الشمس تكون أعلى ما يمكن في السماء.'],['القمر نراه لأنه:','يعكس ضوء الشمس','يصدر ضوءًا خاصًا','نجم','شفاف','القمر جسم معتم يعكس الضوء الساقط عليه.']]});
E('p4_4',{fun:'لو ركلت كرة في الفضاء حيث لا احتكاك لاستمرت في الحركة إلى الأبد ما لم تصطدم بشيء.',
 more:[['ماذا تفعل القوة؟','القوة قد تحرك جسمًا ساكنًا، أو توقف جسمًا متحركًا، أو تغير اتجاه حركته، أو تغير شكله مثل ضغط الإسفنجة.'],['الاحتكاك مفيد وضار','الاحتكاك يساعدنا على المشي دون انزلاق ويوقف السيارة عند الفرملة. لكنه يسبب تآكل الأجزاء المتحركة فنستخدم الزيوت لتقليله.']],
 act:'ادفع لعبة على أرض خشنة (سجاد) ثم على أرض ملساء (بلاط) بنفس القوة، وقارن المسافة التي تقطعها في كل مرة.',
 qx:[['لماذا تقطع الكرة مسافة أطول على الجليد؟','الاحتكاك أقل','الكرة أخف','الجاذبية تنعدم','الهواء يدفعها','السطح الأملس يقلل الاحتكاك.'],['أي مثال يوضح أن القوة تغيّر الاتجاه؟','لاعب يضرب الكرة بالرأس فتتغير وجهتها','كرة ساكنة على الأرض','حجر في قاع البحر','جبل','القوة غيّرت اتجاه الكرة.'],['ما فائدة الاحتكاك في إطارات السيارة؟','يمنع الانزلاق','يزيد السرعة بلا حدود','يقلل الوزن','يبرد الطريق','يحسن التماسك بين الإطار والطريق.']]});
E('p4_5',{fun:'الشلالات تنقل طاقة الوضع للماء إلى طاقة حركية، وتستخدم في السدود لتوليد الكهرباء.',
 more:[['أمثلة من حياتك','عند أرجحة الأرجوحة تتحول طاقة الوضع عند أعلى نقطة إلى حركية عند أسفل نقطة ثم تعود من جديد. والطفل أعلى المنزلق عنده طاقة وضع تتحول لحركة أثناء الانزلاق.'],['العلاقة بين الكتلة والسرعة','شاحنة كبيرة وسيارة صغيرة تسيران بنفس السرعة، فالشاحنة طاقتها الحركية أكبر لأن كتلتها أكبر. وكلما زادت السرعة زادت الطاقة الحركية بشدة.']],
 act:'اقذف كرة صغيرة من ارتفاعات مختلفة على كومة رمل أو دقيق وقارن عمق الحفرة، وفسّر النتيجة بالطاقة.',
 qx:[['أي جسم عنده أكبر طاقة وضع؟','حجر على قمة جبل','حجر على الأرض','حجر في حفرة','ريشة على الأرض','الارتفاع الأكبر يعني طاقة وضع أكبر.'],['عند أسفل المنزلق تكون طاقة الطفل:','حركية أكبر','وضع أكبر','معدومة','ضوئية','طاقة الوضع تحولت إلى حركية.'],['زنبرك مضغوط يملك:','طاقة وضع','طاقة حركية فقط','لا طاقة','طاقة ضوئية','الطاقة مخزنة في الزنبرك.']]});
E('p4_6',{fun:'أحزمة الأمان تقلل خطر الإصابة الخطيرة في الحوادث بدرجة كبيرة جدًا، لذلك نربطها دائمًا حتى في المشاوير القصيرة.',
 more:[['كيف تحمينا وسائل الأمان؟','حزام الأمان يمنع اندفاع الجسم للأمام عند الفرملة المفاجئة. الوسادة الهوائية تمتص جزءًا من الصدمة. والخوذة تحمي الرأس بامتصاص قوة الاصطدام.'],['قواعد الأمان على الطريق','نعبر من أماكن عبور المشاة، ونرتدي الخوذة على الدراجة، ولا نجلس في المقعد الأمامي إذا كنا صغارًا، ونلتزم بحدود السرعة.']],
 act:'اصنع مع أسرتك قائمة بخمس قواعد أمان في السيارة وعلّقها في البيت.',
 qx:[['لماذا يندفع الركاب للأمام عند الفرملة المفاجئة؟','لأن أجسامهم تستمر في الحركة','لأن السيارة تسحبهم','بسبب الضوء','بسبب الصوت','الجسم المتحرك يميل لمواصلة حركته.'],['أي إجراء يقلل أخطار التصادم؟','تخفيف السرعة','زيادة السرعة','عدم ربط الحزام','القيادة بسرعة','السرعة الأقل تعني طاقة أقل.'],['طاقة التصادم تكون أكبر عندما:','تزيد الكتلة والسرعة','تقل الكتلة','يقل السرعة','يتوقف الجسم','الطاقة الحركية تعتمد عليهما.']]});
E('p4_7',{fun:'المصباح التقليدي يحول جزءًا كبيرًا من الكهرباء إلى حرارة، أما مصباح LED فيحول معظمها إلى ضوء ولذلك يوفر الطاقة.',
 more:[['التحولات في الأجهزة','الغسالة تحول الكهرباء إلى حركة، والتلفاز إلى ضوء وصوت، والمكواة إلى حرارة. وفي كل جهاز يضيع جزء من الطاقة على شكل حرارة.'],['كيف نوفر الطاقة؟','نستخدم مصابيح LED، ونفصل الأجهزة عن الكهرباء عند عدم الاستخدام، ونفتح الستائر لضوء النهار، ونضبط المكيف على درجة معتدلة.']],
 act:'مر على غرف بيتك واحسب عدد الأجهزة التي تُترك تعمل دون حاجة، واقترح كيف توفر الطاقة.',
 qx:[['أي جهاز يحول الكهرباء إلى حركة وضوء وصوت معًا؟','سيارة لعبة بأضواء وصوت','كتاب','حجر','كوب','السيارة اللعبة تحول الكهرباء إلى حركة وضوء وصوت.'],['الشاحن يسخن لأن جزءًا من الطاقة:','يتحول إلى حرارة','يختفي','يتحول لماء','يصبح مادة','تضيع الطاقة على شكل حرارة.'],['أيهما يوفر الكهرباء؟','إطفاء المصباح عند الخروج','تركه مضاءً','فتح الثلاجة طويلًا','تشغيل المراوح فارغة','إطفاء المصباح عند الخروج يمنع هدر الطاقة، أما ترك الأجهزة تعمل بلا حاجة فيستهلك كهرباء دون فائدة.']]});
E('p4_8',{fun:'الغاز الطبيعي الذي نستخدمه في البيوت عديم الرائحة في الأصل، ويضاف إليه مركب برائحة مميزة حتى نكتشف التسرب.',
 more:[['كيف تتكون الوقود الأحفوري؟','البترول والفحم والغاز تكونت من بقايا كائنات حية دُفنت منذ ملايين السنين تحت ضغط وحرارة. ولا يتجدد بسرعة، لذلك ينفد مع كثرة الاستخدام.'],['السلامة','نبتعد عن اللهب والشرر عند الوقود، ولا نشعل النار قرب البنزين، وإذا شممنا غازًا نفتح النوافذ ولا نشعل أي كهرباء ونخرج.']],
 act:'اسأل والديك عن نوع الوقود الذي تستخدمه أسرتك للطهي والسيارة، وصنّفها: صلب أم سائل أم غاز.',
 qx:[['لماذا نبحث عن بدائل للبترول؟','لأنه ينفد ويلوث','لأنه رخيص جدًا','لأنه متجدد','لأنه بلا طاقة','المصادر الأحفورية محدودة.'],['إذا شممت رائحة غاز في البيت تفعل:','تفتح النوافذ وتبتعد وتبلغ الكبار','تشعل عود ثقاب','تشغل الكهرباء','تغلق النوافذ','الشرارة قد تسبب حريقًا.'],['من الوقود الصلب:','الفحم والخشب','البنزين','الغاز الطبيعي','الكيروسين','الفحم والخشب مواد صلبة تُستخدم كوقود.']]});
E('p4_9',{fun:'مجمع بنبان في أسوان من أكبر محطات الطاقة الشمسية في العالم، ويضم ملايين الألواح الشمسية.',
 more:[['كيف تعمل الألواح الشمسية؟','تحول الخلايا الشمسية ضوء الشمس إلى كهرباء مباشرة. وتحتاج إلى شمس ساطعة، ومصر من أغنى دول العالم بضوء الشمس.'],['طاقة الرياح','تدير الرياح شفرات التوربينات فتدير مولدًا يصنع الكهرباء. وتُقام المحطات في أماكن كثيرة الرياح مثل ساحل البحر الأحمر.']],
 act:'ضع كوبين من الماء أحدهما في الشمس والآخر في الظل لساعة وقس الحرارة بترمومتر وفسّر النتيجة.',
 qx:[['لماذا تناسب مصر الطاقة الشمسية؟','لكثرة أيام الشمس','لقلة الشمس','للبرد','للأمطار','معظم أيام السنة مشمسة.'],['مصدر طاقة يتجدد؟','الرياح','الفحم','البترول','الغاز','لا ينتهي مع الاستخدام.'],['ما الذي يدير توربين الرياح؟','حركة الهواء','الماء','الشمس','الفحم','حركة الهواء تدفع الشفرات فتدور، ويدير الدوران مولدًا يحول الحركة إلى كهرباء.']]});
E('p5_1',{fun:'ورقة شجرة واحدة كبيرة تستطيع أن تصنع غذاءً يكفي الشجرة طوال النهار، والأشجار تنتج جزءًا كبيرًا من الأكسجين الذي نتنفسه.',
 more:[['ماذا تفعل أوراق النبات؟','تمتص الأوراق ثاني أكسيد الكربون من الهواء عبر ثقوب صغيرة تسمى الثغور، وتمتص الجذور الماء، ويصنع الكلوروفيل السكر بالضوء.'],['تجربة الضوء','عندما نغطي ورقة بورق أسود لعدة أيام تصبح شاحبة لأنها حُرمت من الضوء ولم تتمكن من صنع الغذاء.']],
 act:'ازرع بذرتين في كوبين: ضع أحدهما في الضوء والآخر في الظلام وراقب الفرق خلال أسبوعين.',
 qx:[['من أين يأخذ النبات ثاني أكسيد الكربون؟','من الهواء','من التربة','من الماء فقط','من الضوء','يدخل ثاني أكسيد الكربون من الهواء عبر ثقوب صغيرة في الأوراق تسمى الثغور.'],['تصبح النبتة صفراء في الظلام لأنها:','لا تصنع الكلوروفيل والغذاء','تأكل كثيرًا','تشرب كثيرًا','تحب الظلام','الكلوروفيل لا يتكون جيدًا دون ضوء، ولا يتم البناء الضوئي فلا تصنع النبتة غذاءها وتضعف.'],['ما نواتج البناء الضوئي؟','سكر وأكسجين','ماء وملح','نشا وحرارة','بروتين وفيتامين','يصنع غذاء ويطلق غازًا.']]});
E('p5_2',{fun:'تنتقل نحو عُشر الطاقة فقط من مستوى غذائي إلى المستوى الذي يليه، ولذلك قلّما تزيد السلسلة الغذائية عن خمس حلقات.',
 more:[['أنواع المستهلكات','العواشب تأكل النبات كالأرنب والبقرة، واللواحم تأكل الحيوانات كالأسد، والقوارت تأكل الاثنين كالإنسان والدب.'],['دور المحللات','لو لم تكن هناك بكتيريا وفطريات لتراكمت الأجسام الميتة ولما عادت المعادن للتربة لتستفيد منها النباتات.']],
 act:'ارسم سلسلة غذائية في بستان بيتك أو حديقتك من ثلاث حلقات على الأقل، وضع الأسهم باتجاه انتقال الطاقة.',
 qx:[['في السلسلة: عشب ← جراد ← ضفدع ← ثعبان، من المستهلك الأول؟','الجراد','العشب','الضفدع','الثعبان','لأنه يأكل المنتج مباشرة.'],['لماذا الشمس مهمة في السلسلة؟','لأنها مصدر الطاقة للنبات','لأنها تأكل','لأنها محلل','لأنها حيوان','البناء الضوئي يحتاج ضوءًا.'],['الإنسان في السلاسل يعد:','قارتًا','منتجًا','محللًا','عاشبًا فقط','الإنسان يأكل النبات واللحم معًا، لذلك يسمى قارتًا (كلّي التغذية).']]});
E('p5_3',{fun:'في أستراليا أدخل الإنسان الأرانب فتكاثرت دون أعداء طبيعيين وأضرت بالنباتات والتربة، وهذا مثال على اختلال التوازن.',
 more:[['تأثير الإنسان','قطع الغابات والصيد الجائر وتلوث المياه والتوسع العمراني قد تهدد أنواعًا بالانقراض فتتأثر كل الكائنات المرتبطة بها.'],['محميات مصر','في مصر محميات مثل رأس محمد (البحر الأحمر) ووادي الريان (الفيوم) وسانت كاترين، وتحمي الكائنات الحية وموائلها.']],
 act:'اختر كائنًا مهددًا بالانقراض في مصر وابحث عن سبب تهديده وكيف نحميه، ثم اعرض ما وجدته على زملائك.',
 qx:[['لو اختفت الأفاعي من منطقة فماذا يحدث غالبًا؟','تزيد القوارض','تقل القوارض','يزيد الثعلب فقط','تختفي النباتات فورًا','لأن عدوها الطبيعي اختفى.'],['أي إجراء يحافظ على التوازن؟','إنشاء المحميات','الصيد الجائر','قطع الأشجار','رمي المخلفات','المحميات تحمي الكائنات وموائلها من الصيد والتلوث فيبقى التوازن بين الكائنات.'],['سبب الاختلال في الشبكة الغذائية:','اختفاء نوع أو زيادته جدًا','سقوط المطر','طلوع الشمس','هبوب الرياح','عندما يختفي نوع أو يزيد عدده كثيرًا يتأثر ما يأكله وما يأكله فيختل التوازن كله.']]});
E('p5_4',{fun:'عندما ترى الماء يغلي فالفقاعات التي ترتفع هي بخار الماء، أي غاز من جسيمات الماء نفسها.',
 more:[['التغيرات بين الحالات','الانصهار: صلب إلى سائل. التجمد: سائل إلى صلب. التبخر: سائل إلى غاز. التكثف: غاز إلى سائل. وعند هذه التغيرات لا تتغير المادة نفسها بل ترتيب جسيماتها.'],['لماذا يملأ الغاز الإناء؟','لأن جسيماته متباعدة وسريعة وتتحرك في كل الاتجاهات فتنتشر حتى تملأ الحيز المتاح لها.']],
 act:'ضع مكعب ثلج في طبق ولاحظ انصهاره، ثم ضع الماء في فريزر وراقبه حتى يتجمد وسجّل الزمن.',
 qx:[['الشكل والحجم ثابتان في:','الصلب','السائل','الغاز','البخار','جسيمات الصلب مرتبة وقريبة جدًا ولا تتحرك إلا اهتزازًا، فيبقى الشكل والحجم ثابتين.'],['ماذا يحدث لقطرات الماء على كوب بارد؟','تكثف بخار الهواء','تبخر','تجمد','انصهار','الكوب البارد يبرد الهواء المجاور فيتكثف بخار الماء الموجود فيه إلى قطرات على سطحه.'],['عند تسخين الماء تتحرك جسيماته:','أسرع','أبطأ','بنفس السرعة','لا تتحرك','الحرارة تزيد طاقة الجسيمات فتتحرك أسرع، ولذلك يتبخر الماء عند التسخين.']]});
E('p5_5',{fun:'الخشب أخف من الماء فيطفو، وقطعة الحديد الصغيرة تغوص، لكن سفنًا ضخمة من الحديد تطفو لأن شكلها يحبس الهواء فتقل كثافتها الكلية.',
 more:[['كيف نقيس؟','نقيس الكتلة بميزان، ونقيس حجم السائل بالمخبار المدرج، وحجم الجسم غير المنتظم بغمره في الماء ونقيس الزيادة في الحجم.'],['الكثافة','كثافة المادة = الكتلة ÷ الحجم. كثافة الماء 1 جم/سم³، والزيت أقل منه ولذلك يطفو فوق الماء.']],
 act:'ضع في كوب ماء بعض الأجسام (خشب، مسمار، فلين، حجر) وسجّل ما يطفو وما يغوص ثم فسّره بالكثافة.',
 qx:[['كتلة جسم 20 جم وحجمه 10 سم³. كثافته؟','2 جم/سم³','200','0.5','30','الكثافة = الكتلة ÷ الحجم = 20 ÷ 10 = 2 جم/سم³.'],['زيت فوق الماء لأن:','كثافته أقل','كثافته أكبر','أبرد','أثقل','الزيت كثافته أقل من الماء، والمادة الأقل كثافة تطفو فوق الأكثر كثافة.'],['كيف نقيس حجم حجر صغير؟','بغمره في مخبار به ماء','بالميزان','بالمسطرة فقط','بالترمومتر','نضع الحجر في مخبار به ماء، والزيادة في مستوى الماء تساوي حجم الحجر.']]});
E('p5_6',{fun:'عند إشعال الشمعة يحدث تغيران معًا: ذوبان الشمع تغير فيزيائي، واحتراق الفتيل والشمع تغير كيميائي.',
 more:[['تغيرات عكسية وغير عكسية','التغير الفيزيائي غالبًا عكسي: ماء يتجمد ثم ينصهر. أما التغير الكيميائي غالبًا غير عكسي: لا يمكن إعادة الورق المحروق إلى ورق.'],['أمثلة من المطبخ','غليان الماء فيزيائي. خبز العجين وتحميص الخبز كيميائي. وتخمر اللبن كيميائي.']],
 act:'اخلط بيكربونات الصوديوم بالخل في كوب وراقب الفقاعات، واكتب ما يدل على أنه تغير كيميائي.',
 qx:[['أي تغيير كيميائي؟','حرق الورق','تمزيق الورق','طي الورق','قص الورق','حرق الورق ينتج رماد ودخان، أي مواد جديدة مختلفة عن الورق، ولا يمكن إرجاعها ورقًا.'],['ماذا يدل على حدوث تفاعل كيميائي؟','تكون غاز أو تغير اللون','تغير الشكل فقط','تغير الحجم فقط','الذوبان في الماء','تكوّن غاز أو تغير لون أو راسب أو حرارة علامات على تكوّن مادة جديدة.'],['صدأ الدراجة بعد تركها في المطر:','تغير كيميائي','تغير فيزيائي','انصهار','تبخر','الحديد مع الأكسجين والماء.']]});
E('p5_7',{fun:'نحو نصف الأكسجين على الأرض تنتجه كائنات حية دقيقة تعيش في المحيطات.',
 more:[['دورة الماء خطوة بخطوة','حرارة الشمس تبخر الماء من البحار والأنهار، والنباتات تطلق بخار الماء، ثم يتكثف في طبقات الجو الباردة سحبًا، ثم يسقط مطرًا أو ثلجًا ويجري في الأنهار إلى البحار.'],['الكائنات المائية','تعيش في الماء أسماك وطحالب وحيوانات تأخذ الأكسجين الذائب في الماء، وتحتاج درجة حرارة وملوحة مناسبة، وتلوث الماء يهددها.']],
 act:'ضع ماءً دافئًا في كوب وغطه بطبق بارد من الأعلى وراقب تكون قطرات على الغطاء، وفسّر ذلك بدورة الماء.',
 qx:[['ما الذي يسبب تبخر ماء البحر؟','حرارة الشمس','القمر','الجاذبية','الرياح فقط','الحرارة تحول الماء لبخار.'],['أين تتكون السحب؟','في الهواء البارد عاليًا','في التربة','في الماء','في الحجر','يرتفع بخار الماء إلى الجو البارد فيتكثف إلى قطرات صغيرة جدًا تكوّن السحب.'],['تلوث الماء يؤدي إلى:','موت كائنات مائية','نمو كل الأسماك','تحلية الماء','زيادة الأكسجين','الماء الملوث يقلل الأكسجين الذائب ويسمم الكائنات فتموت أو تنتقل بعيدًا.']]});
E('p5_8',{fun:'مصر تعتمد على نهر النيل في الجزء الأكبر من احتياجاتها المائية، لذلك الحفاظ عليه واجب على كل مواطن.',
 more:[['التحلية','تُنزع الأملاح من ماء البحر بتسخينه وتبخيره ثم تكثيف البخار، أو بمرشحات خاصة. وتنشئ مصر محطات تحلية على السواحل.'],['حلول ترشيد في البيت','نصلح الصنابير المتسربة، ونستخدم دشًا قصيرًا، ونجمع ماء الغسيل للري، ونروي النباتات فجرًا أو مساءً.']],
 act:'قس كمية الماء التي تُهدر من صنبور يقطر لمدة ساعة بوضع كوب تحته، ثم احسبها ليوم كامل.',
 qx:[['ماء البحر لا يصلح للشرب لأنه:','مالح','ملوّن','ساخن','كثيف جدًا','ماء البحر يحتوي نسبة عالية من الأملاح تضر الجسم عند شربها بكثرة.'],['أي سلوك يرشد استهلاك الماء؟','إغلاق الصنبور أثناء تنظيف الأسنان','غسل السيارة بالخرطوم دائمًا','ترك الصنبور يقطر','الاستحمام الطويل','إغلاق الصنبور أثناء تنظيف الأسنان يوفر عدة لترات في كل مرة.'],['لماذا نحافظ على نظافة النيل؟','لأنه مصدر ماء الشرب','لأنه جميل فقط','لأنه عميق','لأنه طويل','النيل مصدر مياه الشرب والزراعة لمعظم المصريين، وتلوثه يضر صحتنا وغذاءنا.']]});
E('p5_9',{fun:'رواد الفضاء على متن محطة الفضاء الدولية يطفون لأنهم في حالة سقوط حر دائم حول الأرض وليس لأن الجاذبية انعدمت.',
 more:[['الوزن والكتلة','الكتلة مقدار المادة وتبقى ثابتة في كل مكان، أما الوزن فهو قوة جذب الأرض وقد يتغير. فوزنك على القمر أقل لأن جاذبيته أضعف.'],['الجاذبية في حياتنا','تجعل الماء ينزل في الأنهار، وتبقي الغلاف الجوي حول الأرض، وتسبب المد والجزر بتأثير القمر والشمس.']],
 act:'أسقط كرة ورقة من نفس الارتفاع في وقت واحد وقارن سقوطهما، ثم أعد التجربة بورقة مكورة وفسّر دور الهواء.',
 qx:[['لماذا يختلف وزن رجل على القمر عن الأرض؟','لأن جاذبية القمر أقل','لأن كتلته تغيرت','لأنه أخف مادة','لأن القمر بلا هواء فقط','الوزن يعتمد على الجاذبية.'],['ما الذي يبقي القمر في مداره؟','جاذبية الأرض','الرياح','الضوء','المد','جاذبية الأرض تجذب القمر فتجعله يدور حولها ولا يبتعد في الفضاء.'],['إذا قذفت كرة للأعلى فإنها تعود لأن:','الجاذبية تجذبها للأرض','الهواء يدفعها','الضوء','الحرارة','جاذبية الأرض تجذب كل الأجسام نحو مركزها فتعود الكرة للأرض.']]});
E('p5_10',{fun:'النجم القطبي يبدو شبه ثابت في السماء الشمالية لأن محور دوران الأرض يشير تقريبًا نحوه، ولذلك استعمله المسافرون قديمًا لتحديد الشمال.',
