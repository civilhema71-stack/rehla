<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الدراسات</title>
<meta name='theme-color' content='#9a5b13'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-title' content='الدراسات'>

<style>
:root{--bg:#f3efe4;--card:#fffdf7;--ink:#2a2418;--mut:#6d6450;--acc:#9a5b13;--acc2:#1f7a8c;--ok:#1b8a4b;--bad:#c0392b;--line:#dcd2b8;--sea:#cfe6ee;--land:#ecdfb8;--lake:#8ec5dc;--river:#2b86b0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1812;--card:#26221a;--ink:#f1ead8;--mut:#b5ab92;--acc:#e0a24a;--acc2:#5cc0d4;--ok:#4cc68a;--bad:#ff7b6b;--line:#41392a;--sea:#17323c;--land:#4a4028;--lake:#2a6f8c;--river:#5cc0e8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;line-height:1.75}
main{max-width:620px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
h1{font-size:1.5rem;font-weight:900;margin:0}
h2.tm{font-size:1.25rem;margin:26px 0 4px;padding:6px 12px;border-radius:12px;background:var(--acc);color:#fff}h2.un{font-size:1.05rem;margin:20px 0 8px;color:var(--acc)}
h2.lt{margin:0 0 8px;font-size:1.3rem}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 14px;font-weight:700;white-space:nowrap;font:inherit;color:var(--ink)}
button.pill{cursor:pointer}
.sub{color:var(--mut);margin:0 0 12px}
.lv{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;font:inherit;cursor:pointer}
.lv[disabled]{opacity:.5;cursor:not-allowed}
.lv:focus-visible,.ch:focus-visible,.btn:focus-visible,.pin:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.lv b{display:block;font-size:1.05rem}.lv small{color:var(--mut)}
.badge{flex:none;width:44px;height:44px;border-radius:14px 14px 14px 4px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.2rem}
.stars{margin-inline-start:auto;color:#e8a317;letter-spacing:2px;white-space:nowrap}
.bar{display:block;height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--acc2);transition:width .3s}
.q{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.q p{margin:0 0 8px}.q .ip{color:var(--ink)}
.eq{font-size:1.35rem;font-weight:700;text-align:center;line-height:1.8}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 8px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{border-radius:16px;padding:12px 14px;margin:12px 0;border:2px solid var(--line);background:var(--card)}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}.fb h3,.info h3{margin:0 0 6px;font-size:1.1rem}.fb p,.info p{margin:4px 0}
.info{background:var(--card);border:2px solid var(--acc2);border-radius:16px;padding:12px 14px;margin:10px 0 4px;min-height:64px}
.btn{display:block;width:100%;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:13px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:8px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.end{text-align:center}.end .big{font-size:3rem;color:#e8a317;letter-spacing:6px}
.mapbox{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:6px;margin-bottom:8px}
svg.map{display:block;width:100%;height:auto;max-height:78vh;margin:0 auto;border-radius:12px}
.sea{fill:var(--sea)}.land{fill:var(--land);stroke:#9b8a5b;stroke-width:1.2}
.lake{fill:var(--lake);stroke:var(--river);stroke-width:.8}
.river{fill:none;stroke:var(--river);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rg{fill-opacity:.55;stroke:#fff;stroke-opacity:.8;stroke-width:1.4;cursor:pointer;transition:fill-opacity .2s}
.rg:hover,.rg.on{fill-opacity:.85}.rg.right{stroke:var(--ok);stroke-width:4;fill-opacity:.9}.rg.wrong{stroke:var(--bad);stroke-width:4}
text{font-family:Cairo,Tahoma,sans-serif;text-anchor:middle;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.sl{font-size:13px;fill:var(--mut);font-style:italic}
.rl{font-size:13px;font-weight:700;fill:#222;stroke:#fff;stroke-width:3px}
.pl{font-size:13px;font-weight:700;fill:var(--ink);stroke:var(--land);stroke-width:3.5px}
.pin{cursor:pointer}.pin .hit{fill:transparent}.pin .dot{fill:var(--bad);stroke:#fff;stroke-width:2.5px}
.pin.seen .dot{fill:var(--ok)}.pin.on .dot{r:9;stroke:var(--acc2);stroke-width:3px}
.pin.right .dot{fill:var(--ok);r:10}.pin.wrong .dot{fill:#555}
.credit{text-align:center;color:var(--mut);font-size:.95rem;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.credit b{color:var(--ink)}.credit p{margin:6px 0 0}.credit .me{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--acc);display:block;margin:0 auto}
details{border-top:1px solid var(--line);padding:6px 0}summary{cursor:pointer;font-weight:700;padding:4px 0;color:var(--acc)}details p{margin:4px 0 8px;line-height:1.9}
.ex h3{margin:12px 0 6px;font-size:1.1rem}.kt{margin:0;padding-inline-start:20px}.kt li{margin:3px 0}.rem{background:var(--bg);border:2px dashed var(--acc2);border-radius:12px;padding:10px 12px;margin-top:12px}
[hidden]{display:none!important}
.lvbox{display:flex;justify-content:space-between;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;margin-bottom:10px;font-weight:700}
.fun{border-color:#e8a317;background:linear-gradient(135deg,var(--card),rgba(232,163,23,.12))}.fun h3{margin:0 0 4px}
.card{display:block;width:100%;min-height:150px;background:var(--bg);border:3px dashed var(--acc2);border-radius:18px;padding:18px;font:inherit;color:var(--ink);cursor:pointer;text-align:center}
.card b{font-size:1.5rem}.card small{display:block;color:var(--mut);margin-bottom:8px}.card span{font-size:1.05rem;line-height:1.9}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50}
.conf{position:fixed;top:-10px;width:9px;height:14px;border-radius:2px;z-index:40;animation:cf 2.5s linear forwards;pointer-events:none}
@keyframes cf{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}}
</style>
</head>

{id:'d3',u:4,t:'مصر بين الحربين وطريق الاستقلال',d:'ثورة 1919 ومعاهدة 1936',map:'egypt',regs:[],lines:['NILE','ROSETTA','DAMIETTA','CANAL'],lakes:[],
 intro:['بعد الحرب العالمية الأولى طلب سعد زغلول ورفاقه تكوين «الوفد» للسفر إلى مؤتمر الصلح، فنفتهم بريطانيا إلى مالطة (مارس 1919) فاندلعت ثورة 1919 في كل مصر، وشاركت فيها المرأة.','صدر تصريح 28 فبراير 1922 باستقلال مصر مع تحفظات، ثم دستور 1923.','عُقدت معاهدة 1936 (النحاس)، وألغت اتفاقية مونترو (1937) الامتيازات الأجنبية. وأسس طلعت حرب بنك مصر (1920) لدعم الاقتصاد الوطني.'],
 pins:[P(31.24,30.04,'القاهرة','مركز الثورة والوفد، وفيها مظاهرات المرأة بقيادة هدى شعراوي، ومقر بنك مصر الذي أسسه طلعت حرب 1920.',{dx:14,dy:10}),P(31.0,30.79,'طنطا','من مدن الدلتا التي اشتعلت فيها ثورة 1919.',{dx:-10,dy:-8}),P(31.18,27.18,'أسيوط','امتدت الثورة إلى الصعيد (وأحداث ديروط بأسيوط).',{dx:10}),P(32.27,30.6,'الإسماعيلية','منطقة القناة التي حصرت المعاهدة وجود القوات البريطانية فيها (1936).',{dx:-10,dy:8}),P(29.92,31.2,'الإسكندرية','ميناء كبير شهد إضرابات ومظاهرات في ثورة 1919.',{dx:0})],

e0:{s:[
['الموقع والمساحة','تقع مصر في شمال شرق قارة أفريقيا، وتمتد بين دائرتي عرض 22° و31°35′ شمالًا وخطي طول 25° و36°55′ شرقًا تقريبًا. مساحتها نحو مليون كم². وتتصل بآسيا عن طريق شبه جزيرة سيناء، ولذلك يقال إنها تتوسط قارات العالم القديم. يحدها من الشمال البحر المتوسط، ومن الشرق البحر الأحمر وفلسطين، ومن الجنوب السودان، ومن الغرب ليبيا.'],
['وادي النيل والدلتا','النيل شريان الحياة في مصر. يدخلها من الجنوب عند حدود السودان ثم يصب في بحيرة ناصر خلف السد العالي، وبعد أسوان يجري في وادٍ ضيق يتسع شمالًا حتى القاهرة، ثم يتفرع إلى فرعي رشيد ودمياط ويكوّن الدلتا. أرض الوادي والدلتا طميية خصبة، ولذلك يعيش فيها نحو 95% من السكان على نحو 5% فقط من مساحة مصر. وهذا يفسر ازدحام السكان في هذا الإقليم.'],
['الصحراء الغربية','تشغل نحو ثلثي مساحة مصر، وهي هضبة منبسطة قليلة الارتفاع تتخللها منخفضات وواحات. أهم الواحات: سيوة والبحرية والفرافرة والداخلة والخارجة. وأعمق منخفضاتها منخفض القطارة (نحو 133 م تحت سطح البحر). من ثرواتها البترول والغاز والحديد، وتقوم في الواحات زراعة النخيل والزيتون والحبوب اعتمادًا على المياه الجوفية.'],
['الصحراء الشرقية','تمتد بين وادي النيل والبحر الأحمر، وتعلوها سلاسل جبال البحر الأحمر التي تزيد قممها على 2000 م، تقطعها أودية جافة (وديان) تجري فيها السيول بعد المطر. وتنتشر فيها الثروات المعدنية كالذهب والفوسفات والرخام والجرانيت، وتطل على ساحل غني بالشعاب المرجانية وبمدن سياحية مثل الغردقة ومرسى علم.'],
['شبه جزيرة سيناء','مساحتها نحو 6% من مساحة مصر، على شكل مثلث رأسه في الجنوب بين خليجي السويس والعقبة. جنوبها جبلي وفيه جبل كاترين (2629 م) أعلى قمة في مصر وجبل موسى ودير سانت كاترين، وشمالها سهل ساحلي رملي على البحر المتوسط. تفصلها قناة السويس عن باقي مصر. من ثرواتها البترول والمنجنيز والفيروز، وتشتهر بالسياحة في شرم الشيخ ودهب.'],
['السواحل والبحيرات','لمصر ساحلان: ساحل البحر المتوسط شمالًا وساحل البحر الأحمر وخليجي السويس والعقبة شرقًا. وفي شمال الدلتا بحيرات ساحلية مثل المنزلة والبرلس وإدكو ومريوط، وفي الفيوم بحيرة قارون، وجنوبًا بحيرة ناصر وهي أكبر بحيرة صناعية في مصر.']],
k:[['الدلتا','سهل مثلثي طميي يتكون من رواسب فرعي النيل'],['الواحة','منطقة منخفضة في الصحراء تتوافر فيها المياه الجوفية فتقوم عليها الزراعة'],['المنخفض','أرض أقل ارتفاعًا مما حولها وقد تقع تحت مستوى سطح البحر'],['الوادي (الجاف)','مجرى قديم لا تجري فيه المياه إلا بعد المطر']],
r:'مصر أربعة أقاليم: الدلتا والوادي (السكان والزراعة)، الصحراء الغربية (الأكبر)، الصحراء الشرقية (المعادن)، وسيناء (الجبال والسياحة).'},
a1:{s:[
['لماذا خرجت أوروبا تبحث عن طرق جديدة؟','بعد سقوط القسطنطينية في يد العثمانيين سنة 1453 صعب على التجار الأوروبيين المرور بالطرق التقليدية إلى الهند والشرق، حيث التوابل والحرير. فبحث الأوروبيون عن طريق بحري جديد. وشجّع ذلك الرغبة في الذهب والثروة، ونشر المسيحية، وحب الاستكشاف، ثم تقدم أدوات الملاحة كالبوصلة والإسطرلاب والسفن الشراعية الأقوى (الكارافيل).'],
['رحلة كولومبوس (1492)','كريستوفر كولومبوس بحّار من جنوة أقنع ملكي إسبانيا (إيزابيلا وفرديناند) بتمويل رحلة غربًا للوصول إلى الهند. أبحر في أغسطس 1492 بثلاث سفن (سانتا ماريا والبينتا والنينيا)، ووصل في 12 أكتوبر 1492 إلى جزر البهاما، وظن أنه وصل إلى الهند فسمّى السكان «الهنود الحمر» وسُميت المنطقة «الهند الغربية». قام بثلاث رحلات أخرى ومات وهو يعتقد أنها آسيا.'],
['تسمية القارة','الرحّالة أميريجو فسبوتشي (إيطالي) استكشف السواحل وأدرك أنها «عالم جديد» وليست آسيا، فأطلق الجغرافي فالدزيمولر اسم «أمريكا» على هذه الأرض نسبةً إليه (1507).'],
['كابرال وبالبوا وماجلان','البرتغالي بدرو كابرال وصل ساحل البرازيل عام 1500 فصارت مستعمرة برتغالية. الإسباني بالبوا عبر برزخ بنما عام 1513 ورأى المحيط الهادئ. وبعثة ماجلان (1519–1522) عبرت المضيق الذي يحمل اسمه جنوب القارة ثم عبرت المحيط الهادئ، وقُتل ماجلان في الفلبين لكن بقية رجاله أتموا أول رحلة حول العالم وأثبتوا كروية الأرض.'],
['كورتيز وبيزارو وكارتييه','هيرنان كورتيز غزا المكسيك (1519–1521) وأسقط الأزتك. وفرانسيسكو بيزارو أسقط إمبراطورية الإنكا في بيرو (1532–1533). وفي الشمال استكشف الفرنسي جاك كارتييه نهر سانت لورانس (1534) فكانت بداية الوجود الفرنسي في كندا.'],
['نتائج الكشوف','أقامت أوروبا مستعمرات في الأمريكتين ونهبت الذهب والفضة، وانتقلت محاصيل جديدة (البطاطس والذرة والطماطم) إلى العالم القديم ونقلت أوروبا القمح والخيول. لكن السكان الأصليين عانوا من الحروب والأمراض الجديدة، ونشطت تجارة الرقيق عبر الأطلسي.']],
k:[['الكشوف الجغرافية','رحلات بحرية للتعرف على أراضٍ وطرق جديدة'],['المستعمرة','أرض تسيطر عليها دولة أخرى'],['الإسطرلاب','أداة قديمة لتحديد الموقع في البحر بقياس ارتفاع النجوم'],['البرزخ','شريط ضيق من اليابسة يصل بين يابستين']],
r:'كولومبوس (1492 البهاما) – كابرال (1500 البرازيل) – بالبوا (1513 المحيط الهادئ) – ماجلان (1519 حول العالم) – كورتيز (المكسيك) – بيزارو (بيرو).'},
a2:{s:[
['الموقع والمساحة','تقع أمريكا الشمالية في نصف الكرة الغربي، تمتد من المحيط المتجمد الشمالي شمالًا حتى برزخ بنما جنوبًا. مساحتها نحو 24 مليون كم² وهي ثالث قارات العالم مساحة. يحدها المحيط الأطلسي شرقًا والمحيط الهادئ غربًا.'],
['الجبال الغربية','سلسلة جبال التوائية حديثة عالية تمتد على الساحل الغربي من ألاسكا حتى المكسيك، وتشمل الروكي والسييرا نيفادا والكاسكيد. أعلى قممها دينالي في ألاسكا (6190 م). وهي نشطة في البراكين والزلازل، وتتخللها هضاب وأحواض مثل هضبة كولورادو.'],
['السهول الوسطى','سهل واسع منبسط بين الروكي غربًا والأبلاش شرقًا، يخترقه نهر الميسيسيبي ومساعداته. تربتها خصبة فهي سلة غذاء القارة (القمح والذرة).'],
['جبال الأبلاش','جبال قديمة مستديرة القمم منخفضة نسبيًا (أعلى قمة جبل ميتشل نحو 2037 م) في شرق الولايات المتحدة بموازاة الأطلسي، وفيها الفحم.'],
['الدرع الكندي والأنهار والبحيرات','في الشمال هضبة قديمة صلبة تحيط بخليج هدسون وهي غنية بالمعادن والبحيرات. وتُعد البحيرات العظمى الخمس من أكبر مجموعات المياه العذبة في العالم، ويصل بينها وبين الأطلسي نهر سانت لورانس.'],
['هضبة المكسيك وأمريكا الوسطى','هضبة المكسيك بين سلسلتي سييرا مادري ويقع عليها العاصمة مكسيكو سيتي. وجنوبًا أمريكا الوسطى برزخ ضيق جبلي بركاني حار رطب، وتتصل المحيطات فيه عبر قناة بنما (1914). وإلى الشرق جزر الكاريبي.']],
k:[['الجبال الالتوائية','جبال تكونت بطي الصخور وتتميز بالارتفاع الشاهق'],['الدرع','كتلة صخرية قديمة صلبة'],['البرزخ','شريط يابس ضيق يصل بين يابستين'],['الرافد','نهر صغير يصب في نهر أكبر']],
r:'غرب: جبال عالية (الروكي)، وسط: سهول خصبة، شرق: الأبلاش، شمال: الدرع الكندي، جنوب: هضبة المكسيك وأمريكا الوسطى.'},
a3:{s:[
['الموقع والمساحة','تقع أمريكا الجنوبية جنوب برزخ بنما، يحدها الأطلسي شرقًا والهادئ غربًا، ومساحتها نحو 17.8 مليون كم² (رابع القارات). يمر بها خط الاستواء في الشمال، ويمتد جنوبها حتى قرب القطب.'],
['جبال الأنديز','أطول سلسلة جبلية فوق اليابسة (نحو 7000 كم) على الساحل الغربي، وهي حديثة التكوين فيها براكين وزلازل. أعلى قممها أكونكاجوا (6961 م) في الأرجنتين وهي أعلى قمة في العالم خارج آسيا. وبين سلاسلها هضاب مرتفعة تقع فيها بحيرة تيتيكاكا.'],
['حوض الأمازون','سهل منخفض واسع تقريبًا 7 ملايين كم² يجري فيه نهر الأمازون (نحو 6400 كم) وهو أكبر نهر في العالم من حيث كمية المياه. المناخ حار مطير فتغطيه أكبر غابات مطيرة في العالم.'],
['الهضاب القديمة','هضبة جويانا في الشمال وفيها شلال أنجل (979 م) أعلى شلال في العالم. وهضبة البرازيل في الشرق وهي أوسع الهضاب وأقل ارتفاعًا من الأنديز.'],
['السهول','سهول الأورينوكو (اليانوس) في الشمال، وسهول البامبا الخصبة في الأرجنتين وأوروجواي، ثم هضبة باتاجونيا الباردة الجافة في أقصى الجنوب.'],
['الصحراء الساحلية','صحراء أتاكاما في شمال تشيلي من أجف مناطق العالم لأن تيار همبولت البارد يقلل التبخر والمطر، وغنية بالنحاس.']],
k:[['حوض النهر','المنطقة التي تجمع مياه النهر وروافده'],['الظل المطري','منطقة قليلة المطر لأن جبالًا تحجب الرياح الممطرة'],['الشلال','سقوط مياه النهر من مكان مرتفع'],['السافانا','حشائش مدارية مع أشجار متفرقة']],
r:'الأنديز غربًا – سهول الأمازون والأورينوكو وسط – هضاب جويانا والبرازيل شرقًا – البامبا وباتاجونيا جنوبًا.'},
a4:{s:[
['لماذا هذه الحضارات مهمة؟','قبل وصول الأوروبيين أقام السكان الأصليون للأمريكتين حضارات متقدمة في الزراعة والعمارة والفلك. أشهرها المايا والأزتك في أمريكا الوسطى والإنكا في جبال الأنديز.'],
['حضارة المايا','ازدهرت في جنوب المكسيك (يوكاتان) وجواتيمالا وهندوراس نحو القرنين 3–9 للميلاد. أقامت دول مدن مستقلة مثل تيكال وتشيتشن إيتزا، وبنت أهرامات ومعابد ضخمة. اشتهرت بالكتابة الرمزية وبتقويم دقيق وعلم الفلك وبنظام عددي عرف مفهوم الصفر. زرعت الذرة والكاكاو.'],
['حضارة الأزتك','أقامت إمبراطورية في هضبة المكسيك، وأسست عاصمتها تينوختيتلان نحو 1325 على جزيرة في بحيرة تيكسكوكو، ثم صارت أكبر مدن العالم وقتها. بنت الأزتك الجسور وزرعت على «الجزر العائمة» (الشيناميباس) وكان لها جيش قوي. وسقطت على يد كورتيز عام 1521، وبُنيت مكسيكو سيتي فوق أنقاضها.'],
['حضارة الإنكا','أقامت أكبر إمبراطورية في أمريكا الجنوبية على طول الأنديز في بيرو وما حولها، وعاصمتها كوزكو. شقت شبكة طرق طويلة وبنت جسورًا معلّقة، وزرعت المدرجات الجبلية (البطاطس والذرة)، واستخدمت «الكيبو» (حبال معقودة) في التسجيل والحساب. من أشهر آثارها مدينة ماتشو بيتشو. أسقطها بيزارو بعد أسر الإمبراطور أتاهوالبا (1532).'],
['سقوطها ونهاية حضاراتها','ساعد على سقوطها تفوق الأوروبيين في السلاح (الحديد والبارود والخيول) وانتشار أمراض جديدة مثل الجدري لم يكن عند السكان مناعة ضدها، وتحالف أعداء هذه الدول مع الإسبان. وما زالت لغات وعادات هذه الشعوب باقية حتى اليوم.']],
k:[['الكيبو','حبال ملونة معقودة استخدمها الإنكا للتسجيل'],['المدرجات الزراعية','أراضٍ زراعية على سفوح الجبال على شكل درجات'],['الشيناميباس','جزر صناعية زراعية في البحيرة عند الأزتك'],['دولة المدينة','مدينة مستقلة لها حكومتها']],
r:'المايا: كتابة وفلك وتقويم (أمريكا الوسطى) – الأزتك: تينوختيتلان (المكسيك) – الإنكا: كوزكو وماتشو بيتشو (بيرو).'},
b1:{s:[
['مصر قبل محمد علي','بعد خروج الحملة الفرنسية (1801) عمّت الفوضى مصر بين المماليك والعثمانيين، وعانى الشعب من الظلم والضرائب. جاء محمد علي (ضابط ألباني من قولة) ضمن القوات العثمانية، واستغل الأحداث.'],
['توليه الحكم (1805)','ثار المصريون بقيادة العلماء وعلى رأسهم عمر مكرم ضد الوالي خورشيد باشا، واختاروا محمد علي واليًا، فأقرّه السلطان العثماني 1805. وفي 1807 هُزمت حملة فريزر الإنجليزية في رشيد. ثم تخلص من المماليك في مذبحة القلعة (1811) فاستقر له الحكم.'],
['الجيش والأسطول','أنشأ جيشًا نظاميًا حديثًا من المصريين (التجنيد الإجباري)، واستعان بخبراء أجانب مثل سليمان باشا الفرنساوي، وأنشأ ترسانة للسفن في الإسكندرية وبنى أسطولًا قويًا، وأقام مدارس حربية.'],
['التعليم والثقافة','أنشأ مدرسة الهندسة (1816) ومدرسة الطب (1827) ومدرسة الألسن (1835) وأرسل البعثات إلى أوروبا (منها بعثة رفاعة الطهطاوي إلى فرنسا 1826). أنشأ مطبعة بولاق وأصدر «الوقائع المصرية» (1828) وبدأ حركة الترجمة.'],
['الزراعة والصناعة','مسح الأراضي وألغى نظام الالتزام وحفر الترع (ترعة المحمودية 1820) وأقام القناطر الخيرية عند رأس الدلتا لتنظيم الري، وأدخل زراعة القطن طويل التيلة (جوميل 1821) فصار أهم المحاصيل النقدية. وأنشأ مصانع للغزل والنسيج والأسلحة والسكر.'],
['التوسع الخارجي ونهايته','أرسل جيوشه إلى الحجاز (1811–1818) والسودان (1820–1822 وأسس الخرطوم) وإلى المورة في اليونان (1824)، ثم إلى الشام بقيادة ابنه إبراهيم (1831–1833) وانتصر في قونية 1832. فخافت الدول الأوروبية فتدخلت، وانتهى الأمر بمعاهدة لندن 1840 التي حددت جيش مصر وحكمها الوراثي (فرمان 1841). توفي محمد علي 1849.']],
k:[['الوالي','حاكم الولاية من قبل السلطان العثماني'],['الالتزام','نظام جباية الضرائب القديم الذي ألغاه'],['البعثات','طلاب يُرسلون للدراسة في الخارج'],['الفرمان','قرار رسمي يصدره السلطان']],
r:'1805 تولي الحكم – 1811 مذبحة القلعة – جيش وأسطول – تعليم وبعثات – زراعة وقطن وقناطر – توسع ثم معاهدة لندن 1840 وفرمان 1841.'},
b2:{s:[
['خلفاء محمد علي','حكم بعده إبراهيم باشا (1848 وتوفي في العام نفسه)، ثم عباس الأول (1848–1854)، ثم سعيد (1854–1863)، ثم إسماعيل (1863–1879) ثم توفيق (1879–1892).'],
['عباس الأول وسعيد','في عهد عباس الأول بدأ إنشاء أول سكة حديد في أفريقيا بين الإسكندرية والقاهرة (1851) واكتملت في عهد سعيد. ومنح سعيد المهندس الفرنسي ديليسبس امتياز حفر قناة السويس (1854)، وأصدر قانون الأراضي 1858 الذي يعترف بملكية الفلاحين.'],
['إسماعيل ومشروعات النهضة','أراد إسماعيل أن تصبح مصر «قطعة من أوروبا». افتُتحت قناة السويس في نوفمبر 1869 بحضور ملوك وأمراء، وحصل من السلطان على لقب «الخديوي» (1867). أنشأ مجلس شورى النواب (1866) ودار الأوبرا (1869) ودار العلوم (1872) وكوبري قصر النيل، وزاد خطوط السكك الحديدية والتلغراف والمدارس والموانئ، وأنشأ أحياء جديدة في القاهرة.'],
['قناة السويس','قناة بحرية بين بورسعيد على المتوسط والسويس على البحر الأحمر (نحو 193 كم). بدأ الحفر 1859 بأيدي المصريين بالسخرة، وراح ضحيتها آلاف العمال. اختصرت طريق التجارة بين أوروبا وآسيا فأصبحت مطمعًا للدول الكبرى.'],
['الديون والتدخل الأجنبي','أنفق إسماعيل ببذخ واقترض بفوائد كبيرة حتى عجزت مصر عن السداد، فباع حصة مصر في أسهم القناة لبريطانيا (1875)، وفُرضت الرقابة الثنائية (بريطانيا وفرنسا) على المالية ثم عُزل إسماعيل عام 1879 وتولى ابنه توفيق، وهذا مهّد لثورة عرابي.']],
k:[['الخديوي','لقب منحه السلطان العثماني لحاكم مصر'],['الامتياز','حق منحته الدولة لشركة أو شخص لتنفيذ مشروع'],['السخرة','العمل الإجباري بلا أجر'],['الرقابة الثنائية','إشراف بريطانيا وفرنسا على مالية مصر']],
r:'سعيد: امتياز القناة – إسماعيل: افتتاحها 1869 ومجلس الشورى والنهضة – الديون ثم الرقابة الثنائية وعزل إسماعيل 1879.'},
c1:{s:[
['ما معنى النظام البيئي؟','هو مجموعة من الكائنات الحية (نباتات وحيوانات) تعيش في بيئة معينة وتتأثر بالمناخ والتربة والماء. والغابات أحد أهم النظم البيئية.'],
['الغابات المطيرة (الاستوائية)','تنتشر قرب خط الاستواء في حوض الأمازون وأمريكا الوسطى. حارة مطيرة طوال العام (حرارة نحو 26°م ومطر يزيد على 2000 مم). أشجارها عريضة الأوراق دائمة الخضرة طويلة في طبقات كثيفة يصل ضوء الشمس إلى الأرض بصعوبة. وتضم نصف أنواع الكائنات الحية تقريبًا، مثل جاكوار وثعبان الأناكوندا والببغاوات. ومن نباتاتها المطاط والكاكاو والماهوجني.'],
['الغابات الصنوبرية (التايجا)','في شمال كندا وألاسكا. الشتاء طويل شديد البرودة والصيف قصير، والمطر على شكل ثلوج. أشجارها إبرية مخروطية دائمة الخضرة (صنوبر وتنوب)، وتتحمل الثلج. فيها حيوانات الفراء والأيل والدب. تُستغل في صناعة الأخشاب والورق.'],
['الغابات المتساقطة الأوراق','في شرق الولايات المتحدة وجنوب شرق كندا حيث المناخ معتدل دافئ مطير. أشجارها عريضة الأوراق تُسقط أوراقها في الخريف مثل البلوط والزان والقيقب. أُزيل كثير منها لتصبح أراضي زراعية ومدنًا.'],
['غابات الساحل الغربي','على المحيط الهادئ (شمال غرب الولايات المتحدة وكندا) غابات مطيرة معتدلة فيها أشجار شديدة الارتفاع كالسكويا.'],
['حماية الغابات','يهددها قطع الأشجار والحرائق والزراعة، وتفقد الغابات المطيرة مساحات كبيرة. وتساعد حمايتها على حفظ التنوع الحيوي وتنقية الهواء.']],
k:[['دائمة الخضرة','أشجار لا تُسقط أوراقها كلها في وقت واحد'],['متساقطة الأوراق','أشجار تُسقط أوراقها في الخريف'],['التنوع الحيوي','تعدد أنواع الكائنات الحية'],['التايجا','الغابات الصنوبرية الشمالية']],
r:'مطيرة (الأمازون: حار مطير) – صنوبرية (كندا: بارد، أشجار إبرية) – متساقطة (شرق أمريكا: معتدل، تُسقط أوراقها).'},
c2:{s:[
['الحشائش المعتدلة','البراري في وسط أمريكا الشمالية (الولايات المتحدة وكندا): مناخ معتدل بين الجاف والرطب، حشائش متوسطة الطول وتربة سوداء خصبة. حوّلها الإنسان إلى أكبر منطقة لزراعة القمح والذرة، وكانت موطنًا لقطعان البيسون. والبامبا في الأرجنتين وأوروجواي: سهول خصبة لزراعة القمح وتربية الأبقار والأغنام.'],
['الحشائش المدارية (السافانا)','اليانوس في فنزويلا وكولومبيا حول نهر الأورينوكو، والكامبوس في هضبة البرازيل. مناخها حار فيه فصل مطير وفصل جاف. حشائشها طويلة وأشجارها متفرقة، وتُربى فيها الماشية، وفي البرازيل تُزرع فول الصويا والبن.'],
['صحارى أمريكا الشمالية','سونورا وموهافي وتشيواوا في جنوب غرب الولايات المتحدة وشمال المكسيك. حارة جافة، ينمو فيها الصبّار والشجيرات الشوكية، وتعيش فيها الزواحف.'],
['صحراء أتاكاما','في شمال تشيلي على ساحل الهادئ، من أجف صحارى العالم، لأن تيار همبولت البارد يقلل المطر وجبال الأنديز تحجب الرياح. غنية بالنحاس والنترات.'],
['صحراء باتاجونيا','هضبة باردة جافة في جنوب الأرجنتين تقع في ظل المطر شرق الأنديز، رياحها قوية، وتُربى فيها الأغنام للصوف.']],
k:[['السافانا','حشائش مدارية وأشجار متفرقة'],['ظل المطر','جهة جبلية جافة تقع خلف الجبال'],['الصبّار','نبات صحراوي يخزن الماء'],['البراري','حشائش معتدلة في أمريكا الشمالية']],
r:'حشائش معتدلة: البراري والبامبا – مدارية: اليانوس والكامبوس – صحارى: سونورا (حارة) وأتاكاما (شديدة الجفاف) وباتاجونيا (باردة).'},
c3:{s:[
['المحيطات والبحار','تحيط بالأمريكتين المحيطات الأطلسي شرقًا والهادئ غربًا والمتجمد الشمالي. وفي المياه الباردة مصايد غنية بالأسماك، مثل مصايد نيوفاوندلاند في الأطلسي، ومصايد بيرو على الهادئ بفضل تيار همبولت البارد. وتفرعت منها البحر الكاريبي وخليج المكسيك.'],
['الأنهار','في أمريكا الشمالية: الميسيسيبي–ميسوري (يصب في خليج المكسيك) وسانت لورانس (يصل البحيرات العظمى بالأطلسي). وفي الجنوبية: الأمازون (أكبر نهر في العالم) والأورينوكو وبارانا–البلاتا. وهي مصدر مياه وكهرباء وطرق نقل.'],
['البحيرات','البحيرات العظمى الخمس (سوبريور وميشيجان وهيورون وإيري وأونتاريو) تضم نحو خُمس مياه العالم العذبة السطحية، وتصلح للملاحة والصيد. ومن أعلى البحيرات في العالم بحيرة تيتيكاكا في الأنديز.'],
['الأراضي الرطبة والشعاب','في البرازيل البانتانال أكبر منطقة مستنقعات استوائية في العالم، وفي فلوريدا الإيفرجليدز. وتنمو الشعاب المرجانية في مياه الكاريبي الدافئة (وفيها ثاني أكبر حاجز مرجاني في العالم قرب بليز) وهي موطن آلاف الأنواع.'],
['المخاطر والحماية','الصيد الجائر هدد أسماك نيوفاوندلاند، والتلوث الصناعي ومخلفات الزراعة تلوث الأنهار والبحيرات، وارتفاع الحرارة يضر الشعاب المرجانية. وتحميها القوانين والمحميات والصيد المنظم.']],
k:[['المصب','المكان الذي يصب فيه النهر'],['الأراضي الرطبة','مناطق يغمرها الماء معظم العام'],['الشعاب المرجانية','بيئة بحرية ضحلة دافئة تبنيها كائنات صغيرة'],['الصيد الجائر','صيد الأسماك بأكثر مما تعوّضه الطبيعة']],
r:'محيطات وأنهار كبرى (الميسيسيبي والأمازون) وبحيرات عظمى وأراضٍ رطبة وشعاب، وتهددها الملوثات والصيد الجائر.'},
d1:{s:[
['أسباب الثورة','ديون إسماعيل والرقابة الثنائية ثم عزله (1879) أثارت غضب المصريين من تدخل الأجانب. وفي الجيش كان الضباط المصريون يعانون من تفضيل الأتراك والشراكسة عليهم في الرتب. وانتشرت أفكار الحرية والدستور.'],
['تطور الأحداث','في 9 سبتمبر 1881 تظاهر الجيش بقيادة أحمد عرابي أمام قصر عابدين أمام الخديوي توفيق وقدم مطالب الأمة: عزل الوزارة وتشكيل مجلس نواب ووضع دستور وزيادة عدد الجيش. وتروي الروايات أن عرابي قال للخديوي: «لقد خلقنا الله أحرارًا ولم يخلقنا تراثًا أو عقارًا». نجح المطلب فتشكلت وزارة شريف باشا ثم وزارة البارودي (1882) وكان عرابي وزير الحربية.'],
['التدخل الأجنبي','أرسلت بريطانيا وفرنسا «المذكرة المشتركة» (يناير 1882) تؤيد الخديوي ضد الحركة الوطنية، ثم وصلت السفن الحربية إلى الإسكندرية. وفي 11 يونيو 1882 وقعت أحداث شغب في الإسكندرية، وفي 11 يوليو 1882 ضرب الأسطول البريطاني المدينة بالمدافع.'],
['الهزيمة في التل الكبير','أنزلت القوات البريطانية بقيادة ولسلي في الإسماعيلية وسيطرت على القناة، وهاجمت معسكر عرابي في التل الكبير فجرًا في 13 سبتمبر 1882 فهُزم الجيش المصري، ودخل الإنجليز القاهرة.'],
['النتائج','بدأ الاحتلال البريطاني لمصر (1882) واستمر أكثر من 70 عامًا حتى الجلاء (1956). وحوكم عرابي وحُكم عليه بالإعدام ثم خُفف إلى النفي إلى جزيرة سيلان (سريلانكا) وعاد إلى مصر سنة 1901. ومع فشل الثورة، ظلت دروسها حية في وجدان المصريين.']],
k:[['الرقابة الثنائية','إشراف بريطانيا وفرنسا على مالية مصر'],['المذكرة المشتركة','رسالة بريطانية فرنسية لدعم الخديوي'],['الاحتلال','سيطرة دولة على أرض دولة أخرى بالقوة'],['النفي','إبعاد الشخص عن وطنه عقابًا']],
r:'9/9/1881 عابدين – 11/7/1882 ضرب الإسكندرية – 13/9/1882 التل الكبير – بدء الاحتلال البريطاني ونفي عرابي إلى سيلان.'},
d2:{s:[
['مصر تحت الاحتلال','حكم مصر فعليًا المعتمد البريطاني اللورد كرومر (1883–1907) بينما بقي الخديوي حاكمًا بالاسم. اهتم كرومر بالمالية وبالقطن لخدمة المصانع البريطانية وقلل الإنفاق على التعليم. ثم أخضعت بريطانيا السودان (1896–1898) وأقامت فيه حكمًا ثنائيًا مع مصر (1899). وفي 1904 اتفقت مع فرنسا (الاتفاق الودي) لتُطلق يدها في مصر.'],
['مصطفى كامل والحزب الوطني','مصطفى كامل (1874–1908) خطيب شاب نادى بالجلاء، وسافر إلى أوروبا ليعرّف العالم بقضية مصر، وأصدر جريدة «اللواء» (1900) وأسس المدارس الأهلية. وأسس الحزب الوطني عام 1907 ونادى بالدستور والجلاء. من أقواله الشهيرة: «لو لم أكن مصريًا لوددت أن أكون مصريًا». توفي شابًا في فبراير 1908.'],
['حادثة دنشواي (1906)','في يونيو 1906 خرج ضباط إنجليز للصيد بالحمام في قرية دنشواي بالمنوفية فاشتبكوا مع الفلاحين، وتوفي أحد الضباط بضربة شمس. شكلت السلطات محكمة خاصة قضت بإعدام أربعة وجلد وسجن آخرين أمام أهل القرية. أثارت الحادثة غضب المصريين وزادت كراهية الاحتلال، وفي العام التالي استقال كرومر.'],
['محمد فريد والحرب العالمية الأولى','خلف محمد فريد مصطفى كامل في رئاسة الحزب، لكنه اضطر إلى مغادرة مصر. ومع اندلاع الحرب (1914) أعلنت بريطانيا الحماية على مصر في ديسمبر 1914، وعزلت الخديوي عباس حلمي الثاني ونصّبت حسين كامل سلطانًا. وفرضت الأحكام العرفية واستولت على المحاصيل وسخّرت الفلاحين، فزاد الغضب.']],
k:[['المعتمد البريطاني','الحاكم الفعلي لمصر أثناء الاحتلال'],['الحماية','سيطرة دولة قوية على شؤون دولة أخرى مع بقائها بالاسم'],['الأحكام العرفية','قوانين استثنائية تفرضها السلطة العسكرية'],['الجلاء','خروج القوات الأجنبية']],
r:'كرومر 1883–1907 – اللواء 1900 – دنشواي 1906 – الحزب الوطني 1907 – الحماية البريطانية ديسمبر 1914.'},
d3:{s:[
['الوفد وبداية الثورة','بعد الحرب العالمية الأولى طلب سعد زغلول وعلي شعراوي وعبد العزيز فهمي (13 نوفمبر 1918) من المعتمد البريطاني السماح بالسفر لعرض قضية مصر، فرُفض الطلب وتكوّن «الوفد المصري» وجمع توكيلات من الشعب. اعتقلت بريطانيا سعدًا ونفته إلى مالطة في 8 مارس 1919 فاشتعلت الثورة في كل أنحاء مصر.'],
['ثورة 1919','تظاهر الطلبة والعمال والفلاحون والمرأة (مظاهرة السيدات في 16 مارس بقيادة هدى شعراوي وصفية زغلول)، وتعطلت المواصلات وسقط شهداء، واتحد المسلمون والأقباط تحت شعار «الدين لله والوطن للجميع». اضطرت بريطانيا لإطلاق سعد زغلول.'],
['تصريح 28 فبراير 1922 والدستور','أعلنت بريطانيا استقلال مصر مع أربعة تحفظات (أمن المواصلات البريطانية والدفاع وحماية الأجانب والسودان) فكان استقلالًا ناقصًا، وصار فؤاد ملكًا. ثم صدر دستور 1923 وفاز الوفد في الانتخابات وشكل سعد زغلول الوزارة (1924).'],
['الاقتصاد الوطني','أسس طلعت حرب بنك مصر (1920) وشركات مصرية كشركة مصر للغزل والنسيج، لتتحرر مصر اقتصاديًا من الأجانب.'],
['معاهدة 1936 ومونترو','وقّع مصطفى النحاس معاهدة 1936 مع بريطانيا: تتحالف الدولتان 20 سنة، وتنسحب بريطانيا من المدن وتبقى قواتها في منطقة القناة (نحو 10 آلاف جندي). ثم أنهت اتفاقية مونترو (1937) الامتيازات الأجنبية تدريجيًا، ثم بقيت مطالب الجلاء الكامل وتحقق بعد ثورة 23 يوليو 1952.']],
k:[['الوفد','الوفد المصري بقيادة سعد زغلول'],['تصريح 28 فبراير','إعلان بريطاني باستقلال ناقص لمصر'],['الامتيازات الأجنبية','حقوق خاصة للأجانب في مصر كمحاكم قنصلية'],['الدستور','القانون الأعلى الذي ينظم الحكم']],
r:'1918 الوفد – 1919 نفي سعد والثورة – 1922 تصريح 28 فبراير – 1923 الدستور – 1936 معاهدة النحاس – 1937 مونترو.'}
};

p5f:'قناة السويس تختصر رحلة السفن بين أوروبا وآسيا آلاف الكيلومترات مقارنة بالدوران حول أفريقيا.',

Z('z2',1,U1,'h1','١) حضارات شبه الجزيرة العربية قبل الإسلام','اليمن والشمال والحجاز','arab',
['شبه الجزيرة العربية أكبر شبه جزيرة في العالم (نحو ثلاثة ملايين كم²)، تحيط بها المياه من ثلاث جهات: الأحمر غربًا والخليج العربي والهندي شرقًا وجنوبًا. معظمها صحراء، لكن أطرافها وفيها اليمن ازدهرت.','اضغط على العلامات لتعرف أهم مراكز الحضارة.'],
[['أولًا: الموقع وأثره','موقع الجزيرة بين آسيا وأفريقيا جعلها طريقًا للتجارة بين الهند والصين شرقًا ومصر والشام والروم غربًا. وساعدت الصحراء على عزلتها فلم تُحتل بسهولة، وحافظت القبائل على لغتها العربية.'],['ثانيًا: حضارات الجنوب (اليمن)','أهم الممالك: معين (قرابة 1200 ق.م)، سبأ (أشهرها، وعاصمتها مأرب وفيها سد مأرب العظيم)، قتبان، حضرموت، ثم حمير (115 ق.م – 525م). اشتغل اليمنيون بالزراعة بفضل الأمطار الموسمية والسدود، وبتجارة اللبان والبخور والتوابل. وانهيار سد مأرب سبب هجرة قبائل (الأزد والغساسنة) إلى الشمال.'],['ثالثًا: حضارات الشمال','الأنباط عاصمتهم البتراء (جنوب الأردن) وسيطروا على طرق القوافل، وتدمر في الشام (الملكة زنوبيا)، والغساسنة (حلفاء الروم) والمناذرة في الحيرة (حلفاء الفرس)، وكندة في وسط الجزيرة.'],['رابعًا: الحجاز ومكة','مكة بناها إبراهيم وإسماعيل بالكعبة، وتولّت قريش خدمتها والسقاية والرفادة، وكانت مركزًا دينيًا وتجاريًا. وبفضل الإيلاف أقامت قريش رحلتي الشتاء إلى اليمن والصيف إلى الشام. ويثرب (المدينة) واحة زراعية يسكنها الأوس والخزرج وبعض اليهود.'],['خامسًا: الحياة الدينية والاجتماعية','عبد العرب الأصنام (هبل واللات والعزى ومناة) مع بقايا الحنيفية، وانتشرت اليهودية في يثرب وخيبر واليمن، والنصرانية في نجران. والمجتمع قبلي يقوم على العصبية، وللمرأة والرقيق أوضاع متفاوتة، وبرز الشعر ديوانًا للعرب وسوق عكاظ منتدى أدبيًا.']],
[['حمير','آخر الممالك اليمنية القديمة.'],['العصبية','تعصب الفرد لقبيلته.'],['الإيلاف','عهود التجارة لقريش مع الجوار.'],['الحنيفية','دين إبراهيم عليه السلام.']],'سبأ هي الملكة التي ذكرها القرآن في قصة سليمان، وعاصمتها مأرب.',

[['أولًا: قبل البعثة','وُلد يتيمًا (مات أبوه عبد الله وهو جنين وأمه آمنة وهو في السادسة)، فكفله جده عبد المطلب ثم عمه أبو طالب. اشتغل بالرعي والتجارة، وتزوج خديجة، وشارك في حلف الفضول، وحكّمته قريش في وضع الحجر الأسود.'],['ثانيًا: البعثة','نزل الوحي في غار حراء بأول سورة العلق وهو في الأربعين (610م). وأوائل المسلمين: خديجة وأبو بكر وعلي وزيد.'],['ثالثًا: الدعوة السرية والجهرية','استمرت السرية نحو ثلاث سنوات واجتمع المسلمون في دار الأرقم، ثم أمر الله بالجهر «فاصدع بما تؤمر» فصدع على الصفا. فاشتد أذى قريش وعذّبوا بلالًا وعمارًا وآل ياسر.'],['رابعًا: الهجرة إلى الحبشة والمقاطعة','هاجر المسلمون إلى الحبشة لدى النجاشي مرتين، وحاصرتهم قريش في شعب أبي طالب ثلاث سنوات (المقاطعة)، ثم عام الحزن بوفاة أبي طالب وخديجة.'],['خامسًا: الطائف والإسراء وبيعتا العقبة','عرض النبي دعوته على ثقيف بالطائف فردّوه، ثم الإسراء والمعراج، ثم بيعتا العقبة الأولى والثانية مع أهل يثرب فمهّدتا الهجرة.']],

[['أولًا: الهجرة','خرج ليلًا وعلي نائم في فراشه، واختبأ في غار ثور ثلاثة أيام، وسلك طريق الساحل مع دليل (ابن أريقط). واستُقبل في المدينة بالأنشودة «طلع البدر علينا». وبدأ التقويم الهجري في عهد عمر.'],['ثانيًا: بناء المسجد','بنى النبي ﷺ المسجد النبوي (قبله مسجد قباء) ليكون مكانًا للعبادة والشورى وتعليم الناس واستقبال الوفود.'],['ثالثًا: المؤاخاة','آخى بين المهاجرين والأنصار (فآخى بين عبد الرحمن بن عوف وسعد بن الربيع)، فذابت العصبيات وتقاسموا الأموال.'],['رابعًا: الصحيفة (وثيقة المدينة)','نظّمت العلاقة بين المسلمين وغيرهم، وأقرّت حرية الدين، وجعلت المدينة حرمًا آمنًا، ودفاع الجميع عنها مشترك، والمرجع في الخلاف رسول الله.'],['خامسًا: الاقتصاد والسوق','أنشأ سوقًا للمسلمين، وفرض الزكاة، ونظّم موارد الدولة.']],

Z('z2',1,U1,'h4','٤) المخاطر التي واجهت الدولة في المدينة','قريش واليهود والمنافقون','arab',

function mapSVG(L,mode,sel){
  const m=MAPS[L.map],k=W/((m.lon1-m.lon0)*m.c),H=Math.round((m.lat0-m.lat1)*k);
  const EG=L.map==='egypt'||L.map==='delta';

  let h=`<svg viewBox='0 0 ${W} ${H}' class='map' role='img' aria-label='خريطة'><defs><clipPath id='land'>`+LANDS.map(p=>`<polygon points='${pts(m,p)}'/>`).join('')+`</clipPath></defs><rect width='${W}' height='${H}' class='sea'/>`;
  h+=LANDS.map(p=>`<polygon points='${pts(m,p)}' class='land'/>`).join('');
  if(!EG)h+=`<polygon points='${pts(m,HUDSON)}' class='sea'/>`;
  if(EG){[['ليبيا',25.6,26.5],['السودان',29,21.9],['البحر المتوسط',28.5,32.0],['البحر الأحمر',36.2,25.6],['فلسطين',35.1,31.9]].forEach(a=>{const p=proj(m,a[1],a[2]);h+=txt(p[0],p[1],a[0],'sl')})}
  else if(m.lab){m.lab.forEach(a=>{const p=proj(m,a[1],a[2]);h+=txt(p[0],p[1],a[0],'sl')})}
  else{
    if(L.map==='na'||L.map==='all'){[['المحيط الأطلسي',-48,30],['المحيط الهادئ',-135,10]].forEach(a=>{const p=proj(m,a[1],a[2]);h+=txt(p[0],p[1],a[0],'sl')})}
    if(L.map==='sa'||L.map==='am'){const p=proj(m,-45,-40);h+=txt(p[0],p[1],'المحيط الأطلسي','sl');const q=proj(m,L.map==='sa'?-80.2:-108,-40);h+=txt(q[0],q[1],'المحيط الهادئ','sl')}
  }
  // مناطق
  const regs=(L.regs||[]).map(id=>Object.assign({id},RG[id]));
  regs.forEach(g=>{h+=`<polygon points='${pts(m,g.poly)}' clip-path='url(#land)' class='rg${sel==='r:'+g.id?' on':''}' data-r='${g.id}' style='fill:${g.c}'/>`});
  (L.lakes||[]).forEach(id=>{const v=LAKEMAP[id];if(!v)return;(Array.isArray(v[0][0])?v:[v]).forEach(pl=>{h+=`<polygon points='${pts(m,pl)}' class='lake'/>`})});
  (L.lines||[]).forEach(id=>{h+=`<polyline points='${pts(m,LINEMAP[id])}' class='river' ${id==='CANAL'?"style='stroke-width:2.2'":''}/>`});
  if(mode==='learn'||mode==='free')regs.forEach(g=>{const lp=g.lp||g.poly[0],p=proj(m,lp[0],lp[1]);h+=txt(p[0],p[1],g.n,'rl')});
  // علامات
  (L.pins||[]).forEach((pn,i)=>{
    let [x,y]=proj(m,pn.lon,pn.lat);x+=pn.dx||0;y+=pn.dy||0;
    const seen=(S.seen||{})[L.id+':'+i];
    if(mode==='locate'&&pn.noloc)return;
    h+=`<g class='pin${sel==='p:'+i?' on':''}${seen&&mode==='learn'?' seen':''}' data-p='${i}'><circle cx='${x.toFixed(1)}' cy='${y.toFixed(1)}' r='11' class='hit'/><circle cx='${x.toFixed(1)}' cy='${y.toFixed(1)}' r='6.5' class='dot'/>`;
    if(mode!=='locate')h+=txt(x,y-11,pn.n,'pl');
    h+='</g>';
  });
  return h+'</svg>';
}

    h+=`<button class="lv" data-i="${i}" ${open?'':'disabled'}><span class="badge">${open?(l.pool?'↻':i+1):'🔒'}</span><span><b>${l.t}</b><small>${l.d}</small></span><span class="stars">${'★'.repeat(st)+'☆'.repeat(3-st)}</span></button>`;
  });
  if(mis)h+=`<button class='btn' id='mis'>🔁 راجع أخطائي (${mis})</button>`;h+=`<button class='btn alt' id='rep'>📊 تقرير نقاط الضعف</button><button class='btn alt' id='inst'>📲 ثبّت التطبيق على جهازك</button><div class='fb' id='instbox' hidden><b>آيفون وآيباد:</b> Safari ← المشاركة ← «إضافة إلى الشاشة الرئيسية».<br><b>أندرويد:</b> Chrome ← ⋮ ← «تثبيت التطبيق».<br><b>ويندوز:</b> Edge أو Chrome ← أيقونة التثبيت. بعد أول فتح يعمل بدون إنترنت.</div>`;
  $('#home').innerHTML=h;
  document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{const l=ord[+b.dataset.i];l.pool?startQuiz(l):openLesson(l)});
  $('#chg').onclick=()=>{S.g=null;save();home()};
  $('#inst').onclick=()=>{$('#instbox').hidden=!$('#instbox').hidden};
  $('#rep').onclick=report;if($('#mis'))$('#mis').onclick=startMis;
}
/* ===== شرح الدرس + خريطة ===== */
function openLesson(L){
  $('#home').hidden=true;$('#quiz').hidden=true;$('#lesson').hidden=false;window.scrollTo(0,0);
  let sel=null;
  const seenCount=()=>L.pins.filter((_,i)=>(S.seen||{})[L.id+':'+i]).length;
  const draw=()=>{
    let h=`<div class='q'><h2 class='lt'>${L.t}</h2>${L.intro.map(p=>`<p class='ip'>${p}</p>`).join('')}</div>`;
    const X=L.x;
    if(X){h+=`<div class='q ex'><h3>📖 الشرح الكامل</h3>`+X.s.map((s,i)=>`<details ${i===0?'open':''}><summary>${s[0]}</summary><p>${s[1]}</p></details>`).join('')+`<h3>🔑 مصطلحات</h3><ul class='kt'>`+X.k.map(k=>`<li><b>${k[0]}:</b> ${k[1]}</li>`).join('')+`</ul><div class='rem'>✅ <b>تذكّر:</b> ${X.r}</div></div>`}
    if(FUN[L.id])h+=`<div class='q fun'><h3>💡 هل تعلم؟</h3><p>${FUN[L.id]}</p></div>`;h+=`<div class='mapbox'>${mapSVG(L,'learn',sel)}</div>`;
    if(L.pins.length)h+=`<p class='sub cnt'>🧭 اكتشفت ${seenCount()} من ${L.pins.length} علامات</p>`;
    h+=`<div class='info' id='info'>${infoHTML(L,sel)}</div>`;
    h+=`<button class='btn alt' id='cd'>🃏 بطاقات المراجعة</button><button class='btn' id='go'>ابدأ الأسئلة 🚀</button><button class='btn alt' id='bk'>رجوع للدروس</button>`;
    $('#lesson').innerHTML=h;
    $('#lesson').querySelectorAll('[data-p]').forEach(g=>g.onclick=()=>{const i=g.dataset.p;sel='p:'+i;S.seen=S.seen||{};S.seen[L.id+':'+i]=1;save();draw();$('#info').scrollIntoView({block:'nearest',behavior:'smooth'})});
    $('#lesson').querySelectorAll('[data-r]').forEach(g=>g.onclick=()=>{sel='r:'+g.dataset.r;draw();$('#info').scrollIntoView({block:'nearest',behavior:'smooth'})});
    $('#go').onclick=()=>startQuiz(L);$('#cd').onclick=()=>cards(L);$('#bk').onclick=home;
  };
  draw();
}
function infoHTML(L,sel){
  if(!sel)return `<p class='sub'>👆 اضغط على أي علامة أو منطقة على الخريطة ليظهر شرحها هنا.</p>`;
  if(sel[0]==='p'){const p=L.pins[+sel.slice(2)];return `<h3>📍 ${p.n}</h3><p>${p.t}</p>`}
  const g=RG[sel.slice(2)];return `<h3>🗺️ ${g.n}</h3><p>${g.t}</p>`;
}
/* ===== الأسئلة ===== */
let cur=null;
function mcItem(L,q){return{t:'mc',lid:L.id,q:q[0],a:q[1],ch:shuf(q.slice(1,5)),why:q[5]}}
function locItem(L){
  const cand=[];L.pins.forEach((p,i)=>{if(!p.noloc)cand.push({k:'p',i,n:p.n,w:p.t})});(L.regs||[]).forEach(id=>cand.push({k:'r',id,n:RG[id].n,w:RG[id].t}));
  if(!cand.length)return null;const c=cand[r(0,cand.length-1)];return{t:'loc',lid:L.id,c};
}
function startQuiz(L){
  let items=[];
  if(L.pool){
    const lessons=L.pool.map(byId);
    for(let i=0;i<10;i++){const l=lessons[r(0,lessons.length-1)];if(r(0,3)===0){const x=locItem(l);if(x){items.push(x);continue}}items.push(mcItem(l,l.qs[r(0,l.qs.length-1)]))}
  }else{
    items=shuf(L.qs).slice(0,6).map(q=>mcItem(L,q));
    for(let i=0;i<2;i++){const x=locItem(L);if(x)items.push(x)}
    items=shuf(items);
  }
  cur={L,items,k:0,score:0,streak:0};
  $('#home').hidden=true;$('#lesson').hidden=true;$('#quiz').hidden=false;$('#lvname').textContent=L.t;
  show();window.scrollTo(0,0);
}
function show(){
  const it=cur.items[cur.k];
  $('#prog').style.width=(cur.k/cur.items.length*100)+'%';$('#streak').textContent='🔥 '+cur.streak;
  $('#fb').hidden=true;$('#next').hidden=true;
  const A=byId(it.lid);
  if(it.t==='mc'){
    $('#ask').textContent=`سؤال ${cur.k+1} من ${cur.items.length}`;$('#eq').textContent=it.q;
    $('#chs').hidden=false;$('#chs').innerHTML=it.ch.map(c=>`<button class='ch'>${esc(c)}</button>`).join('');
    $('#qmap').hidden=true;
    document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>answer(b.textContent===it.a,b,it));
  }else{
    $('#ask').textContent=`سؤال ${cur.k+1} من ${cur.items.length} – اضغط على الخريطة`;$('#eq').textContent='اضغط على: '+it.c.n;
    $('#chs').hidden=true;const qm=$('#qmap');qm.hidden=false;qm.innerHTML=mapSVG(A,'locate',null);
    qm.querySelectorAll('[data-p]').forEach(g=>g.onclick=()=>answer(it.c.k==='p'&&+g.dataset.p===it.c.i,g,it));
    qm.querySelectorAll('[data-r]').forEach(g=>g.onclick=()=>answer(it.c.k==='r'&&g.dataset.r===it.c.id,g,it));
  }
}
function answer(good,el,it){
  if(cur.done===cur.k)return;cur.done=cur.k;
  const ss=S.st[it.lid]||(S.st[it.lid]={r:0,w:0,miss:{}});good?ss.r++:ss.w++;if(it.t==='mc'){S.mis=S.mis||{};const key=it.lid+'|'+it.q;if(good){if(it.rev)delete S.mis[key]}else S.mis[key]=1}
  if(!good&&it.t==='loc')ss.miss[it.c.n]=(ss.miss[it.c.n]||0)+1;
  document.querySelectorAll('.ch').forEach(b=>{b.disabled=true;if(it.t==='mc'&&b.textContent===it.a)b.classList.add('ok')});
  if(it.t==='loc'){const qm=$('#qmap');const sel=it.c.k==='p'?`[data-p='${it.c.i}']`:`[data-r='${it.c.id}']`;const t=qm.querySelector(sel);if(t)t.classList.add('right');if(!good&&el.classList)el.classList.add('wrong');
    qm.querySelectorAll('[data-p],[data-r]').forEach(g=>g.style.pointerEvents='none')}
  else if(!good)el.classList.add('no');
  const fb=$('#fb');fb.hidden=false;
  const why=it.t==='mc'?it.why:`📍 ${it.c.n}: ${it.c.w}`;
  if(good){clap();cur.score++;cur.streak++;const b=10+(cur.streak>=3?5:0);S.pts+=b;fb.className='fb ok';fb.innerHTML=`<h3>${['برافو! 🎉','ممتاز يا بطل! 💪','إجابة صح 👏','شاطر جدًا ⭐'][r(0,3)]} +${b} نقطة</h3><p>${why}</p>`}
  else{buzz();cur.streak=0;fb.className='fb no';fb.innerHTML=`<h3>${['مش مشكلة، الغلط بيعلّمنا 👇','قريب! راجع المعلومة 👇','خلينا نفهمها سوا 👇'][r(0,2)]}</h3>${it.t==='mc'?`<p>الإجابة الصحيحة: <b>${esc(it.a)}</b></p>`:''}<p>${why}</p>`}
  $('#pts').textContent=S.pts;$('#streak').textContent='🔥 '+cur.streak;save();
  const nx=$('#next');nx.hidden=false;nx.textContent=cur.k===cur.items.length-1?'شوف نتيجتك':'السؤال التالي';
  nx.onclick=()=>{cur.k++;cur.k>=cur.items.length?end():show()};nx.scrollIntoView({block:'nearest'});
}
function end(){
  const n=cur.items.length,p=cur.score/n,st=p>=1?3:p>=.8?2:p>=.6?1:0,L=cur.L;
  const d=S.d[L.id]||(S.d[L.id]={stars:0});if(st>d.stars)d.stars=st;save();if(st>=1)fanfare();if(st===3)confetti();bump();if(st>=1&&!S.d[L.id].done){S.d[L.id].done=1;S.pts+=20;toast('+20 نقطة لإتمام الدرس 🎉')}save();
  $('#prog').style.width='100%';$('#fb').hidden=true;$('#chs').hidden=true;$('#qmap').hidden=true;$('#next').hidden=true;
  $('#ask').textContent='النتيجة';
  $('#eq').innerHTML=`<div class='end'><div class='big'>${'★'.repeat(st)+'☆'.repeat(3-st)}</div><div>${cur.score} من ${n}</div><p class='sub'>${st>=1?'ممتاز! فتح الدرس التالي 🔓':'محتاج تراجع الشرح وتحاول تاني 💪'}</p><button class='btn' id='again'>إعادة المحاولة</button><button class='btn alt' id='tolist'>رجوع للدروس</button></div>`;
  $('#again').onclick=()=>L.id==='mis'?startMis():(L.pool?startQuiz(L):openLesson(L));$('#tolist').onclick=home;
}
function cards(L){
  const items=[];(L.pins||[]).forEach(p=>items.push([p.n,p.t]));if(L.x&&L.x.k)L.x.k.forEach(k=>items.push([k[0],k[1]]));(L.regs||[]).forEach(id=>items.push([RG[id].n,RG[id].t]));
  let i=0,flip=false;const order=shuf(items);
  const draw=()=>{const c=order[i];$('#home').hidden=true;$('#quiz').hidden=true;$('#lesson').hidden=false;window.scrollTo(0,0);
    $('#lesson').innerHTML=`<div class='q'><h2 class='lt'>🃏 ${L.t}</h2><p class='sub'>بطاقة ${i+1} من ${order.length} – اضغط على البطاقة لقلبها</p><button class='card' id='cb'>${flip?`<small>الشرح</small><span>${esc(c[1])}</span>`:`<small>المصطلح</small><b>${esc(c[0])}</b>`}</button></div><button class='btn' id='nx'>${i===order.length-1?'انتهت البطاقات ✓':'البطاقة التالية'}</button><button class='btn alt' id='bk2'>رجوع للدرس</button>`;
    $('#cb').onclick=()=>{flip=!flip;draw()};$('#nx').onclick=()=>{if(i>=order.length-1){openLesson(L);return}i++;flip=false;draw()};$('#bk2').onclick=()=>openLesson(L)};
  if(!order.length){toast('لا توجد بطاقات لهذا الدرس');return}draw();
}
function startMis(){
  const keys=Object.keys(S.mis||{});const items=[];
  shuf(keys).slice(0,10).forEach(k=>{const [lid,...q]=k.split('|');const L=byId(lid);if(!L)return;const qq=L.qs.find(x=>x[0]===q.join('|'));if(qq){const it=mcItem(L,qq);it.rev=1;items.push(it)}});
  if(!items.length){S.mis={};save();home();return}
  const L={id:'mis',t:'مراجعة أخطائي',pool:[],qs:[]};
  cur={L,items,k:0,score:0,streak:0};
  $('#home').hidden=true;$('#lesson').hidden=true;$('#quiz').hidden=false;$('#lvname').textContent=L.t;show();window.scrollTo(0,0);
}
function report(){
  $('#home').hidden=true;$('#lesson').hidden=false;
  let rows=LS.filter(l=>l.g===S.g).map(l=>{const s=S.st[l.id]||{r:0,w:0,miss:{}},t=s.r+s.w;return{l,t,acc:t?Math.round(100*s.r/t):null,miss:s.miss||{}}}).filter(x=>x.t>0).sort((a,b)=>a.acc-b.acc);
  let h=`<div class='q'><h2 class='lt'>📊 تقرير نقاط الضعف</h2>`;
  if(!rows.length)h+=`<p class='ip'>لسه مفيش إجابات. جرّب درسًا الأول.</p>`;
  rows.forEach(x=>{const m=Object.entries(x.miss).sort((a,b)=>b[1]-a[1]).map(e=>e[0]).slice(0,3);h+=`<p class='ip'><b>${x.l.t}</b>: ${x.acc}% (${x.t} إجابة)<span class='bar'><i style='width:${x.acc}%'></i></span>${x.acc<70?'⚠️ يحتاج مراجعة':'✅ جيد'}${m.length?`<br><small>أماكن أخطأت فيها: ${m.join('، ')}</small>`:''}</p>`});
  h+=`</div><button class='btn alt' id='hb'>رجوع</button>`;$('#lesson').innerHTML=h;$('#hb').onclick=home;
}
$('#snd').onclick=()=>{snd=!snd;$('#snd').textContent=snd?'🔊':'🔇'};
$('#back').onclick=home;
bump();home();

</script>
